name: Radio Jam verification workspace
on:
  push:
    branches: [feat/native-puzzle-20261016b]
    paths: [.github/workflows/radiojam_workspace.yml]
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          sparse-checkout: |
            core
            .agents
            .codex
            .github
            docs
            scripts
            solver
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: core/package.json
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: core/pnpm-lock.yaml
      - name: Install locked dependencies
        working-directory: core
        run: pnpm install --frozen-lockfile
      - name: Inspect actual native geometry
        working-directory: core/packages/client
        run: |
          node --input-type=module <<'JS'
          import {getPuzzleGeometryByDesc} from 'cubing/puzzle-geometry';
          const depth = 5 - 2*Math.sqrt(5) - 0.06;
          const pg=getPuzzleGeometryByDesc(`i f ${depth}`, {allMoves:true,orientCenters:true,addRotations:true});
          const data=pg.get3d();
          console.log('RADIO_JAM_PROBE', JSON.stringify({depth, perFace:pg.stickersPerFace,raw:data.stickers.length, visible:data.stickers.filter(s=>!s.isDup).length,orbits:pg.getKPuzzleDefinition(true).orbits}));
          JS
