name: Radio Jam verification workspace

on:
  push:
    branches: [feat/native-puzzle-20261016b]
    paths:
      - .github/workflows/radiojam_workspace.yml

permissions:
  contents: read

jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Package tracked development sources without credentials or build products
        shell: bash
        run: |
          mkdir -p /tmp/radiojam-workspace
          git ls-files -z AGENTS.md .agents .codex .github core docs ops scripts solver > /tmp/radiojam-files
          python3 - <<'PY'
          import os, tarfile
          paths = open('/tmp/radiojam-files', 'rb').read().split(b'\0')
          excluded = ('core/packages/client/public/', 'core/apps/fmc-solver/', 'solver/tables/', 'solver/target/')
          with tarfile.open('/tmp/radiojam-workspace/sources.tar.gz', 'w:gz') as archive:
              for raw in paths:
                  path = os.fsdecode(raw)
                  if path and not path.startswith(excluded) and os.path.isfile(path) and os.path.getsize(path) < 2000000:
                      archive.add(path, recursive=False)
          PY
          ls -lh /tmp/radiojam-workspace/sources.tar.gz
          git rev-parse HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: radiojam-development-sources
          path: /tmp/radiojam-workspace/sources.tar.gz
          retention-days: 2
