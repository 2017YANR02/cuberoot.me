name: Local artifact lifecycle
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  lifecycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: node --test scripts/local-artifacts/check.test.mjs
