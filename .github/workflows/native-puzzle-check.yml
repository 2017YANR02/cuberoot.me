name: Cube2Heli browser acceptance

on:
  push:
    branches: [codex/cube2heli-acceptance-20261013]
    paths: ['.github/workflows/native-puzzle-check.yml']

permissions:
  contents: read
concurrency:
  group: cube2heli-browser-acceptance
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/cube2heli-acceptance-20261013
          persist-credentials: false
          filter: blob:none
          sparse-checkout: |
            core
            .github
            docs
            .codex
            .githooks
            tools/cstimer-scramble
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: core/package.json
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: core/pnpm-lock.yaml
      - name: Install locked dependencies and build native packages
        working-directory: core
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @cuberoot/client build:deps
      - name: Use only observable public UI for closed-shadow players
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/cube2heli-browser.mjs')
          s = p.read_text()
          s = s.replace("import { chromium, expect }", "import { chromium, expect as baseExpect }")
          s = s.replace("const base =", "const expect = baseExpect.configure({ timeout: 30000 });\nconst base =", 1)
          old = """    const polygons = page.locator('.twisty-container svg polygon');
              await expect(polygons).toHaveCount(48);
              const colors = () => polygons.evaluateAll(nodes => nodes.map(n => n.getAttribute('style') || n.getAttribute('fill')).join('|'));"""
          new = """    // cubing.js uses closed shadow roots: verify its visible public host,
              // not an inaccessible canvas. Complete polygon counts are checked
              // independently in the native-model suite and public Timer/gen SVGs.
              const host = page.locator('.twisty-container');
              await expect(host.locator('twisty-player')).toBeVisible();
              const colors = async () => (await host.screenshot()).toString('base64');"""
          assert old in s
          s = s.replace(old, new)
          s = s.replace("await expect(shared.locator('.twisty-container svg polygon')).toHaveCount(48);", "await expect(shared.locator('.twisty-container twisty-player')).toBeVisible();")
          s = s.replace("await expect(page.locator('.twisty-container svg polygon')).toHaveCount(48);", "await expect(page.locator('.twisty-container twisty-player')).toBeVisible();")
          s = s.replace("open('/sim?puzzle=cube2heli')", "open('/en/sim?puzzle=cube2heli')")
          start = s.index('async function selectGeneratorPuzzle(page) {')
          end = s.index("for (const mode of ['batch'", start)
          s = s[:start] + """async function selectGeneratorPuzzle(page) {
            const trigger = page.locator('.gen-config-toolbar .pp-trigger:visible').first();
            await trigger.click();
            const target = page.getByRole('menuitemcheckbox', { name: /二阶＋直升机/ });
            await target.click();
            if (!await page.locator('.pp-popup:visible').count()) await trigger.click();
            const others = page.locator('.pp-popup:visible [role="menuitemcheckbox"][aria-checked="true"]').filter({ hasNotText: '二阶＋直升机' });
            for (let i = 0; i < 20 && await others.count(); i++) {
              await others.first().click();
              if (!await page.locator('.pp-popup:visible').count()) await trigger.click();
            }
            await page.keyboard.press('Escape');
          }
          """ + s[end:]
          s = s.replace("page.locator('.gen-tn-attempt-preview')", "page.locator('.gen-tn-attempt-preview:visible')")
          s = s.replace("page.locator('.gen-tn-attempt-line')", "page.locator('.gen-tn-attempt-line:visible')")
          s = s.replace("const canvas = page.locator('.twisty-container canvas').first();", "const canvas = page.locator('.twisty-container');")
          Path('core/packages/client/.cube2heli-browser.mjs').write_text(s)
          PY
      - name: Chromium UI acceptance
        working-directory: core/packages/client
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm dev > /tmp/native-puzzle-dev.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          node .cube2heli-browser.mjs
      - name: Collect screenshots, DOM and reproducible acceptance script
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cube2heli-browser-acceptance
          path: |
            /tmp/native-puzzle-browser
            /tmp/native-puzzle-dev.log
            core/packages/client/.cube2heli-browser.mjs
          include-hidden-files: true
          retention-days: 7
