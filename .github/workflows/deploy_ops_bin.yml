# 部署 ops/bin/ 下的 shell 脚本到 cuberoot.me /usr/local/bin/。
# 改 ops/bin/*.sh → push → 自动 scp + chmod + bash -n 语法检查。
# 失败自动回滚到 .bak。
name: Deploy ops/bin scripts

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ops/bin/**'
      - 'ops/systemd/pg-dump-recon.service'
      - '.github/workflows/deploy_ops_bin.yml'

concurrency:
  group: deploy-ops-bin
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DEPLOY_STAGE: /tmp/cuberoot-ops-bin-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id
          chmod 600 ~/.ssh/id
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: scp scripts to staging
        id: staging
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          [[ "$DEPLOY_STAGE" =~ ^/tmp/cuberoot-ops-bin-[0-9]+-[0-9]+$ ]] || exit 1
          ssh -i ~/.ssh/id "$DEPLOY_USER@$DEPLOY_HOST" bash -s -- "$DEPLOY_STAGE" <<'REMOTE'
          set -euo pipefail
          DEPLOY_STAGE=$1
          [[ "$DEPLOY_STAGE" =~ ^/tmp/cuberoot-ops-bin-[0-9]+-[0-9]+$ ]] || exit 1
          [[ ! -L /tmp && "$(realpath -e -- /tmp)" = /tmp ]] || exit 1
          umask 077
          mkdir -- "$DEPLOY_STAGE"
          REMOTE
          echo 'created=true' >> "$GITHUB_OUTPUT"
          scp -o ServerAliveInterval=30 -o ServerAliveCountMax=3 -i ~/.ssh/id \
            ops/bin/*.sh "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_STAGE/"
          scp -i ~/.ssh/id ops/systemd/pg-dump-recon.service \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_STAGE/cuberoot-pg-dump-recon.service"

      - name: Apply + bash -n + rollback on failure
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          # 注意:此处 ssh 不能带 -n —— 远端脚本经 heredoc 走 stdin,-n 会把 stdin 重定向到
          # /dev/null 丢掉整个 heredoc,bash -s 收不到任何命令 → 静默空跑(报 success 却什么都没部署).
          ssh -T -o ServerAliveInterval=30 -o ServerAliveCountMax=3 -i ~/.ssh/id \
            "$DEPLOY_USER@$DEPLOY_HOST" bash -s -- "$DEPLOY_STAGE" <<'REMOTE'
          set -euo pipefail
          DEPLOY_STAGE=$1
          [[ "$DEPLOY_STAGE" =~ ^/tmp/cuberoot-ops-bin-[0-9]+-[0-9]+$ ]] || exit 1
          [[ -d "$DEPLOY_STAGE" && ! -L "$DEPLOY_STAGE" && -O "$DEPLOY_STAGE" ]] || exit 1
          [[ "$(realpath -e -- "$DEPLOY_STAGE")" = "$DEPLOY_STAGE" ]] || exit 1
          DEST=/usr/local/bin
          TS=${DEPLOY_STAGE##*/}
          replace_file() {
            local source=$1 target=$2 mode=$3 next
            next=$(mktemp "$(dirname "$target")/.cuberoot-deploy.XXXXXXXX")
            if ! install -m "$mode" -- "$source" "$next" || ! mv -f -- "$next" "$target"; then
              rm -f -- "$next"
              return 1
            fi
          }

          # bash -n 语法检查所有 staging 脚本(语法错就 abort,不动现网)
          UNKNOWN_FOUND=0
          for f in "$DEPLOY_STAGE"/*.sh; do
            [ -f "$f" ] || continue
            base=$(basename "$f")
            # 只接受我们认得的脚本名,防止误传别的 .sh
            case "$base" in
              apply_load.sh|apply_migrations.sh|dump_fingerprints.sh|dump_sor_inputs.sh|pg-dump-recon.sh) ;;
              *)
                # ⚠️ 警告但不 abort;若 ops/bin/ 加了新 .sh 但忘了改 case,日志能发现
                echo "::warning::SKIP unknown $base — add to case list in deploy_ops_bin.yml"
                UNKNOWN_FOUND=1
                continue
                ;;
            esac
            if ! bash -n "$f"; then
              echo "ERROR: bash -n failed on $base, abort"
              exit 1
            fi
          done
          [ "$UNKNOWN_FOUND" = 1 ] && echo "(some unknown scripts skipped above; check warning lines)"

          # cmp 跳过无变化 + 备份现网 + 替换 + chmod
          for f in "$DEPLOY_STAGE"/*.sh; do
            [ -f "$f" ] || continue
            base=$(basename "$f")
            case "$base" in
              apply_load.sh|apply_migrations.sh|dump_fingerprints.sh|dump_sor_inputs.sh|pg-dump-recon.sh) ;;
              *) continue ;;
            esac
            target="$DEST/$base"
            if [ -f "$target" ] && cmp -s "$target" "$f"; then
              echo "no-op: $base unchanged"
              rm -f "$f"
              continue
            fi
            if [ -f "$target" ]; then
              cp "$target" "${target}.bak-${TS}"
              echo "backup: ${target}.bak-${TS}"
            fi
            replace_file "$f" "$target" 0755
            rm -f "$f"
            echo "deployed: $base"
          done
          # Native EnvironmentFile supplies DB_PASS even when systemd has no NVM PATH.
          unit=/etc/systemd/system/pg-dump-recon.service
          if ! cmp -s "$unit" "$DEPLOY_STAGE/cuberoot-pg-dump-recon.service"; then
            mkdir -p /var/backups/cuberoot-ops-units
            [ ! -f "$unit" ] || cp "$unit" "/var/backups/cuberoot-ops-units/pg-dump-recon.service.$TS"
            replace_file "$DEPLOY_STAGE/cuberoot-pg-dump-recon.service" "$unit" 0644
            systemctl daemon-reload
          fi
          echo "OK"
          REMOTE

      - name: Remove this run's staging files
        if: ${{ always() && steps.staging.outputs.created == 'true' }}
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/id "$DEPLOY_USER@$DEPLOY_HOST" bash -s -- "$DEPLOY_STAGE" <<'REMOTE'
          set -euo pipefail
          DEPLOY_STAGE=$1
          [[ "$DEPLOY_STAGE" =~ ^/tmp/cuberoot-ops-bin-[0-9]+-[0-9]+$ ]] || exit 1
          [[ ! -L "$DEPLOY_STAGE" ]] || exit 1
          [ -e "$DEPLOY_STAGE" ] || exit 0
          [[ -d "$DEPLOY_STAGE" && -O "$DEPLOY_STAGE" ]] || exit 1
          [[ "$(realpath -e -- "$DEPLOY_STAGE")" = "$DEPLOY_STAGE" ]] || exit 1
          find "$DEPLOY_STAGE" -xdev -mindepth 1 -maxdepth 1 -type f -delete
          rmdir -- "$DEPLOY_STAGE"
          REMOTE
