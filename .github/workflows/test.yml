# 前端测试 — vitest 单元 + 算法回归
# 触发：PR 打开/更新,或推 main 时 core/ 有改动
name: Test

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'core/**'
      - '.github/workflows/test.yml'
  push:
    branches: [main]
    paths:
      - 'core/**'
      - '.github/workflows/test.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # 只需 core/(根有 stats/ 709MB + tools/ 等 ~1GB 静态残留);blob:none partial clone 跳过下载.
      # 例外:tools/cstimer-scramble(519K)是非 WCA 求解器测试的打乱 oracle,必须拉进来,
      # 否则 bic/cm3/heli/helicv/ctico/sia222 的 "≥200 real cstimer scrambles" 全 0 条变红.
      # 例外:仓库级守卫入口 —— code-guards-drift / recon-ground-truth-gate 会同时断言
      # .codex/hooks、.codex/hooks.json、.githooks/pre-commit 存在,三处必须一起拉取。
      # 例外:tools/blddb/data/*Manmade.json —— blddb_lookup.test.ts 拿真实库验十套 case
      # 的编码契约(代表元唯一 / 覆盖完整)。角(1.1MB)+ 奇偶 / 翻角 / 翻棱 / 奇偶带翻
      # (四套合计 ~450KB)都点名;只有棱那套 1.6MB 留给本地 —— 同样的不变量角已经能证,
      # CI 上不值这个下载量。高阶只点翼棱(等价类只有循环移位这条新路径 + 镜像要翻手性)
      # 和中棱(高阶命名 + 换贴纸那条路径),角心 / 边心与翼棱同规则,再拉 1.1MB 是重复。
      # 缺文件的类型测试会自动 skip,不会红。
      # 例外:stats/scramble 下那两个小 JSON —— skip_probability / skewb_odds 拿它们跟站上
      # 已发布的数据对表;整个 stats/scramble 是 235MB(downloads/ 占大头),所以只点名到文件.
      # 例外:all_past_comps.json —— H2H 回归会核对已提交比赛快照中的真实赛制标记。
      # 点名到文件就必须关 cone 模式(cone 只认目录),模式改成 gitignore 风格、前导 / 锚定仓库根.
      - uses: actions/checkout@v6
        with:
          sparse-checkout-cone-mode: false
          # 注:cross-solver-worker.js 是 rust_cross_table_sets.test.ts 的比对对象(手维护
          # worker ↔ TABLE_SETS 契约)。**只列这一个文件** —— 同目录 tables/ 是 30MB+ 的
          # .bin.gz,整目录拉进来会拖垮 checkout。
          sparse-checkout: |
            /core/
            /docs/platform-unification-plan.md
            /ops/nginx/www.cuberoot.me.conf
            /tools/cstimer-scramble/
            /tools/solver/rust-cross/cross-solver-worker.js
            /tools/blddb/data/cornerManmade.json
            /tools/blddb/data/parityManmade.json
            /tools/blddb/data/twistsManmade.json
            /tools/blddb/data/flipsManmade.json
            /tools/blddb/data/ltctManmade.json
            /tools/blddb/data/bigbld/wingManmade.json
            /tools/blddb/data/bigbld/midgeManmade.json
            /.codex/hooks/
            /.codex/hooks.json
            /.github/workflows/stats.yml
            /.githooks/pre-commit
            /stats/all_past_comps.json
            /stats/scramble/2x2_essential.json
            /stats/scramble/puzzle_distribution.json
            /stats/scramble/recent_scrambles.json
            # scramble_exact_dist.test.ts 拿它当「WCA 那套菜单」的真源逐项比对(420KB)。
            /stats/scramble/distribution.json
          filter: blob:none

      - uses: pnpm/action-setup@v6
        with:
          # 版本单一源:core/package.json 的 packageManager。别在这里写 version —— 两处会打架。
          package_json_file: core/package.json

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: core/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: core
        run: pnpm install --frozen-lockfile

      # client typecheck 走 tsgo --noEmit,不像旧 tsc -b 会自建 project references,
      # 它 import @cuberoot/shared + visualcube 的产物;server tsconfig references 这两个,
      # tsc 启动校验它们的 dist/.d.ts 必须存在(TS6305)。所以先 build 再 typecheck。
      # skewb-notation 测试也走 shared 的 node 导出(dist),同样要先 build。
      - name: Build shared deps
        working-directory: core
        run: |
          pnpm --filter @cuberoot/shared build
          pnpm --filter @cuberoot/visualcube build
          pnpm --filter @cuberoot/vendor-sr-puzzlegen build

      - name: Typecheck client
        working-directory: core
        run: pnpm --filter @cuberoot/client typecheck

      # esbuild bundle 只剥类型不检查,server 类型坏了 deploy_core build 仍能过
      # → 必须 CI 真跑 tsc --noEmit 兜底。
      - name: Typecheck server
        working-directory: core
        run: pnpm --filter @cuberoot/server typecheck

      - name: Test server
        working-directory: core
        run: pnpm --filter @cuberoot/server test

      - name: Verify Mini Program
        working-directory: core
        run: pnpm --filter @cuberoot/miniprogram check

      # 常规全集不和 analyzer_worker 慢测争 CPU；后者由独立 job 并行覆盖。
      - name: Test fast suite
        working-directory: core
        run: pnpm --filter @cuberoot/client test

      # 死代码棘轮:只卡已清零的类别(unused files / deps / unlisted / binaries),
      # 不卡 unused exports/types(649/221,过度导出噪声,另行收敛)。配置见 core/knip.json。
      - name: Knip dead-code guard
        working-directory: core
        run: pnpm exec knip --include files,dependencies,unlisted,binaries --no-config-hints

  # 移动端与网站共享 timer 内核，但有独立的 Vite/Capacitor/Gradle 构建链。
  # 单独并行跑，既锁住共享契约，也不会拉长前端快测的关键路径。
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            core
          filter: blob:none

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: core/package.json

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: core/pnpm-lock.yaml

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install dependencies
        working-directory: core
        run: pnpm install --frozen-lockfile

      - name: Build shared timer core
        working-directory: core
        run: pnpm --filter @cuberoot/shared build

      - name: Verify Android brand assets
        working-directory: core
        run: |
          pnpm --filter @cuberoot/mobile assets:android
          git diff --exit-code -- packages/client/public/icons packages/mobile/android/app/src/main/res
          if [[ -n "$(git ls-files --others --exclude-standard -- packages/client/public/icons packages/mobile/android/app/src/main/res)" ]]; then
            echo "Asset generation produced untracked files"
            exit 1
          fi

      - name: Typecheck mobile
        working-directory: core
        run: pnpm --filter @cuberoot/mobile typecheck

      - name: Test mobile data adapters
        working-directory: core
        run: pnpm --filter @cuberoot/mobile test

      - name: Build and sync Capacitor assets
        working-directory: core
        run: pnpm --filter @cuberoot/mobile cap:sync

      - name: Create ephemeral CI upload key
        run: |
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/mobile-ci.jks" -storepass ci-mobile-store -keypass ci-mobile-store -alias ci-upload -keyalg RSA -keysize 2048 -validity 1 -dname "CN=CI, OU=Mobile, O=CubeRoot, L=CI, ST=CI, C=US"

      - name: Compile Android APK and signed release AAB
        working-directory: core/packages/mobile/android
        env:
          MOBILE_REQUIRE_RELEASE_SIGNING: 'true'
          MOBILE_UPLOAD_KEYSTORE_FILE: ${{ runner.temp }}/mobile-ci.jks
          MOBILE_UPLOAD_STORE_PASSWORD: ci-mobile-store
          MOBILE_UPLOAD_KEY_ALIAS: ci-upload
          MOBILE_UPLOAD_KEY_PASSWORD: ci-mobile-store
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease bundleRelease --no-daemon --max-workers=14
          apk=app/build/outputs/apk/release/app-release.apk
          aab=app/build/outputs/bundle/release/app-release.aab
          analyzer="$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"

          signing_output=$(jarsigner -verify "$aab" 2>&1)
          echo "$signing_output"
          if ! grep -Fq 'jar verified.' <<<"$signing_output" || grep -Fiq 'jar is unsigned' <<<"$signing_output"; then
            echo "Release AAB is not verifiably signed"
            exit 1
          fi

          build_tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$build_tools/apksigner" verify --verbose "$apk"

          expected_version_name=$(node -p "require('../package.json').version")
          expected_version_code=$(node -e "const [a,b,c]=require('../package.json').version.split('.').map(Number); console.log(a*1000000+b*1000+c)")
          expected_target_sdk=$(sed -n 's/.*targetSdkVersion = \([0-9]*\).*/\1/p' variables.gradle)
          test "$("$analyzer" manifest application-id "$apk")" = 'me.cuberoot.app'
          test "$("$analyzer" manifest version-name "$apk")" = "$expected_version_name"
          test "$("$analyzer" manifest version-code "$apk")" = "$expected_version_code"
          test "$("$analyzer" manifest target-sdk "$apk")" = "$expected_target_sdk"

          permissions=$("$analyzer" manifest permissions "$apk" | sort)
          expected_permissions=$(printf '%s\n' \
            'android.permission.ACCESS_NETWORK_STATE' \
            'android.permission.INTERNET' \
            'me.cuberoot.app.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION' | sort)
          echo "$permissions"
          if [[ "$permissions" != "$expected_permissions" ]]; then
            echo "Release manifest permissions differ from the exact allowlist"
            diff -u <(printf '%s\n' "$expected_permissions") <(printf '%s\n' "$permissions") || true
            exit 1
          fi

  # analyzer_worker 会做深度搜索并加载多份 WASM。独占 runner 可避免与 360+ 个快测文件
  # 互抢 CPU；它与主 test job 并行，所以既保留精确回归，也缩短整条 workflow 墙钟。
  analyzer-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            core
          filter: blob:none

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: core/package.json

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: core/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: core
        run: pnpm install --frozen-lockfile

      - name: Analyzer worker regression
        working-directory: core
        run: pnpm --filter @cuberoot/client test:slow
