name: Cube2Heli verification workspace

on:
  push:
    branches: [codex/sim-cube2heli-20261013]
    paths: [.github/workflows/codex-cube2heli-workspace.yml]

permissions:
  contents: read
  actions: read

jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cube2heli-workspace
          run-id: 38373025016
          github-token: ${{ github.token }}
          path: /tmp/cube2heli-download
      - name: Split the existing credential-free source and dependency snapshot
        run: split -b 350M /tmp/cube2heli-download/cube2heli-workspace.tar.gz /tmp/cube2heli-part-
      - uses: actions/upload-artifact@v4
        with:
          name: cube2heli-part-aa
          path: /tmp/cube2heli-part-aa
          retention-days: 1
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: cube2heli-part-ab
          path: /tmp/cube2heli-part-ab
          retention-days: 1
          compression-level: 0
