name: Publish Apps
run-name: App release ${{ inputs.request_id }}

# Daily push checks remain in test.yml. Only this manual workflow consumes versions.
on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Admin request UUID
        required: true
        type: string
      source_commit:
        description: Exact reviewed main commit
        required: true
        type: string
      platform:
        description: Website distribution
        required: true
        type: choice
        options: [android, windows, both]
      play_track:
        description: Optional Google Play submission
        type: choice
        default: none
        options: [none, internal, production]
      only_play:
        description: Submit only Google Play, without website publication
        type: boolean
        default: false
      build_only:
        description: Keep signed artifacts without publication
        type: boolean
        default: false
      notes:
        description: Release notes
        required: true
        type: string

permissions:
  contents: read
concurrency:
  group: official-app-release
  cancel-in-progress: false
  queue: max
env:
  RELEASE_COMMIT: ${{ inputs.source_commit }}
  RELEASE_NOTES: ${{ inputs.notes }}

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            os: ubuntu-latest
          - platform: windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        if: inputs.platform == matrix.platform || inputs.platform == 'both'
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            core
            .github/workflows
            tools/cstimer-scramble
            tools/solver/rust-cross
      - name: Validate source
        if: inputs.platform == matrix.platform || inputs.platform == 'both'
        shell: bash
        env:
          REQUEST_ID: ${{ inputs.request_id }}
          PLATFORM: ${{ inputs.platform }}
          ONLY_PLAY: ${{ inputs.only_play }}
          PLAY_TRACK: ${{ inputs.play_track }}
        run: |
          set -euo pipefail
          if [[ "$ONLY_PLAY" == true ]]; then [[ "$PLATFORM" == android && "$PLAY_TRACK" != none ]]; fi
          if [[ "$PLAY_TRACK" != none && -n "$PLAY_TRACK" ]]; then [[ "$PLATFORM" != windows ]]; fi
          [[ "$RELEASE_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          [[ "$REQUEST_ID" =~ ^[a-f0-9-]{36}$ ]]
          git merge-base --is-ancestor "$RELEASE_COMMIT" origin/main
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
      - uses: pnpm/action-setup@v6
        if: inputs.platform == matrix.platform || inputs.platform == 'both'
        with:
          package_json_file: core/package.json
      - uses: actions/setup-node@v6
        if: inputs.platform == matrix.platform || inputs.platform == 'both'
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: core/pnpm-lock.yaml
      - uses: actions/setup-java@v5
        if: matrix.platform == 'android' && inputs.platform != 'windows'
        with:
          distribution: temurin
          java-version: '21'
      - uses: dtolnay/rust-toolchain@stable
        if: matrix.platform == 'windows' && inputs.platform != 'android'
      - name: Install and assign release version
        if: inputs.platform == matrix.platform || inputs.platform == 'both'
        working-directory: core
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          node --test scripts/android-release/*.test.ts
          node scripts/android-release/distribute.ts prepare
          pnpm --filter @cuberoot/desktop build:deps
          pnpm --filter @cuberoot/app-ui typecheck
          pnpm --filter @cuberoot/app-ui test
      - name: Validate Android host
        if: matrix.platform == 'android' && inputs.platform != 'windows'
        working-directory: core
        run: |
          pnpm --filter @cuberoot/mobile typecheck
          pnpm --filter @cuberoot/mobile test
          pnpm --filter @cuberoot/mobile cap:sync:android
      - name: Build unsigned Android artifacts
        if: matrix.platform == 'android' && inputs.platform != 'windows'
        working-directory: core
        shell: bash
        env:
          PLAY_TRACK: ${{ inputs.play_track }}
          ONLY_PLAY: ${{ inputs.only_play }}
        run: |
          set -euo pipefail
          chmod +x apps/mobile/android/gradlew
          mkdir -p ../unsigned-staging
          if [[ "$ONLY_PLAY" != true ]]; then
            node apps/mobile/scripts/build-android.ts direct --unsigned-ci
            cp apps/mobile/android/app/build/direct/outputs/apk/release/app-release-unsigned.apk ../unsigned-staging/direct.apk
          fi
          if [[ -n "$PLAY_TRACK" && "$PLAY_TRACK" != none ]]; then
            node apps/mobile/scripts/build-android.ts play --unsigned-ci --bundle
            cp apps/mobile/android/app/build/outputs/bundle/release/app-release.aab ../unsigned-staging/play.aab
          fi
      - uses: actions/upload-artifact@v4
        if: matrix.platform == 'android' && inputs.platform != 'windows'
        with:
          name: unsigned-android-${{ github.run_id }}
          path: unsigned-staging/
          if-no-files-found: error
          retention-days: 3
      - name: Build Windows installer and standalone executable
        if: matrix.platform == 'windows' && inputs.platform != 'android'
        working-directory: core
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @cuberoot/desktop test
          pnpm --filter @cuberoot/desktop exec tauri build --bundles nsis
          node scripts/android-release/distribute.ts windows
      - uses: actions/upload-artifact@v4
        if: matrix.platform == 'windows' && inputs.platform != 'android'
        with:
          name: app-release-${{ matrix.platform }}-${{ github.run_id }}
          path: release-staging/
          if-no-files-found: error
          retention-days: 30

  sign-android:
    needs: build
    if: always() && github.ref == 'refs/heads/main' && !cancelled() && inputs.platform != 'windows'
    environment: app-release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_commit }}
          sparse-checkout: |
            core/scripts/android-release
            core/packages/shared/src
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v4
        with:
          name: unsigned-android-${{ github.run_id }}
          path: unsigned-staging
      - name: Prepare pinned bundle verifier
        if: inputs.play_track != '' && inputs.play_track != 'none'
        run: |
          curl -fsSL https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar -o "$RUNNER_TEMP/bundletool.jar"
          echo "a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29  $RUNNER_TEMP/bundletool.jar" | sha256sum --check
      - name: Sign and verify with the existing production certificate
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ONLY_PLAY: ${{ inputs.only_play }}
          PLAY_TRACK: ${{ inputs.play_track }}
        run: |
          set -euo pipefail
          umask 077
          key="$RUNNER_TEMP/cuberoot-upload.jks"
          trap 'rm -f "$key"' EXIT
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$key"
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          if [[ "$ONLY_PLAY" != true ]]; then
            apk=core/apps/mobile/android/app/build/direct/outputs/apk/release/app-release.apk
            mkdir -p "$(dirname "$apk")"
            "$build_tools/zipalign" -P 16 -f 4 unsigned-staging/direct.apk "$RUNNER_TEMP/aligned.apk"
            "$build_tools/apksigner" sign --ks "$key" --ks-key-alias "$ANDROID_KEY_ALIAS" --ks-pass env:ANDROID_STORE_PASSWORD --key-pass env:ANDROID_KEY_PASSWORD --out "$apk" "$RUNNER_TEMP/aligned.apk"
            node core/scripts/android-release/distribute.ts android
          fi
          if [[ -n "$PLAY_TRACK" && "$PLAY_TRACK" != none ]]; then
            jarsigner -keystore "$key" -storepass:env ANDROID_STORE_PASSWORD -keypass:env ANDROID_KEY_PASSWORD unsigned-staging/play.aab "$ANDROID_KEY_ALIAS"
            BUNDLETOOL_JAR="$RUNNER_TEMP/bundletool.jar" node core/scripts/android-release/play-ci.ts prepare unsigned-staging/play.aab play-staging
          fi
      - uses: actions/upload-artifact@v4
        if: inputs.only_play != true
        with:
          name: app-release-android-${{ github.run_id }}
          path: release-staging/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: inputs.play_track != '' && inputs.play_track != 'none'
        with:
          name: app-release-play-${{ github.run_id }}
          path: play-staging/
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: [build, sign-android]
    if: always() && github.ref == 'refs/heads/main' && !cancelled() && inputs.build_only != true && inputs.only_play != true
    environment: app-release-publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        platform: [android, windows]
    steps:
      - uses: actions/checkout@v6
        if: inputs.platform == matrix.platform || inputs.platform == 'both'
        with:
          ref: ${{ inputs.source_commit }}
          sparse-checkout: core/scripts/android-release
      # Missing/failed platform artifacts fail this job and keep that platform's old manifest.
      - uses: actions/download-artifact@v4
        if: inputs.platform == matrix.platform || inputs.platform == 'both'
        with:
          name: app-release-${{ matrix.platform }}-${{ github.run_id }}
          path: release-staging
      - name: Upload, verify and atomically publish
        if: inputs.platform == matrix.platform || inputs.platform == 'both'
        env:
          DEPLOY_KEY: ${{ secrets.APP_RELEASE_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.APP_RELEASE_SSH_HOST }}
          KNOWN_HOSTS: ${{ secrets.APP_RELEASE_KNOWN_HOSTS }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY" && test -n "$KNOWN_HOSTS"
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9_.@-]+$ ]]
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/app_release
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/app_release ~/.ssh/known_hosts
          trap 'rm -f ~/.ssh/app_release' EXIT
          stage="/tmp/cuberoot-app-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${PLATFORM}"
          ssh -i ~/.ssh/app_release -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_HOST" "mkdir -m 700 '$stage'"
          scp -i ~/.ssh/app_release -o StrictHostKeyChecking=yes release-staging/* core/scripts/android-release/publish-server.mjs "$DEPLOY_HOST:$stage/"
          ssh -i ~/.ssh/app_release -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_HOST" "mkdir -p /www/wwwroot/toolkit/downloads/$PLATFORM && flock /www/wwwroot/toolkit/downloads/$PLATFORM/.publish.lock node '$stage/publish-server.mjs' '$stage' '$PLATFORM'"
          curl --fail --silent --show-error "https://static.cuberoot.me/downloads/$PLATFORM/latest.json" > published.json
          node -e 'const fs=require("fs");const a=JSON.parse(fs.readFileSync("release-staging/latest.json"));const b=JSON.parse(fs.readFileSync("published.json"));if(a.versionCode!==b.versionCode||a.commit!==b.commit)process.exit(1)'

  publish-play:
    needs: sign-android
    if: github.ref == 'refs/heads/main' && inputs.build_only != true && inputs.play_track != '' && inputs.play_track != 'none'
    environment: app-release-publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_commit }}
          sparse-checkout: |
            core/scripts/android-release
            core/packages/shared/src
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v4
        with:
          name: app-release-play-${{ github.run_id }}
          path: play-staging
      - name: Submit the verified AAB to Google Play
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          PLAY_TRACK: ${{ inputs.play_track }}
        run: |
          set -euo pipefail
          umask 077
          export PLAY_SERVICE_ACCOUNT_FILE="$RUNNER_TEMP/play-account.json"
          trap 'rm -f "$PLAY_SERVICE_ACCOUNT_FILE"' EXIT
          test -n "$PLAY_SERVICE_ACCOUNT_JSON"
          printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" > "$PLAY_SERVICE_ACCOUNT_FILE"
          node core/scripts/android-release/play-ci.ts submit play-staging "$PLAY_TRACK"
