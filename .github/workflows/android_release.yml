name: Android Release Build
run-name: Android release ${{ inputs.request_id }}

# No push/schedule trigger. Signing and publication remain on the maintainer Mac.
on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Exact main-branch commit to build
        required: true
        type: string
      version_code:
        description: Monotonically increasing Android version code
        required: true
        type: string
      request_id:
        description: Unique request ID from pnpm android:release
        required: true
        type: string
      channel:
        description: Distribution to build
        required: true
        default: direct
        type: choice
        options: [direct, play, both]

permissions:
  contents: read
concurrency:
  group: android-release-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      MOBILE_VERSION_CODE: ${{ inputs.version_code }}
      SOURCE_COMMIT: ${{ inputs.source_commit }}
      RELEASE_CHANNEL: ${{ inputs.channel }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            core
            tools/cstimer-scramble
            tools/solver/rust-cross
      - name: Validate release identity
        run: |
          [[ "$SOURCE_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          [[ "$MOBILE_VERSION_CODE" =~ ^[1-9][0-9]{0,9}$ ]]
          test "$MOBILE_VERSION_CODE" -gt 1004
          test "$MOBILE_VERSION_CODE" -le 2100000000
          git merge-base --is-ancestor "$SOURCE_COMMIT" origin/main
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: core/package.json
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: core/pnpm-lock.yaml
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Install and build dependencies
        working-directory: core
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @cuberoot/puzzle-solvers build
          pnpm --filter @cuberoot/shared build
          pnpm --filter @cuberoot/visualcube build
          pnpm --filter @cuberoot/puzzle-render-core build
      - name: Validate installed product and host
        working-directory: core
        run: |
          pnpm --filter @cuberoot/app-ui typecheck
          pnpm --filter @cuberoot/mobile typecheck
          pnpm --filter @cuberoot/app-ui test
          pnpm --filter @cuberoot/mobile test
      - name: Build and sync packaged Web content
        working-directory: core
        run: pnpm --filter @cuberoot/mobile cap:sync:android
      - name: Build unsigned staging artifacts
        working-directory: core/apps/mobile
        run: |
          chmod +x android/gradlew
          if [[ "$RELEASE_CHANNEL" != play ]]; then node scripts/build-android.ts direct --unsigned-ci; fi
          if [[ "$RELEASE_CHANNEL" != direct ]]; then node scripts/build-android.ts play --unsigned-ci --bundle; fi
          mkdir -p release-staging
          if [[ "$RELEASE_CHANNEL" != play ]]; then cp android/app/build/direct/outputs/apk/release/app-release-unsigned.apk release-staging/direct-unsigned.apk; fi
          if [[ "$RELEASE_CHANNEL" != direct ]]; then cp android/app/build/outputs/bundle/release/app-release.aab release-staging/play-unsigned.aab; fi
          node ../../scripts/android-release/staging.ts release-staging
      - uses: actions/upload-artifact@v4
        with:
          name: android-release-${{ inputs.request_id }}
          path: core/apps/mobile/release-staging/
          retention-days: 14
          if-no-files-found: error
