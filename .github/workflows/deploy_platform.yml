# 部署 cube-platform 到 platform.cuberoot.me (云服务器 systemd platform-next,:3004)。
# 服务器内存吃紧 + 拉不到 GitHub,所以 build 在 CI 跑,scp standalone 产物过去。
# better-sqlite3 是原生模块,CI 必须用与服务器相同的 Node 大版本 (24),否则 ABI 不匹配加载失败。
# 演示库在 CI 里 migrate+seed 成 seed-data.db 一起打包;服务器仅在
# /var/lib/cube-platform/data.db 不存在时拷入 (持久 DB 不随重新部署被覆盖)。
# 持久库已存在时,部署会在 restart 前跑 migrate.cjs 对它补未应用的迁移 (drizzle 兼容)。
name: Deploy Cube Platform

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'core/packages/platform/**'
      - 'core/package.json'
      - 'core/pnpm-lock.yaml'
      - 'core/pnpm-workspace.yaml'
      - 'ops/systemd/platform-next.service'
      - '.github/workflows/deploy_platform.yml'

permissions:
  contents: read

concurrency:
  group: deploy-platform
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            core
            ops/systemd
          filter: blob:none

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: core/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: core/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: core
        run: pnpm install --frozen-lockfile

      # 约定守卫兜底层 (vitest):站内导航禁 onClick 里 router.push/replace,必须真 <a>/<Link>。
      # 写入即拦由本地 hook 负责,此处拦绕过 hook 的来源(其他 AI / 手改 / web)。早跑早挂,省构建。
      - name: Convention guards (vitest)
        working-directory: core
        run: pnpm --filter @cuberoot/platform test

      # 必须排在 build 之前:静态页 (app/sitemap.ts 等) 在构建期就查 DB 预渲染,
      # 没有已建表的 data.db 会报 "no such table"。seed 到默认路径 ./data.db,build 直接读它;
      # 同一份库随包发出去作初始演示数据。
      - name: Seed demo database
        working-directory: core/packages/platform
        env:
          DB_PATH: ./data.db
        run: |
          pnpm db:migrate
          pnpm db:seed
          # WAL checkpoint,让单个 .db 文件自包含 (无需带 -wal/-shm 边车)
          node -e "const D=require('better-sqlite3');const d=new D(process.env.DB_PATH);d.pragma('wal_checkpoint(TRUNCATE)');d.close()"
          ls -lh data.db

      - name: Build Next standalone
        working-directory: core
        env:
          NODE_ENV: production
          ADMIN_PASSWORD: ci-build-only
          SESSION_SECRET: ci-build-only-session-secret
          NEXT_PUBLIC_SITE_URL: https://platform.cuberoot.me
        run: pnpm --filter @cuberoot/platform build

      # monorepo standalone 入口会嵌套;动态定位后把 static/public 放到入口旁。
      - name: Assemble deploy bundle
        working-directory: core/packages/platform
        run: |
          STANDALONE=.next/standalone
          ENTRY_DIR=$(dirname "$(find "$STANDALONE" -name server.js -not -path '*/node_modules/*' | head -1)")
          test -f "$ENTRY_DIR/server.js" || { echo "ERROR: standalone server.js missing"; find "$STANDALONE" -name server.js; exit 1; }
          mkdir -p "$ENTRY_DIR/.next" "$ENTRY_DIR/public"
          cp -r .next/static "$ENTRY_DIR/.next/static"
          cp -r public/. "$ENTRY_DIR/public/"
          cp data.db "$STANDALONE/seed-data.db"
          # 迁移器 + 迁移文件随包发出,部署时对持久库补未应用的迁移
          cp -r db/migrations "$STANDALONE/db-migrations"
          cp ops/migrate.cjs "$STANDALONE/migrate.cjs"
          # systemd 调用的 wrapper:固定 Node 24,与 CI 编译 better-sqlite3 的 ABI 一致。
          REL=$(realpath --relative-to="$STANDALONE" "$ENTRY_DIR")
          cat > "$STANDALONE/start.sh" <<EOF
          #!/bin/sh
          cd "\$(dirname "\$0")/$REL"
          NODE_DIR="\$(ls -d /root/.nvm/versions/node/v24.* 2>/dev/null | sort -V | tail -1)"
          if [ -z "\$NODE_DIR" ] || [ ! -x "\$NODE_DIR/bin/node" ]; then
            echo "ERROR: no Node 24 binary under /root/.nvm/versions/node/v24.*" >&2
            exit 1
          fi
          exec "\$NODE_DIR/bin/node" server.js
          EOF
          chmod +x "$STANDALONE/start.sh"
          tar -czf /tmp/cube-platform.tar.gz -C "$STANDALONE" .
          ls -lh /tmp/cube-platform.tar.gz

      - name: Setup SSH
        env:
          SSH_KEY: ${{ secrets.PLATFORM_DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.PLATFORM_DEPLOY_HOST }}
        run: |
          test -n "$SSH_KEY" && test -n "$DEPLOY_HOST" || { echo "Platform deployment secrets are not configured"; exit 1; }
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id
          chmod 600 ~/.ssh/id
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: scp bundle + systemd unit
        env:
          DEPLOY_HOST: ${{ secrets.PLATFORM_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.PLATFORM_DEPLOY_USER }}
        run: |
          test -n "$DEPLOY_USER" || { echo "PLATFORM_DEPLOY_USER is not configured"; exit 1; }
          scp -i ~/.ssh/id /tmp/cube-platform.tar.gz "$DEPLOY_USER@$DEPLOY_HOST:/tmp/cube-platform.tar.gz"
          scp -i ~/.ssh/id ops/systemd/platform-next.service "$DEPLOY_USER@$DEPLOY_HOST:/tmp/platform-next.service"

      # 服务器侧替换代码包 + 健康检查;存在上一版本时自动回滚代码包。
      - name: Deploy + restart
        env:
          DEPLOY_HOST: ${{ secrets.PLATFORM_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.PLATFORM_DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/id "$DEPLOY_USER@$DEPLOY_HOST" bash -s <<'REMOTE'
          set -e
          LIVE=/www/wwwroot/cube-platform
          STAGE=/www/wwwroot/cube-platform.new
          TS=$(date +%s)
          BACKUP=/www/wwwroot/cube-platform.bak-$TS

          # 当前权限模型明确使用 root:脚本需要写 systemd、持久目录并管理服务。
          test "$(id -u)" -eq 0 || { echo "ERROR: PLATFORM_DEPLOY_USER must be root"; exit 1; }
          NODE_DIR="$(ls -d /root/.nvm/versions/node/v24.* 2>/dev/null | sort -V | tail -1)"
          test -x "$NODE_DIR/bin/node" || { echo "ERROR: Node 24 missing under /root/.nvm/versions/node"; exit 1; }

          # 新版本不允许生产默认口令。缺配置时在替换线上目录前失败。
          test -s /etc/cube-platform.env || { echo "ERROR: /etc/cube-platform.env missing"; exit 1; }
          grep -q '^ADMIN_PASSWORD=.' /etc/cube-platform.env || { echo "ERROR: ADMIN_PASSWORD missing"; exit 1; }
          grep -q '^SESSION_SECRET=.' /etc/cube-platform.env || { echo "ERROR: SESSION_SECRET missing"; exit 1; }

          rm -rf "$STAGE"; mkdir -p "$STAGE"
          tar -xzf /tmp/cube-platform.tar.gz -C "$STAGE"
          rm -f /tmp/cube-platform.tar.gz
          [ -x "$STAGE/start.sh" ] || { echo "ERROR: start.sh missing"; exit 1; }
          find "$STAGE" -name server.js -not -path '*/node_modules/*' -print -quit | grep -q . || { echo "ERROR: server.js missing"; exit 1; }

          # 持久 DB 放在部署目录之外;仅首次 (库不存在) 灌入种子,重新部署不覆盖
          mkdir -p /var/lib/cube-platform
          if [ ! -f /var/lib/cube-platform/data.db ]; then
            cp "$STAGE/seed-data.db" /var/lib/cube-platform/data.db
            echo "seeded /var/lib/cube-platform/data.db from bundle"
          fi

          # 上传文件同样外置持久化:真身在 /var/lib/cube-platform/uploads,
          # 部署目录里 public/uploads 是指向它的软链,换目录不丢图。
          # 首次接管:老目录里若是真实 uploads(历史上传),先并入真身再换链。
          mkdir -p /var/lib/cube-platform/uploads
          if [ -d "$LIVE/public/uploads" ] && [ ! -L "$LIVE/public/uploads" ]; then
            cp -a "$LIVE/public/uploads/." /var/lib/cube-platform/uploads/
            echo "migrated existing uploads to /var/lib/cube-platform/uploads"
          fi

          if [ -d "$LIVE" ]; then
            find /www/wwwroot -maxdepth 1 -name 'cube-platform.bak-*' -exec rm -rf {} +
            mv "$LIVE" "$BACKUP"
          fi
          mv "$STAGE" "$LIVE"
          rm -rf "$LIVE/public/uploads"
          ln -s /var/lib/cube-platform/uploads "$LIVE/public/uploads"

          # 对持久库应用未跑过的迁移(自包含迁移器,单个 SQLite transaction,
          # drizzle __drizzle_migrations 兼容)。失败时 transaction 回滚未完成的
          # schema 变更,并切回上一代码包;已成功提交的 schema 不做自动反向迁移。
          if ! DB_PATH=/var/lib/cube-platform/data.db MIGRATIONS_DIR="$LIVE/db-migrations" "$NODE_DIR/bin/node" "$LIVE/migrate.cjs"; then
            echo "ERROR: db migration failed"
            if [ -d "$BACKUP" ]; then
              echo "rolling back..."
              rm -rf "$LIVE"; mv "$BACKUP" "$LIVE"; systemctl restart platform-next
            fi
            exit 1
          fi

          UNIT=/etc/systemd/system/platform-next.service
          if ! cmp -s /tmp/platform-next.service "$UNIT"; then
            cp /tmp/platform-next.service "$UNIT"
            systemctl daemon-reload
            echo "systemd unit updated"
          fi
          rm -f /tmp/platform-next.service
          systemctl enable platform-next >/dev/null 2>&1 || true
          systemctl restart platform-next

          # 健康检查:最多等 15s,:3004 返回 <500 即视为起来了
          for i in $(seq 1 15); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3004/ 2>/dev/null || true)
            if [ -n "$CODE" ] && [ "$CODE" -ge 200 ] && [ "$CODE" -lt 500 ]; then
              echo "OK: platform-next responding on :3004 (HTTP $CODE)"
              exit 0
            fi
            sleep 1
          done

          echo "ERROR: platform-next did not respond on :3004 within 15s"
          journalctl -u platform-next --no-pager -n 40 || true
          if [ -d "$BACKUP" ]; then
            echo "rolling back..."
            rm -rf "$LIVE"; mv "$BACKUP" "$LIVE"
            systemctl restart platform-next
          fi
          exit 1
          REMOTE
