name: FTO6 development verification

on:
  push:
    branches: [codex/sim-fto6-20261013]

permissions:
  contents: read

concurrency:
  group: fto6-development-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sources:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout: |
            .agents/skills/sim-add-puzzle
            .agents/skills/wca-event
            .github/workflows
            core/scripts
            core/packages/client/app
            core/packages/client/components
            core/packages/client/lib
            core/packages/client/tests
            core/packages/client/scripts
            core/packages/shared
            core/packages/puzzle-solvers
            core/packages/puzzle-render-core
            core/packages/event-icon
            core/packages/timer-ui
      - name: Archive tracked verification sources
        run: |
          tar -czf /tmp/fto6-source.tgz AGENTS.md .agents .github core
      - uses: actions/upload-artifact@v4
        with:
          name: fto6-source
          path: /tmp/fto6-source.tgz
          retention-days: 3
