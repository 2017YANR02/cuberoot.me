name: FTO6 development verification

on:
  push:
    branches: [codex/sim-fto6-20261013]

permissions:
  contents: write

concurrency:
  group: fto6-development-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.ref == 'refs/heads/codex/sim-fto6-20261013'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/sim-fto6-20261013
          fetch-depth: 2
          filter: blob:none
          sparse-checkout: |
            .agents
            .github
            core
            docs
            ops
      - name: Apply reviewed feature changes to this branch only
        run: node .github/fto6-apply.mjs
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: core/package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: pnpm
          cache-dependency-path: core/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: core
        run: pnpm install --frozen-lockfile
      - name: Build shared dependencies
        working-directory: core
        run: pnpm --filter @cuberoot/client build:deps
      - name: Generate exact outline and structural icon
        working-directory: core
        run: |
          pnpm --filter @cuberoot/client exec node scripts/native-puzzles/compare-outlines.mjs --set=fto6
          pnpm --filter @cuberoot/client exec node scripts/generate-puzzle-icons.mts
          pnpm --filter @cuberoot/event-icon generate
      - name: Commit generated feature to development branch
        run: |
          git diff --check
          git add .agents/skills/sim-add-puzzle core/packages/puzzle-solvers/src/native-puzzles.ts core/packages/shared/src/timer core/packages/client/components/NativePuzzleControls.tsx core/packages/client/scripts/native-puzzles/compare-outlines.mjs core/packages/client/tests core/packages/event-icon
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'feat(sim): add six-layer FTO across simulator, scramble and timer'
            git push origin HEAD:codex/sim-fto6-20261013
          fi
          git rev-parse HEAD | tee /tmp/fto6-tested-sha.txt
          git diff-tree --no-commit-id --name-only -r HEAD -z | tar --null -T - -czf /tmp/fto6-changed-source.tgz
      - name: Inspect geometry metadata
        working-directory: core/packages/client
        run: |
          node --input-type=module <<'JS' | tee /tmp/fto6-geometry.json
          import {getPuzzleGeometryByDesc} from 'cubing/puzzle-geometry';
          import {nativePuzzleKPuzzle} from '@cuberoot/puzzle-solvers/native-puzzle-model';
          import {NATIVE_PUZZLES} from '@cuberoot/puzzle-solvers/native-puzzles';
          const pg = getPuzzleGeometryByDesc(NATIVE_PUZZLES.fto6.description, {allMoves:true, orientCenters:true, addRotations:true});
          const g = pg.get3d(), visible = g.stickers.filter(s=>!s.isDup);
          const face = visible.filter(s=>s.face===visible[0].face);
          const groups = {};
          for(const s of face){const k=s.orbit+','+s.coords.length/3;groups[k]=(groups[k]??0)+1;}
          console.log(JSON.stringify({faces:g.faces.length, perFace:pg.stickersPerFace, raw:g.stickers.length, visible:visible.length, pieces:new Set(visible.map(s=>s.orbit+':'+s.ord)).size, faceOrbits:groups, orbits:nativePuzzleKPuzzle('fto6').definition.orbits},null,2));
          JS
      - name: Run native and Timer regression tests
        working-directory: core
        run: pnpm --filter @cuberoot/client exec vitest run tests/native-puzzle-drag.test.ts tests/native-puzzle-manual-anchor.test.ts tests/native-puzzle-sim-controls.test.ts tests/native-puzzle-svg.test.ts tests/native-puzzles-client-integration.test.ts tests/native-pg-pointer.test.ts tests/native-2d-image-studio.test.ts tests/timer_scramble_runtime.test.ts tests/timer_event_catalog.test.ts tests/timer_cstimer_io.test.ts tests/timer_persistence.test.ts tests/timer-sync-seed.test.ts tests/timer-scramble-preview-shared.test.ts tests/timer-scramble-source-bar.test.ts tests/puzzle-icon-catalog.test.ts
      - name: Typecheck client
        working-directory: core
        run: pnpm --filter @cuberoot/client typecheck
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fto6-verification
          path: |
            /tmp/fto6-changed-source.tgz
            /tmp/fto6-tested-sha.txt
            /tmp/fto6-geometry.json
            core/.tmp/png/fto6-*.svg
          retention-days: 7
