name: CodeQL

on:
  push:
    branches: [main]
    paths:
      - 'core/**'
      - '!core/packages/platform/**'
      - 'scripts/**'
      - 'ops/**'
      - 'sync_upstream.ts'
      - '.github/workflows/codeql.yml'
  pull_request:
    branches: [main]
    paths:
      - 'core/**'
      - '!core/packages/platform/**'
      - 'scripts/**'
      - 'ops/**'
      - 'sync_upstream.ts'
      - '.github/workflows/codeql.yml'
  schedule:
    - cron: '43 10 * * 2'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: JavaScript / TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
          # Keep the default security queries. This is the initial JS/TS scope;
          # native hosts, Rust solvers and upstream forks need separate coverage.
          config: |
            name: CubeRoot active JavaScript and TypeScript
            paths:
              - core
              - scripts
              - ops
              - sync_upstream.ts
            paths-ignore:
              - core/packages/platform
              - core/packages/vendor-sr-puzzlegen
              - '**/vendor/**'
              - '**/node_modules/**'
              - '**/dist/**'
              - '**/.next/**'
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript
