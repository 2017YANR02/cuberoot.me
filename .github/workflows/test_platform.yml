name: Test Platform

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'core/packages/platform/**'
      - 'core/packages/shared/**'
      - 'core/package.json'
      - 'core/pnpm-lock.yaml'
      - 'core/pnpm-workspace.yaml'
      - '.github/workflows/test_platform.yml'
  push:
    branches: [main]
    paths:
      - 'core/packages/platform/**'
      - 'core/packages/shared/**'
      - 'core/package.json'
      - 'core/pnpm-lock.yaml'
      - 'core/pnpm-workspace.yaml'
      - '.github/workflows/test_platform.yml'

permissions:
  contents: read

jobs:
  platform:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            core
          filter: blob:none

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: core/package.json

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: core/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: core
        run: pnpm install --frozen-lockfile

      - name: Build shared contract
        working-directory: core
        run: pnpm --filter @cuberoot/shared build

      - name: Typecheck and test
        working-directory: core
        run: |
          pnpm --filter @cuberoot/platform typecheck
          pnpm --filter @cuberoot/platform test

      - name: Prepare demo database
        working-directory: core/packages/platform
        env:
          DB_PATH: ./data.db
        run: |
          pnpm db:migrate
          pnpm db:seed

      - name: Production build
        working-directory: core
        env:
          NODE_ENV: production
          ADMIN_PASSWORD: ci-build-only
          SESSION_SECRET: ci-build-only-session-secret
          NEXT_PUBLIC_SITE_URL: https://platform.cuberoot.me
        run: pnpm --filter @cuberoot/platform build

      - name: Verify standalone entry
        working-directory: core/packages/platform
        run: test -n "$(find .next/standalone -name server.js -not -path '*/node_modules/*' -print -quit)"
