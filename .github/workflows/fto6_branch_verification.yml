# Temporary read-only acceptance runner; remove before merging the feature.
name: Six-layer FTO branch verification
on:
  push:
    branches: [codex/add-six-layer-fto-20261013]
permissions:
  contents: read
concurrency:
  group: fto6-feature-verification
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  verify:
    if: github.repository == '2017YANR02/cuberoot.me' && github.ref == 'refs/heads/codex/add-six-layer-fto-20261013'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.node-version
            /AGENTS.md
            /core/
            /docs/generated-artifacts.json
            /docs/generated-artifacts.md
            /docs/platform-capability-manifest.json
            /docs/platform-unification-plan.md
            /tools/cstimer-scramble/
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: core/package.json
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: core/pnpm-lock.yaml
      - name: Build and verify exact checked-out source
        working-directory: core
        run: |
          mkdir -p .tmp/fto6-browser
          git rev-parse HEAD | tee .tmp/fto6-browser/tested-sha.txt
          pnpm install --frozen-lockfile
          pnpm --filter @cuberoot/client build:deps
          pnpm --filter @cuberoot/client typecheck 2>&1 | tee .tmp/fto6-browser/typecheck.log
          pnpm --filter @cuberoot/client exec node scripts/native-puzzles/fto6-audit.mts
          pnpm --filter @cuberoot/client exec vitest run tests/fto6-native-geometry.test.ts tests/native-puzzles-client-integration.test.ts tests/native-puzzle-svg.test.ts tests/native-puzzle-drag.test.ts tests/native-puzzle-sim-controls.test.ts tests/puzzle-icon-catalog.test.ts tests/timer_battle_event_sync.test.ts tests/timer_nonwca_scramble.test.ts tests/timer_cstimer_io.test.ts tests/timer_event_catalog.test.ts tests/twisty_2d_fallback.test.ts 2>&1 | tee .tmp/fto6-browser/tests.log
      - name: Install Chromium
        working-directory: core
        run: pnpm --filter @cuberoot/client exec playwright install --with-deps chromium
      - name: Accept the simulator, timer, batch, paste and competition pages
        working-directory: core
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          pnpm --filter @cuberoot/client dev > .tmp/fto6-browser/dev.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for n in {1..120}; do
            if curl -fsS http://127.0.0.1:3000/zh/sim > /dev/null; then break; fi
            sleep 2
          done
          pnpm --filter @cuberoot/client exec node scripts/native-puzzles/verify-fto6.mts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fto6-browser-acceptance
          path: |
            core/.tmp/fto6-browser/
            core/.tmp/fto6/
          retention-days: 7
