# Temporary branch-only task workspace. Remove before merge.
name: Six-layer FTO branch verification
on:
  push:
    branches: [codex/add-six-layer-fto-20261013]
permissions:
  contents: write
concurrency:
  group: fto6-feature-verification
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  verify:
    if: github.repository == '2017YANR02/cuberoot.me' && github.ref == 'refs/heads/codex/add-six-layer-fto-20261013'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/add-six-layer-fto-20261013
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.node-version
            /AGENTS.md
            /core/
            /docs/generated-artifacts.json
            /docs/generated-artifacts.md
            /docs/platform-capability-manifest.json
            /docs/platform-unification-plan.md
            /tools/cstimer-scramble/
      - name: Apply reviewed exact fixture and acceptance corrections
        run: |
          mkdir -p core/.tmp/fto6-browser
          python3 <<'PY'
          import pathlib, subprocess, tarfile, re
          changed=[]
          def edit(name,fn):
            p=pathlib.Path(name);before=p.read_text();after=fn(before)
            if before!=after:p.write_text(after);changed.append(name)
          def mobile(s):
            if 'adversarial 77 × 3' in s:return s
            return re.sub(r'\b(76|228|56|75)\b',lambda m:{'76':'77','228':'231','56':'57','75':'76'}[m[0]],s)
          edit('core/packages/app-ui/src/scramble-source-matrix.audit.test.ts',mobile)
          edit('core/packages/client/tests/timer-puzzle-picker.test.ts',lambda s: s.replace('toHaveLength(76)','toHaveLength(77)').replace('toHaveLength(59)','toHaveLength(60)').replace('toHaveLength(57)','toHaveLength(58)'))
          edit('core/packages/client/tests/timer-drill-contract-shared.test.ts',lambda s:s.replace('toHaveLength(76)','toHaveLength(77)'))
          edit('core/packages/client/tests/timer_scramble_runtime.test.ts',lambda s:s if "'fto6'" in s else s.replace("'fto5',","'fto5', 'fto6',"))
          # Existing main has four source tabs but its Douyin icon map/test still has three.
          # Preserve the failure for truly unknown tabs; add the missing training mapping.
          edit('core/apps/miniprogram/scripts/build-tab-icons.mjs',lambda s:s if "['pages/training/index'" in s else s.replace("  ['pages/tools/index', 'layout-grid'],","  ['pages/tools/index', 'layout-grid'],\n  ['pages/training/index', 'dumbbell'],"))
          edit('core/apps/miniprogram/tests/build-tab-icons.test.mjs',lambda s:s.replace('all six local PNGs','all eight local PNGs').replace('expect(tabs).toHaveLength(3)','expect(tabs).toHaveLength(4)').replace('expect(paths.size).toBe(6)','expect(paths.size).toBe(8)'))
          def browser(s):
            a=s.index('async function colors(page: Page): Promise<string[]> {')
            b=s.index("const sequence =",a)
            s=s[:a]+'''async function colors(page: Page): Promise<string[]> {
            if (await page.locator('.twisty-section--2d').count()) {
              // cubing.js owns a closed shadow root here. Compare the rendered net,
              // not private renderer state; the shared SVG contract separately locks 288 facelets.
              const image = await page.locator('.twisty-container').screenshot({ animations: 'disabled' });
              return [image.toString('base64')];
            }
            await expect(net(page).locator('polygon[data-piece]')).toHaveCount(288);
            return net(page).locator('polygon[data-piece]').evaluateAll(nodes => nodes.map(node => node.getAttribute('fill') ?? ''));
          }
          async function selectGenerator(page: Page): Promise<void> {
            await page.locator('.gen-config-toolbar .pp-trigger:visible').click();
            const fto = page.getByRole('menuitemcheckbox', { name: /六阶 FTO/ });
            await fto.waitFor();
            if (await fto.getAttribute('aria-checked') !== 'true') await fto.click();
            // Never briefly leave the auto-generating batch/competition menu empty:
            // it reinstates the default 333 event and remounts/closes its picker.
            const others = page.getByRole('menuitemcheckbox', { checked: true }).filter({ hasNotText: '六阶 FTO' });
            while (await others.count()) await others.first().click();
            await page.keyboard.press('Escape');
          }
          '''+s[b:]
            s=s.replace("else expect(await rows.first().innerText()).toBe(sequence);","else expect((await rows.first().innerText()).trim().split(/\\s+/).join(' ')).toBe(sequence);")
            s=s.replace("getByTitle('下载 PDF', { exact: true })","getByTitle(/^下载 PDF/)")
            s=s.replace("await page.locator('.twisty-section--2d').waitFor();\n    const solved", "await page.locator('.twisty-section--2d').waitFor();\n    await page.waitForTimeout(1000);\n    const solved")
            return '\n'.join(line.rstrip() for line in s.splitlines())+'\n'
          edit('core/packages/client/scripts/native-puzzles/verify-fto6.mts',browser)
          subprocess.check_call(['git','diff','--check'])
          pathlib.Path('core/.tmp/fto6-browser/final-corrections.diff').write_text(subprocess.check_output(['git','diff'],text=True))
          if changed:
            subprocess.check_call(['git','add','--']+changed)
            subprocess.check_call(['git','-c','user.name=github-actions[bot]','-c','user.email=41898282+github-actions[bot]@users.noreply.github.com','commit','-m','fix(sim): finalize FTO catalog contracts and public browser acceptance'])
            subprocess.check_call(['git','push','origin','HEAD:refs/heads/codex/add-six-layer-fto-20261013'])
          with tarfile.open('core/.tmp/fto6-browser/review.tar.gz','w:gz') as tar:
            for name in changed:tar.add(name)
          PY
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: core/package.json
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: core/pnpm-lock.yaml
      - name: Build and verify affected contracts
        working-directory: core
        run: |
          git rev-parse HEAD | tee .tmp/fto6-browser/tested-sha.txt
          pnpm install --frozen-lockfile
          pnpm --filter @cuberoot/client build:deps
          pnpm --filter @cuberoot/client typecheck 2>&1 | tee .tmp/fto6-browser/typecheck.log
          pnpm --filter @cuberoot/app-ui test 2>&1 | tee .tmp/fto6-browser/app-ui-tests.log
          pnpm --filter @cuberoot/client exec vitest run tests/fto6-native-geometry.test.ts tests/timer-puzzle-picker.test.ts tests/timer-drill-contract-shared.test.ts tests/timer_scramble_runtime.test.ts tests/timer-scramble-source-bar.test.ts 2>&1 | tee .tmp/fto6-browser/final-tests.log
          pnpm --filter @cuberoot/miniprogram verify 2>&1 | tee .tmp/fto6-browser/miniprogram-tests.log
          pnpm --filter @cuberoot/miniprogram build
          pnpm --filter @cuberoot/miniprogram build:douyin
      - name: Install Chromium
        working-directory: core
        run: pnpm --filter @cuberoot/client exec playwright install --with-deps chromium
      - name: Real browser acceptance
        working-directory: core
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          pnpm --filter @cuberoot/client dev > .tmp/fto6-browser/dev.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for n in {1..120}; do
            if curl -fsS http://127.0.0.1:3000/zh/sim > /dev/null; then break; fi
            sleep 2
          done
          pnpm --filter @cuberoot/client exec node scripts/native-puzzles/verify-fto6.mts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fto6-browser-acceptance
          path: core/.tmp/fto6-browser/
          retention-days: 7
