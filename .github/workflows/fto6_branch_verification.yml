# Temporary branch-only task workspace. Remove before merge.
name: Six-layer FTO branch verification
on:
  push:
    branches: [codex/add-six-layer-fto-20261013]
permissions:
  contents: write
concurrency:
  group: fto6-feature-verification
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  verify:
    if: github.repository == '2017YANR02/cuberoot.me' && github.ref == 'refs/heads/codex/add-six-layer-fto-20261013'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/add-six-layer-fto-20261013
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.node-version
            /AGENTS.md
            /core/
            /docs/generated-artifacts.json
            /docs/generated-artifacts.md
            /docs/platform-capability-manifest.json
            /docs/platform-unification-plan.md
            /tools/cstimer-scramble/
      - name: Complete the two exact catalog fixtures
        run: |
          mkdir -p core/.tmp/fto6-browser
          python3 <<'PY'
          import pathlib,subprocess
          paths=[]
          for name,before,after in [
            ('core/packages/client/tests/timer-puzzle-picker.test.ts',"item.querySelector('.pp-item-tag'))).toHaveLength(49)","item.querySelector('.pp-item-tag'))).toHaveLength(50)"),
            ('core/packages/client/tests/timer_scramble_runtime.test.ts',"  fto5: 'native-random-move',","  fto5: 'native-random-move',\n  fto6: 'native-random-move',")]:
            p=pathlib.Path(name);text=p.read_text()
            if after in text:continue
            if text.count(before)!=1:raise RuntimeError(name+': missing exact fixture anchor')
            p.write_text(text.replace(before,after));paths.append(name)
          if paths:
            subprocess.check_call(['git','diff','--check'])
            subprocess.check_call(['git','add','--']+paths)
            subprocess.check_call(['git','-c','user.name=github-actions[bot]','-c','user.email=41898282+github-actions[bot]@users.noreply.github.com','commit','-m','test(sim): account for six-layer FTO badge and shared scramble provider'])
            subprocess.check_call(['git','push','origin','HEAD:refs/heads/codex/add-six-layer-fto-20261013'])
          PY
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: core/package.json
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: core/pnpm-lock.yaml
      - name: Build and verify affected contracts
        working-directory: core
        run: |
          git rev-parse HEAD | tee .tmp/fto6-browser/tested-sha.txt
          pnpm install --frozen-lockfile
          pnpm --filter @cuberoot/client build:deps
          pnpm --filter @cuberoot/client typecheck 2>&1 | tee .tmp/fto6-browser/typecheck.log
          pnpm --filter @cuberoot/client exec vitest run tests/timer-puzzle-picker.test.ts tests/timer_scramble_runtime.test.ts 2>&1 | tee .tmp/fto6-browser/final-tests.log
          pnpm --filter @cuberoot/miniprogram verify 2>&1 | tee .tmp/fto6-browser/miniprogram-tests.log
          pnpm --filter @cuberoot/miniprogram build
          pnpm --filter @cuberoot/miniprogram build:douyin
      - name: Install Chromium
        working-directory: core
        run: pnpm --filter @cuberoot/client exec playwright install --with-deps chromium
      - name: Real browser acceptance
        working-directory: core
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          pnpm --filter @cuberoot/client dev > .tmp/fto6-browser/dev.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for n in {1..120}; do
            if curl -fsS http://127.0.0.1:3000/zh/sim > /dev/null; then break; fi
            sleep 2
          done
          pnpm --filter @cuberoot/client exec node scripts/native-puzzles/verify-fto6.mts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fto6-browser-acceptance
          path: core/.tmp/fto6-browser/
          retention-days: 7
