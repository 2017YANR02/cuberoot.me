# Temporary branch-only workspace; remove before merge.
name: Six-layer FTO branch verification
on:
  push:
    branches: [codex/add-six-layer-fto-20261013]
permissions:
  contents: write
concurrency:
  group: fto6-feature-verification
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  verify:
    if: github.repository == '2017YANR02/cuberoot.me' && github.ref == 'refs/heads/codex/add-six-layer-fto-20261013'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/add-six-layer-fto-20261013
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.node-version
            /AGENTS.md
            /core/
            /docs/generated-artifacts.json
            /docs/generated-artifacts.md
            /docs/platform-capability-manifest.json
            /docs/platform-unification-plan.md
            /tools/cstimer-scramble/
      - name: Reconcile scoped event fixtures and public UI selectors
        run: |
          mkdir -p core/.tmp/fto6-browser
          python3 <<'PY'
          import pathlib, subprocess, json, tarfile
          paths=subprocess.check_output(['git','ls-files','core'],text=True).splitlines()
          changed=[]
          for name in paths:
            if not name.endswith(('.ts','.tsx')):continue
            if not any(k in name for k in ('scramble-source','mobile-timer-event-catalog','miniprogram')):continue
            p=pathlib.Path(name)
            if not p.is_file():continue
            before=p.read_text();after=before
            if ('scramble-source' in name or 'mobile-timer-event-catalog' in name) and "'fto5'" in after and "'fto6'" not in after:
              after=after.replace("'fto5',", "'fto5', 'fto6',")
              if 'mobile-timer-event-catalog' in name:after=after.replace('toHaveLength(76)','toHaveLength(77)')
            if 'miniprogram' in name and '.test.' in name and 'event' in name:
              after=after.replace("filter((event) => event.group !== 'wca')).toHaveLength(33)","filter((event) => event.group !== 'wca')).toHaveLength(34)")
              if "'fto5'" in after and "'fto6'" not in after:after=after.replace("'fto5',", "'fto5', 'fto6',")
            if after!=before:p.write_text(after);changed.append(name)
          p=pathlib.Path('core/packages/client/scripts/native-puzzles/verify-fto6.mts')
          before=p.read_text();after=before
          after=after.replace("await expect(alg).toHaveValue('3F');","await expect.poll(async () => (await alg.inputValue()).trim()).toBe('3F');")
          after=after.replace("getByRole('menuitemcheckbox', { name: '六阶 FTO', exact: true })","getByRole('menuitemcheckbox', { name: /六阶 FTO/ })")
          a=after.index('async function colors(page: Page): Promise<string[]> {')
          b=after.index('async function selectGenerator',a)
          after=after[:a]+'''async function colors(page: Page): Promise<string[]> {
            if (await page.locator('.twisty-section--2d').count()) {
              const facelets = page.locator('.twisty-section--2d svg').locator('polygon, path');
              await expect.poll(() => facelets.count()).toBeGreaterThanOrEqual(288);
              return facelets.evaluateAll(nodes => nodes.map(node => getComputedStyle(node).fill));
            }
            await expect(net(page).locator('polygon[data-piece]')).toHaveCount(288);
            return net(page).locator('polygon[data-piece]').evaluateAll(nodes => nodes.map(node => node.getAttribute('fill') ?? ''));
          }
          '''+after[b:]
          if '${name}-svg.json' not in after:
            after=after.replace('row.pageErrors = errors; row.url = page.url();', '''row.pageErrors = errors; row.url = page.url();
              writeFileSync(resolve(out, `${name}-svg.json`), JSON.stringify(await page.locator('svg').evaluateAll(nodes => nodes.map(node => node.outerHTML)).catch(() => [])));
              writeFileSync(resolve(out, `${name}.html`), await page.content().catch(() => ''));''')
          after='\n'.join(line.rstrip() for line in after.splitlines())+'\n'
          if after!=before:p.write_text(after);changed.append(str(p))
          pathlib.Path('core/.tmp/fto6-browser/changed.json').write_text(json.dumps(changed,indent=2))
          print('\n'.join(changed))
          with tarfile.open('core/.tmp/fto6-browser/review.tar.gz','w:gz') as tar:
            for name in paths:
              if not name.endswith(('.ts','.tsx','.mts','.json')):continue
              if any(k in name for k in ('scramble-source','mobile-timer-event-catalog','miniprogram','twisty-player-core','verify-fto6')):
                p=pathlib.Path(name)
                if p.is_file():tar.add(name)
          subprocess.check_call(['git','diff','--check'])
          if changed:
            subprocess.check_call(['git','add','--']+changed)
            subprocess.check_call(['git','-c','user.name=github-actions[bot]','-c','user.email=41898282+github-actions[bot]@users.noreply.github.com','commit','-m','fix(sim): align FTO event fixtures and public UI acceptance'])
            subprocess.check_call(['git','push','origin','HEAD:refs/heads/codex/add-six-layer-fto-20261013'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fto6-review
          path: core/.tmp/fto6-browser/review.tar.gz
          retention-days: 7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: core/package.json
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: core/pnpm-lock.yaml
      - name: Build and typecheck
        working-directory: core
        run: |
          git rev-parse HEAD | tee .tmp/fto6-browser/tested-sha.txt
          pnpm install --frozen-lockfile
          pnpm --filter @cuberoot/client build:deps
          pnpm --filter @cuberoot/client typecheck 2>&1 | tee .tmp/fto6-browser/typecheck.log
          pnpm --filter @cuberoot/client exec node scripts/native-puzzles/fto6-audit.mts
      - name: Mobile regression evidence
        working-directory: core
        continue-on-error: true
        run: pnpm --filter @cuberoot/mobile test 2>&1 | tee .tmp/fto6-browser/mobile-tests.log
      - name: Miniprogram regression evidence
        working-directory: core
        continue-on-error: true
        run: pnpm --filter @cuberoot/trainer-miniprogram test 2>&1 | tee .tmp/fto6-browser/miniprogram-tests.log
      - name: Install Chromium
        working-directory: core
        run: pnpm --filter @cuberoot/client exec playwright install --with-deps chromium
      - name: Real browser acceptance
        working-directory: core
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          pnpm --filter @cuberoot/client dev > .tmp/fto6-browser/dev.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for n in {1..120}; do
            if curl -fsS http://127.0.0.1:3000/zh/sim > /dev/null; then break; fi
            sleep 2
          done
          pnpm --filter @cuberoot/client exec node scripts/native-puzzles/verify-fto6.mts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fto6-browser-acceptance
          path: |
            core/.tmp/fto6-browser/
            core/.tmp/fto6/
          retention-days: 7
