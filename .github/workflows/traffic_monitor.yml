name: Traffic Monitor

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: traffic-monitor
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: core/scripts/traffic-monitor.ts
          sparse-checkout-cone-mode: false

      - name: Setup SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id
          chmod 600 ~/.ssh/id
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Build hourly request report
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          # shellcheck disable=SC2016
          scp -i ~/.ssh/id core/scripts/traffic-monitor.ts \
            "$DEPLOY_USER@$DEPLOY_HOST:/tmp/cuberoot-traffic-monitor.ts"
          ssh -i ~/.ssh/id "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' > traffic-report.json <<'REMOTE'
          files=()
          for file in /www/wwwlogs/www.cuberoot.me.log*; do
            [ -f "$file" ] && files+=(--nginx "$file")
          done
          [ "${#files[@]}" -gt 0 ] || exit 1
          node --experimental-strip-types /tmp/cuberoot-traffic-monitor.ts "${files[@]}"
          REMOTE
          # shellcheck disable=SC2016
          node -e 'const r=require("./traffic-report.json"); if(!r.sources?.length) process.exit(1); console.log(`${r.windowStart} ${r.sources.map(s=>`${s.source}:${s.coverage}:${s.requests}`).join(" ")}`)'
          {
            echo '### Hourly traffic report'
          } >> "$GITHUB_STEP_SUMMARY"
          node <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const report = require("./traffic-report.json");
          console.log(`UTC ${report.windowStart} to ${report.windowEnd}. Request counts are not unique visitors.`);
          for (const source of report.sources) {
            console.log(`\n#### ${source.source}: ${source.coverage}`);
            if (source.coverage !== "observed") continue;
            console.log(`Requests: ${source.requests}; page candidates: ${source.pageCandidates}; 5xx: ${source.errors5xx}; same-hour baseline: ${source.baselinePageCandidates ?? "unavailable"}.`);
            console.log(`Alerts: ${source.alerts.join(", ") || "none"}.`);
            console.log(`Top routes: ${source.topRoutes.slice(0, 3).map(x => `${x.name} (${x.count})`).join(", ") || "none"}.`);
            console.log(`Referrers: ${source.topReferrers.slice(0, 3).map(x => `${x.name} (${x.count})`).join(", ") || "none"}.`);
            if (source.attribution) {
              console.log(`Logged source addresses: ${source.attribution.loggedSourceAddresses}; leading source share of page candidates: ${(source.attribution.leadingSourceShareOfPageCandidates * 100).toFixed(1)}%.`);
              for (const item of source.attribution.topSources.slice(0, 5)) {
                console.log(`- ${item.source}: ${item.pageCandidates} page candidates, ${item.requests} requests; ${item.signal}; peak ${item.peakPageCandidatesPerMinute}/minute; routes ${item.topRoutes.map(x => x.name).join(", ") || "none"}; referrers ${item.topReferrers.map(x => x.name).join(", ") || "none"}; User-Agent ${item.browserClaims.map(x => x.name).join(", ") || "none"}.`);
              }
              console.log("Source labels change each hour. User-Agent strings can be spoofed, and unverified does not mean human.");
            }
          }
          console.log("\n<details><summary>Full JSON report</summary>\n\n```json");
          console.log(JSON.stringify(report, null, 2));
          console.log("```\n</details>");
          NODE

      - name: Alert on traffic anomaly
        env:
          BARK_KEY: ${{ secrets.BARK_KEY }}
        run: |
          # shellcheck disable=SC2016
          message=$(node -e 'const r=require("./traffic-report.json"); const a=r.sources.flatMap(s=>s.alerts.map(x=>`${s.source}: ${x}, ${s.pageCandidates} page candidates, route ${s.topRoutes[0]?.name || "unknown"}, leading source ${s.attribution?.topSources[0]?.signal || "unverified"}, ${s.errors5xx} 5xx`)); process.stdout.write(a.join("; "))')
          [ -n "$message" ] || exit 0
          echo "::warning::$message"
          [ -n "$BARK_KEY" ] || exit 0
          curl -fsS -m 10 -X POST "https://api.day.app/$BARK_KEY" \
            --data-urlencode 'title=CubeRoot 流量异常' \
            --data-urlencode "body=$message" \
            --data-urlencode 'group=cuberoot-monitor' \
            --data-urlencode "url=https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
