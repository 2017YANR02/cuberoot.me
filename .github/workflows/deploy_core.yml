# 后端部署（云服务器 Hono API）
# 仅当 API 产物的真实输入有变更时触发
# 构建 server bundle → rsync 到 云服务器 → apply_migrations + pm2 reload
name: Deploy Core

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'core/packages/server/**'
      - 'core/apps/api/**'
      - 'core/packages/puzzle-render-core/**'
      - 'core/packages/shared/**'
      - 'core/packages/vendor-sr-puzzlegen/**'
      - 'core/packages/visualcube/**'
      - 'core/cube555-daemon/Daemon.java'
      - 'core/package.json'
      - 'core/pnpm-lock.yaml'
      - 'core/pnpm-workspace.yaml'
      - 'core/tsconfig.base.json'
      - 'core/patches/**'
      - 'core/scripts/resolve-workspace-path.mjs'
      - '.github/workflows/deploy_core.yml'

permissions:
  contents: write

concurrency:
  group: deploy-core-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # 只取 core/(server bundle + migrations + cube555 daemon glue)与 server 契约测试依赖的 nginx 配置,
      # 跳过仓库根 ~1GB 静态残留(blob:none partial clone)。
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            core
            ops/nginx
          filter: blob:none

      - uses: pnpm/action-setup@v4
        with:
          # 版本单一源:core/package.json 的 packageManager(别在这里写 version,两处会打架)
          package_json_file: core/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: core/pnpm-lock.yaml

      - name: Resolve workspace layout
        id: workspace
        working-directory: core
        run: |
          api="$(node scripts/resolve-workspace-path.mjs @cuberoot/server)"
          echo "api=$api" >> "$GITHUB_OUTPUT"

      # 安装依赖
      - name: Install dependencies
        working-directory: core
        run: pnpm install --frozen-lockfile

      # Node 条件 exports 指向 dist,必须在 server bundle 前全部 build。
      - name: Build shared deps
        working-directory: core
        run: |
          pnpm --filter @cuberoot/shared build
          pnpm --filter @cuberoot/visualcube build
          pnpm --filter @cuberoot/vendor-sr-puzzlegen build
          pnpm --filter @cuberoot/puzzle-render-core build

      - name: Test server
        working-directory: core
        run: pnpm --filter @cuberoot/server test

      # esbuild --bundle 把 server src + 全部 deps (含写得烂的 sr-puzzlegen,
      # 无扩展名 ESM)打成单个 dist/server.bundle.js,Node 严格模式直接跑。
      # 旧的 tsc -b + `pnpm deploy --prod --legacy` self-contained 树已退役。
      - name: Build server bundle
        working-directory: core
        run: pnpm --filter @cuberoot/server build:bundle

      # ── 后端部署到 云服务器 ──

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Install rsync
        # runner 镜像里 sources.list.d/azure-cli.list、mssql-release.list 签名过期,
        # 全量 apt-get update 报错(exit 100)拖垮 && 链;只删这两个,别限制 sourcelist
        # 到主文件——24.04 镜像自己的 main/universe/restricted/multiverse 定义在
        # sources.list.d/ubuntu.sources(deb822),限制会连它也跳过、update 静默不生效。
        # 优先复用镜像自带 rsync 绕开网络请求。
        run: |
          if ! command -v rsync >/dev/null 2>&1; then
            sudo rm -f /etc/apt/sources.list.d/azure-cli.list /etc/apt/sources.list.d/mssql-release.list
            sudo apt-get update
            sudo apt-get install -y rsync
          fi

      # 桥接已配置时必须早于 rsync 校验双端一致；未配置时服务端保持 fail-closed，允许分阶段部署。
      - name: Validate optional teaching bridge runtime configuration
        run: |
          ssh -T -n -o ServerAliveInterval=30 -o ServerAliveCountMax=3 \
            -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            "root@${{ secrets.DEPLOY_HOST }}" \
            'set -e
             test -s /root/core-api/.env || { echo "ERROR: core runtime env missing"; exit 1; }
             CORE_SECRET="$(sed -n "s/^TEACHING_PLATFORM_SECRET=//p" /root/core-api/.env | tail -1)"
             if [ -z "$CORE_SECRET" ]; then
               if [ -s /etc/cube-platform.env ]; then
                 PLATFORM_SECRET="$(sed -n "s/^TEACHING_PLATFORM_SECRET=//p" /etc/cube-platform.env | tail -1)"
                 test -z "$PLATFORM_SECRET" || { echo "ERROR: platform teaching bridge is configured but core TEACHING_PLATFORM_SECRET is missing"; exit 1; }
               fi
               echo "WARNING: teaching bridge is not configured; assertion requests remain fail-closed"
               exit 0
             fi
             test "${#CORE_SECRET}" -eq 64 || { echo "ERROR: core TEACHING_PLATFORM_SECRET must be exactly 64 hex characters"; exit 1; }
             case "$CORE_SECRET" in *[!0-9A-Fa-f]*) echo "ERROR: core TEACHING_PLATFORM_SECRET must be unquoted hexadecimal"; exit 1;; esac
             if [ ! -s /etc/cube-platform.env ]; then
               echo "WARNING: platform runtime env missing; platform bridge deployment is deferred"
               exit 0
             fi
             PLATFORM_SECRET="$(sed -n "s/^TEACHING_PLATFORM_SECRET=//p" /etc/cube-platform.env | tail -1)"
             test "${#PLATFORM_SECRET}" -eq 64 || { echo "ERROR: platform TEACHING_PLATFORM_SECRET must be exactly 64 hex characters"; exit 1; }
             case "$PLATFORM_SECRET" in *[!0-9A-Fa-f]*) echo "ERROR: platform TEACHING_PLATFORM_SECRET must be unquoted hexadecimal"; exit 1;; esac
             test "$CORE_SECRET" = "$PLATFORM_SECRET" || { echo "ERROR: teaching bridge secrets do not match"; exit 1; }'

      - name: Sync Platform private-data secrets
        env:
          API_DIR: core/${{ steps.workspace.outputs.api }}
          PLATFORM_DATA_ENCRYPTION_KEY_V1: ${{ secrets.PLATFORM_DATA_ENCRYPTION_KEY_V1 }}
          PLATFORM_MEDIA_SIGNING_SECRET: ${{ secrets.PLATFORM_MEDIA_SIGNING_SECRET }}
        run: |
          test -n "$PLATFORM_DATA_ENCRYPTION_KEY_V1" || { echo "ERROR: PLATFORM_DATA_ENCRYPTION_KEY_V1 secret missing"; exit 1; }
          test -n "$PLATFORM_MEDIA_SIGNING_SECRET" || { echo "ERROR: PLATFORM_MEDIA_SIGNING_SECRET secret missing"; exit 1; }
          node -e 'const value=process.env.PLATFORM_DATA_ENCRYPTION_KEY_V1||""; const bytes=Buffer.from(value,"base64"); if(bytes.length!==32||bytes.toString("base64").replace(/=+$/,"")!==value.replace(/=+$/, "")) process.exit(1)'
          test "${#PLATFORM_MEDIA_SIGNING_SECRET}" -ge 32 || { echo "ERROR: PLATFORM_MEDIA_SIGNING_SECRET must be at least 32 characters"; exit 1; }
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            "$API_DIR/scripts/sync-platform-private-secrets.sh" \
            "root@${{ secrets.DEPLOY_HOST }}:/root/core-api/.sync-platform-private-secrets.sh"
          printf '%s\n%s\n' "$PLATFORM_DATA_ENCRYPTION_KEY_V1" "$PLATFORM_MEDIA_SIGNING_SECRET" | \
            ssh -T -o ServerAliveInterval=30 -o ServerAliveCountMax=3 \
              -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
              "root@${{ secrets.DEPLOY_HOST }}" \
              'sh /root/core-api/.sync-platform-private-secrets.sh /root/core-api/.env'

      - name: Deploy server
        env:
          API_DIR: core/${{ steps.workspace.outputs.api }}
        run: |
          # bundle 自包含 → 每次发布写入独立 release；dist 只做稳定入口。
          # 旧 node_modules 树已退役;留在远端无害但下次清理可以删
          # (`ssh root@cuberoot 'rm -rf /root/core-api/node_modules'`)。
          RELEASE_ID="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA}"
          STAGING_RELEASE="/root/core-api/releases/.${RELEASE_ID}.staging"

          # 新版本先完整写入不可见 staging，绝不覆盖当前 dist。
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no "root@${{ secrets.DEPLOY_HOST }}" \
            "test ! -e '${STAGING_RELEASE}' && mkdir -p '${STAGING_RELEASE}/dist/cubeopt'"

          # server.bundle.js + sourcemap
          rsync -ltz --chmod=F644 \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            "$API_DIR/dist/server.bundle.js" \
            "$API_DIR/dist/server.bundle.js.map" \
            "root@${{ secrets.DEPLOY_HOST }}:${STAGING_RELEASE}/dist/"

          # CubeOpt 子进程和生产管理器冒烟入口与主 bundle 同版本部署；大表由
          # 独立、可校验的 API artifact store 管理，不进入常规 rsync。
          rsync -ltz --chmod=F644 \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            "$API_DIR/dist/cubeopt/solve-daemon.mjs" \
            "$API_DIR/dist/cubeopt/provision.mjs" \
            "$API_DIR/dist/cubeopt/verify.mjs" \
            "$API_DIR/dist/cubeopt/smoke.mjs" \
            "root@${{ secrets.DEPLOY_HOST }}:${STAGING_RELEASE}/dist/cubeopt/"

          # 在 migrations 与 release 切换前校验 API-owned store。Node 负责读取 .env，
          # 因而 quoted/unquoted 的启用值与实际 server 完全一致。
          ssh -T -o ServerAliveInterval=30 -o ServerAliveCountMax=3 \
            -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            "root@${{ secrets.DEPLOY_HOST }}" bash -s -- "$STAGING_RELEASE" <<'CUBEOPT_PREFLIGHT'
          set -euo pipefail
          staging="$1"
          cd /root/core-api
          if node --env-file=.env -e 'process.exit(process.env.CUBEOPT_SOLVE_ENABLED === "1" ? 0 : 1)'; then
            node --env-file=.env "$staging/dist/cubeopt/provision.mjs" \
              --env-file /root/core-api/.env \
              --default-store /root/core-api/artifacts/cubeopt \
              --bundle-suffix legacy-runtime-v1 \
              --source-url legacy-runtime://cubeopt \
              --source-revision pre-api-artifact-store \
              --source-build-command "byte-for-byte migration from legacy production paths"
            node --env-file=.env "$staging/dist/cubeopt/verify.mjs"
          else
            echo "CubeOpt disabled; artifact preflight skipped"
          fi
          CUBEOPT_PREFLIGHT

          # migrations/ — schema 改动放这里,apply_migrations.sh 自动跑没跑过的
          # 必须在 pm2 restart 之前!否则新代码部上去查不到列 → /api/* 全 500
          rsync -rltz --delete --chmod=D755,F644 \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            "$API_DIR/migrations/" "root@${{ secrets.DEPLOY_HOST }}:/root/core-api/migrations/"

          # cube555-daemon/Daemon.java — Java 子进程的胶水代码,跟 server.bundle.js
          # 同步更新,然后 javac 重编;pm2 reload 自然让 Hono 再 spawn,新 .class 接上。
          # 上游 cube555 src + lib/twophase.jar 已一次性铺在 /opt/cube555/(见 core/cube555-daemon/README.md)。
          rsync -ltz --chmod=F644 \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            core/cube555-daemon/Daemon.java \
            "root@${{ secrets.DEPLOY_HOST }}:/opt/cube555/example/Daemon.java"
          ssh -T -n -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            "root@${{ secrets.DEPLOY_HOST }}" \
            'cd /opt/cube555 && javac -d dist -cp "dist:lib/twophase.jar" example/Daemon.java'

          ssh -T -n -o ServerAliveInterval=30 -o ServerAliveCountMax=3 \
            -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            "root@${{ secrets.DEPLOY_HOST }}" \
            '/usr/local/bin/apply_migrations.sh /root/core-api/migrations'

          # 同一远端事务完成原子 symlink 切换 → reload → health/smoke。
          # health 或 smoke 失败时先切回旧 release，再 reload 旧版本并让任务失败。
          ssh -T -o ServerAliveInterval=30 -o ServerAliveCountMax=3 \
            -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            "root@${{ secrets.DEPLOY_HOST }}" bash -s -- "$RELEASE_ID" <<'REMOTE'
          set -Eeuo pipefail
          release_id="$1"
          case "$release_id" in
            ''|*[!0-9A-Fa-f_-]*) echo "ERROR: invalid release id"; exit 1 ;;
          esac

          root=/root/core-api
          releases="$root/releases"
          staging="$releases/.${release_id}.staging"
          final="$releases/$release_id"
          previous_dist=''
          pending_link=''
          legacy_moved=''
          switched=0

          reload_core() {
            pm2 reload core-api --update-env 2>/dev/null || \
              pm2 start dist/server.bundle.js --name core-api --node-args="--env-file=.env"
          }

          rollback() {
            status=$?
            trap - ERR
            if [ -n "$pending_link" ] && [ -L "$pending_link" ]; then
              unlink "$pending_link" || true
            fi
            if [ -n "$legacy_moved" ]; then
              if [ ! -e dist ] && [ ! -L dist ] && mv "$legacy_moved" dist; then
                echo "restored the pre-symlink dist directory"
              else
                echo "ERROR: one-time dist migration could not be reverted"
              fi
            fi
            if [ "$switched" = 1 ] && [ -n "$previous_dist" ]; then
              echo "ERROR: release validation failed; restoring previous dist"
              rollback_link=".dist.rollback.${release_id}.$$"
              ln -s "$previous_dist" "$rollback_link"
              mv -Tf "$rollback_link" dist
              if reload_core; then
                pm2 save || true
              else
                echo "ERROR: previous release was restored but could not be reloaded"
              fi
            fi
            exit "$status"
          }
          trap rollback ERR

          cd "$root"
          test -f "$staging/dist/server.bundle.js"
          test -f "$staging/dist/cubeopt/provision.mjs"
          test -f "$staging/dist/cubeopt/verify.mjs"
          test -f "$staging/dist/cubeopt/solve-daemon.mjs"
          test -f "$staging/dist/cubeopt/smoke.mjs"
          test ! -e "$final"

          mv "$staging" "$final"

          # One-time migration: preserve the old real dist directory as the
          # rollback release. The running process remains alive during this
          # bounded directory-to-symlink conversion.
          if [ -L dist ]; then
            previous_dist="$(readlink -f -- dist)"
          elif [ -d dist ]; then
            legacy_release="$releases/legacy-$(date -u +%Y%m%dT%H%M%SZ)-$$"
            mkdir "$legacy_release"
            pending_link=".dist.legacy.$$"
            ln -s "$legacy_release/dist" "$pending_link"
            mv dist "$legacy_release/dist"
            legacy_moved="$legacy_release/dist"
            mv -Tf "$pending_link" dist
            pending_link=''
            legacy_moved=''
            previous_dist="$legacy_release/dist"
          elif [ -e dist ]; then
            echo "ERROR: dist exists but is neither a directory nor a symlink"
            exit 1
          else
            echo "ERROR: current dist is missing; refusing a switch without rollback state"
            exit 1
          fi
          test -f "$previous_dist/server.bundle.js"

          chmod -R a-w "$final"

          next_link=".dist.next.${release_id}.$$"
          pending_link="$next_link"
          ln -s "$final/dist" "$pending_link"
          mv -Tf "$pending_link" dist
          pending_link=''
          switched=1

          reload_core

          healthy=0
          for attempt in 1 2 3 4 5 6; do
            if curl -fsS http://127.0.0.1:3001/v1/health | node -e 'let s="";process.stdin.on("data",c=>s+=c).on("end",()=>{const x=JSON.parse(s);process.exit(x.status==="ok"?0:1)})'; then
              healthy=1
              break
            fi
            sleep 2
          done
          test "$healthy" = 1 || { echo "ERROR: core API health check failed"; false; }

          if node --env-file=.env -e 'process.exit(process.env.CUBEOPT_SOLVE_ENABLED === "1" ? 0 : 1)'; then
            node --env-file=.env dist/cubeopt/smoke.mjs --boot-timeout-ms 300000 --solve-timeout-ms 180000
          else
            echo "CubeOpt disabled; production manager smoke skipped"
          fi

          pm2 save
          trap - ERR
          echo "activated release $release_id"
          REMOTE

          # nginx api_cache 24h TTL,server schema/SQL 一改老响应顽固活着 → 部署后清空
          # (memory: reference_nginx_proxy_cache.md)
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no "root@${{ secrets.DEPLOY_HOST }}" \
            'rm -rf /var/cache/nginx/api/* && nginx -s reload'
