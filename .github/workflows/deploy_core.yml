# 后端部署（云服务器 Hono API）
# 仅当 core/ 源码有变更时触发
# 构建 server bundle → rsync 到 云服务器 → apply_migrations + pm2 reload
name: Deploy Core

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'core/**'
      - '!core/packages/platform/**'
      - '!_assets/**'
      - '.github/workflows/deploy_core.yml'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # 只取 core/(server bundle + migrations + cube555 daemon glue)、server 契约测试依赖的 nginx 配置与本 workflow,
      # 跳过仓库根 ~1GB 静态残留(blob:none partial clone)。
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            core
            ops/nginx
            .github/workflows/deploy_core.yml
          filter: blob:none

      - uses: pnpm/action-setup@v4
        with:
          # 版本单一源:core/package.json 的 packageManager(别在这里写 version,两处会打架)
          package_json_file: core/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: core/pnpm-lock.yaml

      # 安装依赖
      - name: Install dependencies
        working-directory: core
        run: pnpm install --frozen-lockfile

      # @cuberoot/shared + @cuberoot/visualcube 必须在 server bundle 之前 build:
      # server.bundle.js (esbuild --bundle) 走 @cuberoot/shared subpath + visualcube 的 node→dist/*.js 条件,
      # 需要 dist/ 已存在。
      - name: Build shared deps
        working-directory: core
        run: |
          pnpm --filter @cuberoot/shared build
          pnpm --filter @cuberoot/visualcube build
          pnpm --filter @cuberoot/vendor-sr-puzzlegen build

      - name: Test server
        working-directory: core
        run: pnpm --filter @cuberoot/server test

      - name: Verify Mini Program
        working-directory: core
        run: pnpm --filter @cuberoot/miniprogram check

      # esbuild --bundle 把 server src + 全部 deps (含写得烂的 sr-puzzlegen,
      # 无扩展名 ESM)打成单个 dist/server.bundle.js,Node 严格模式直接跑。
      # 旧的 tsc -b + `pnpm deploy --prod --legacy` self-contained 树已退役。
      - name: Build server bundle
        working-directory: core
        run: pnpm --filter @cuberoot/server build:bundle

      # ── 后端部署到 云服务器 ──

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Install rsync
        # runner 镜像里 sources.list.d/azure-cli.list、mssql-release.list 签名过期,
        # 全量 apt-get update 报错(exit 100)拖垮 && 链;只删这两个,别限制 sourcelist
        # 到主文件——24.04 镜像自己的 main/universe/restricted/multiverse 定义在
        # sources.list.d/ubuntu.sources(deb822),限制会连它也跳过、update 静默不生效。
        # 优先复用镜像自带 rsync 绕开网络请求。
        run: |
          if ! command -v rsync >/dev/null 2>&1; then
            sudo rm -f /etc/apt/sources.list.d/azure-cli.list /etc/apt/sources.list.d/mssql-release.list
            sudo apt-get update
            sudo apt-get install -y rsync
          fi

      # 桥接已配置时必须早于 rsync 校验双端一致；未配置时服务端保持 fail-closed，允许分阶段部署。
      - name: Validate optional teaching bridge runtime configuration
        run: |
          ssh -T -n -o ServerAliveInterval=30 -o ServerAliveCountMax=3 \
            -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            "root@${{ secrets.DEPLOY_HOST }}" \
            'set -e
             test -s /root/core-api/.env || { echo "ERROR: core runtime env missing"; exit 1; }
             CORE_SECRET="$(sed -n "s/^TEACHING_PLATFORM_SECRET=//p" /root/core-api/.env | tail -1)"
             if [ -z "$CORE_SECRET" ]; then
               if [ -s /etc/cube-platform.env ]; then
                 PLATFORM_SECRET="$(sed -n "s/^TEACHING_PLATFORM_SECRET=//p" /etc/cube-platform.env | tail -1)"
                 test -z "$PLATFORM_SECRET" || { echo "ERROR: platform teaching bridge is configured but core TEACHING_PLATFORM_SECRET is missing"; exit 1; }
               fi
               echo "WARNING: teaching bridge is not configured; assertion requests remain fail-closed"
               exit 0
             fi
             test "${#CORE_SECRET}" -eq 64 || { echo "ERROR: core TEACHING_PLATFORM_SECRET must be exactly 64 hex characters"; exit 1; }
             case "$CORE_SECRET" in *[!0-9A-Fa-f]*) echo "ERROR: core TEACHING_PLATFORM_SECRET must be unquoted hexadecimal"; exit 1;; esac
             if [ ! -s /etc/cube-platform.env ]; then
               echo "WARNING: platform runtime env missing; platform bridge deployment is deferred"
               exit 0
             fi
             PLATFORM_SECRET="$(sed -n "s/^TEACHING_PLATFORM_SECRET=//p" /etc/cube-platform.env | tail -1)"
             test "${#PLATFORM_SECRET}" -eq 64 || { echo "ERROR: platform TEACHING_PLATFORM_SECRET must be exactly 64 hex characters"; exit 1; }
             case "$PLATFORM_SECRET" in *[!0-9A-Fa-f]*) echo "ERROR: platform TEACHING_PLATFORM_SECRET must be unquoted hexadecimal"; exit 1;; esac
             test "$CORE_SECRET" = "$PLATFORM_SECRET" || { echo "ERROR: teaching bridge secrets do not match"; exit 1; }'

      - name: Sync Platform private-data secrets
        env:
          PLATFORM_DATA_ENCRYPTION_KEY_V1: ${{ secrets.PLATFORM_DATA_ENCRYPTION_KEY_V1 }}
          PLATFORM_MEDIA_SIGNING_SECRET: ${{ secrets.PLATFORM_MEDIA_SIGNING_SECRET }}
        run: |
          test -n "$PLATFORM_DATA_ENCRYPTION_KEY_V1" || { echo "ERROR: PLATFORM_DATA_ENCRYPTION_KEY_V1 secret missing"; exit 1; }
          test -n "$PLATFORM_MEDIA_SIGNING_SECRET" || { echo "ERROR: PLATFORM_MEDIA_SIGNING_SECRET secret missing"; exit 1; }
          node -e 'const value=process.env.PLATFORM_DATA_ENCRYPTION_KEY_V1||""; const bytes=Buffer.from(value,"base64"); if(bytes.length!==32||bytes.toString("base64").replace(/=+$/,"")!==value.replace(/=+$/, "")) process.exit(1)'
          test "${#PLATFORM_MEDIA_SIGNING_SECRET}" -ge 32 || { echo "ERROR: PLATFORM_MEDIA_SIGNING_SECRET must be at least 32 characters"; exit 1; }
          printf '%s\n%s\n' "$PLATFORM_DATA_ENCRYPTION_KEY_V1" "$PLATFORM_MEDIA_SIGNING_SECRET" | \
            ssh -T -o ServerAliveInterval=30 -o ServerAliveCountMax=3 \
              -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
              "root@${{ secrets.DEPLOY_HOST }}" \
              'set -e
               IFS= read -r DATA_KEY
               IFS= read -r MEDIA_SECRET
               ENV_FILE=/root/core-api/.env
               test -s "$ENV_FILE"
               EXISTING_DATA_KEY="$(sed -n "s/^PLATFORM_DATA_ENCRYPTION_KEY_V1=//p" "$ENV_FILE" | tail -1)"
               if [ -n "$EXISTING_DATA_KEY" ] && [ "$EXISTING_DATA_KEY" != "$DATA_KEY" ]; then
                 echo "ERROR: Existing PLATFORM_DATA_ENCRYPTION_KEY_V1 does not match the immutable v1 deploy secret"
                 exit 1
               fi
               DATA_KEY_TO_WRITE="${EXISTING_DATA_KEY:-$DATA_KEY}"
               TMP_FILE="$(mktemp /root/core-api/.env.platform.XXXXXX)"
               trap '\''rm -f "$TMP_FILE"'\'' EXIT
               awk '\''index($0, "PLATFORM_DATA_ENCRYPTION_KEY_V1=") != 1 && index($0, "PLATFORM_MEDIA_SIGNING_SECRET=") != 1 { print }'\'' "$ENV_FILE" > "$TMP_FILE"
               printf "%s=%s\n" PLATFORM_DATA_ENCRYPTION_KEY_V1 "$DATA_KEY_TO_WRITE" >> "$TMP_FILE"
               printf "%s=%s\n" PLATFORM_MEDIA_SIGNING_SECRET "$MEDIA_SECRET" >> "$TMP_FILE"
               chmod --reference="$ENV_FILE" "$TMP_FILE"
               chown --reference="$ENV_FILE" "$TMP_FILE"
               mv "$TMP_FILE" "$ENV_FILE"
               trap - EXIT'

      - name: Deploy server
        run: |
          # bundle 自包含 → 只需要 scp 单文件 + sourcemap + migrations。
          # 旧 node_modules 树已退役;留在远端无害但下次清理可以删
          # (`ssh root@cuberoot 'rm -rf /root/core-api/node_modules'`)。

          # 先确保远端目录存在
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no "root@${{ secrets.DEPLOY_HOST }}" \
            'mkdir -p /root/core-api/dist'

          # server.bundle.js + sourcemap
          rsync -ltz --chmod=F644 \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            core/packages/server/dist/server.bundle.js \
            core/packages/server/dist/server.bundle.js.map \
            "root@${{ secrets.DEPLOY_HOST }}:/root/core-api/dist/"

          # migrations/ — schema 改动放这里,apply_migrations.sh 自动跑没跑过的
          # 必须在 pm2 restart 之前!否则新代码部上去查不到列 → /api/* 全 500
          rsync -rltz --delete --chmod=D755,F644 \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            core/packages/server/migrations/ "root@${{ secrets.DEPLOY_HOST }}:/root/core-api/migrations/"

          # cube555-daemon/Daemon.java — Java 子进程的胶水代码,跟 server.bundle.js
          # 同步更新,然后 javac 重编;pm2 reload 自然让 Hono 再 spawn,新 .class 接上。
          # 上游 cube555 src + lib/twophase.jar 已一次性铺在 /opt/cube555/(见 core/cube555-daemon/README.md)。
          rsync -ltz --chmod=F644 \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            core/cube555-daemon/Daemon.java \
            "root@${{ secrets.DEPLOY_HOST }}:/opt/cube555/example/Daemon.java"
          ssh -T -n -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            "root@${{ secrets.DEPLOY_HOST }}" \
            'cd /opt/cube555 && javac -d dist -cp "dist:lib/twophase.jar" example/Daemon.java'

          ssh -T -n -o ServerAliveInterval=30 -o ServerAliveCountMax=3 \
            -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            "root@${{ secrets.DEPLOY_HOST }}" \
            '/usr/local/bin/apply_migrations.sh /root/core-api/migrations'

          # pm2 reload — 给老 worker drain 时间再杀,比 restart 平滑;首次部署
          # 走 fallback 直接 start。entry 现在固定 dist/server.bundle.js,不再
          # 需要 delete + start 这种粗暴换 entry 的写法。
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no "root@${{ secrets.DEPLOY_HOST }}" \
            'cd /root/core-api && (pm2 reload core-api --update-env 2>/dev/null || pm2 start dist/server.bundle.js --name core-api --node-args="--env-file=.env") && pm2 save'

          # nginx api_cache 24h TTL,server schema/SQL 一改老响应顽固活着 → 部署后清空
          # (memory: reference_nginx_proxy_cache.md)
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no "root@${{ secrets.DEPLOY_HOST }}" \
            'rm -rf /var/cache/nginx/api/* && nginx -s reload'
