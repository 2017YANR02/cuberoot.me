# Daily lightweight index + persisted conditional detail snapshots.
# Published JSON remains usable even when this job fails.
name: Update Upcoming Comps

on:
  schedule:
    # UTC 20:00
    - cron: '0 20 * * *'
  workflow_dispatch:
    inputs:
      catalog_only:
        description: 'Refresh the official competition catalog without fetching registration details'
        type: boolean
        default: false

# Keep concurrent manual/scheduled refreshes from overwriting each other.
concurrency:
  group: update-upcoming
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Repository deploy key preserves automated data pushes through PR rules.
          ssh-key: ${{ secrets.AUTOMATION_PUSH_SSH_KEY }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'

      - uses: pnpm/action-setup@v4
        with:
          # 版本单一源:core/package.json 的 packageManager(别在这里写 version,两处会打架)
          package_json_file: core/package.json

      - name: Install dependencies
        working-directory: core
        run: pnpm install --frozen-lockfile

      - name: Build stats runtime dependencies
        working-directory: core
        run: pnpm --filter @cuberoot/stats-build build:deps

      - name: Resolve workspace layout
        id: workspace
        working-directory: core
        run: |
          stats="$(node scripts/resolve-workspace-path.mjs @cuberoot/stats-build)"
          echo "stats=$stats" >> "$GITHUB_OUTPUT"

      - name: Restore incremental snapshots
        uses: actions/cache/restore@v4
        with:
          path: .upcoming_cache
          key: upcoming-http-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: upcoming-http-v1-

      # WCA 对 GH runner IP 段返 403;经自有服务器代理出网(IP 未被封)。
      # 见 @cuberoot/server 的 src/routes/wca_proxy.ts;secret 存 repo secret WCA_PROXY_SECRET。
      - name: Fetch upcoming comps (WCA + CN)
        working-directory: core/${{ steps.workspace.outputs.stats }}
        env:
          WCA_API_BASE: https://api.cuberoot.me/v1/wca-proxy/api/v0
          WCA_PROXY_SECRET: ${{ secrets.WCA_PROXY_SECRET }}
          CATALOG_ONLY: ${{ inputs.catalog_only }}
        run: |
          if [ "$CATALOG_ONLY" = "true" ]; then
            npx tsx src/bin/fetch_upcoming_comps.ts --catalog-only
          else
            npx tsx src/bin/fetch_upcoming_comps.ts --incremental
          fi

      # Bodies and validators are written atomically, including successful progress before a failure.
      - name: Save incremental snapshots
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .upcoming_cache
          key: upcoming-http-v1-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Commit and push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add stats/upcoming_comps.json stats/all_upcoming_comps.json stats/cn_upcoming_registrations.json stats/comp_names_zh.json stats/comp_elevations.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            # commit 带 [skip ci] 避免触发 deploy_next/test 等重 workflow;
            # 但这样也掐死了 sync_toolkit(靠 push+stats/** 触发),upcoming 数据永远上不了 static。
            # 故 push 后显式触发 sync_toolkit 把新 stats/*.json rsync 到静态服务器。
            git commit -m "chore: update upcoming comps + comp names zh [skip ci]"
            git pull --rebase origin main
            # Merge source changes from both writers before deriving the shared month index.
            (cd core && node --import tsx "${{ steps.workspace.outputs.stats }}/src/bin/build_calendar_comps.ts")
            git add stats/comp_calendar/
            if ! git diff --cached --quiet; then
              if [ "$(git rev-list --count origin/main..HEAD)" -gt 0 ]; then
                git commit --amend --no-edit
              else
                git commit -m "chore: refresh competition calendar [skip ci]"
              fi
            fi
            git push
            gh workflow run sync_toolkit.yml
          fi
