name: Update Code Language History

on:
  schedule:
    # Daily 10:23 PST / 11:23 PDT. Independent of Codex and local computers.
    - cron: '23 18 * * *'
  workflow_dispatch:

concurrency:
  group: code-language-history
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          # Linguist reads historical blobs through libgit2, not git checkout.
          fetch-depth: 0
          # Reuse the existing automation key so pushes trigger Web checks and
          # both deployment pipelines. GITHUB_TOKEN pushes would suppress CI.
          ssh-key: ${{ secrets.AUTOMATION_PUSH_SSH_KEY }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Check incremental planning and publication loop protection
        working-directory: core
        run: node packages/client/scripts/check-code-history.ts

      - name: Restore Linguist checkpoint
        uses: actions/cache/restore@v4
        with:
          path: .local-data/code-language-history/checkpoint.json
          key: code-history-linux-ruby33-${{ hashFiles('core/packages/client/scripts/build-code-history.ts', 'core/packages/client/scripts/linguist-engine.rb', 'scripts/wca-data/local-lock.ts') }}-${{ github.run_id }}-${{ github.run_attempt }}
          # The TS orchestrator preserves the existing official-engine cache.
          # Metadata validation in the planner rejects incompatible versions.
          restore-keys: |
            code-history-linux-ruby33-${{ hashFiles('core/packages/client/scripts/build-code-history.ts', 'core/packages/client/scripts/linguist-engine.rb', 'scripts/wca-data/local-lock.ts') }}-
            code-history-linux-ruby33-

      - name: Plan incremental update
        id: plan
        run: |
          mkdir -p .tmp/scratch
          node core/packages/client/scripts/build-code-history.ts --plan > .tmp/scratch/code-history-plan.json
          cat .tmp/scratch/code-history-plan.json
          node --input-type=module -e 'import { readFileSync } from "node:fs"; const plan = JSON.parse(readFileSync(process.argv[1], "utf8")); console.log(`changed=${plan.sourceChanged}`)' .tmp/scratch/code-history-plan.json >> "$GITHUB_OUTPUT"

      - uses: ruby/setup-ruby@v1
        if: steps.plan.outputs.changed == 'true'
        with:
          ruby-version: '3.3'

      - name: Install official Linguist engine
        if: steps.plan.outputs.changed == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends cmake pkg-config libicu-dev
          LINGUIST_VERSION=$(node core/packages/client/scripts/build-code-history.ts --engine-version)
          gem install github-linguist --version "$LINGUIST_VERSION" --no-document

      - name: Verify official engine and persisted cache integration
        if: steps.plan.outputs.changed == 'true'
        working-directory: core
        run: node packages/client/scripts/check-code-history.ts --engine

      - name: Refresh language snapshot
        if: steps.plan.outputs.changed == 'true'
        working-directory: core
        run: node packages/client/scripts/build-code-history.ts

      - name: Save completed incremental progress
        if: always() && steps.plan.outputs.changed == 'true'
        uses: actions/cache/save@v4
        with:
          path: .local-data/code-language-history/checkpoint.json
          key: code-history-linux-ruby33-${{ hashFiles('core/packages/client/scripts/build-code-history.ts', 'core/packages/client/scripts/linguist-engine.rb', 'scripts/wca-data/local-lock.ts') }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Publish only the generated chart snapshot
        if: steps.plan.outputs.changed == 'true'
        run: |
          SNAPSHOT='core/packages/client/app/[lang]/dev/architecture/_components/code-history/history.json'
          git add -- ":(literal)$SNAPSHOT"
          if git diff --cached --quiet; then
            echo 'No snapshot changes.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(architecture): refresh code language history'
          # Preserve concurrent main commits; a conflicting snapshot stops here.
          git pull --rebase origin main
          git push origin HEAD:main
          echo "Published snapshot: $(git rev-parse HEAD). Normal Web checks and deployment gates apply." >> "$GITHUB_STEP_SUMMARY"
