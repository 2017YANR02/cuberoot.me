# 每周检查公开的 Best 2x2 Algs Google Sheet。检测只负责提醒，不自动灌库：
# 表里存在分支记号和偶发错位公式，必须先跑模拟器交叉校验再生成新迁移。
name: Best 2x2 Algs Drift

on:
  schedule:
    - cron: '30 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: best2x2-drift
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            core
            .node-version
          filter: blob:none

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'

      - name: Verify issue deduplication
        run: node --test core/scripts/drift-issue.test.mts

      - name: Resolve workspace layout
        id: workspace
        working-directory: core
        run: |
          web="$(node scripts/resolve-workspace-path.mjs @cuberoot/client)"
          echo "web=$web" >> "$GITHUB_OUTPUT"

      - name: Check spreadsheet drift
        id: check
        working-directory: core/${{ steps.workspace.outputs.web }}
        run: |
          set +e
          node scripts/best2x2-check.mjs --report "$RUNNER_TEMP/best2x2-drift-report.md"
          echo "code=$?" >> "$GITHUB_OUTPUT"

      - name: Fail on detector error
        if: steps.check.outputs.code == '1' || steps.check.outputs.code == '2'
        run: |
          echo "::error::Best 2x2 Algs drift detector failed (exit ${{ steps.check.outputs.code }})"
          exit 1

      - name: Open or update drift issue
        if: steps.check.outputs.code == '3'
        working-directory: core
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create best2x2-drift --color C15F3C --description "Best 2x2 Algs 表格出现更新" --force || true
          node scripts/drift-issue.mts best2x2-drift 'Best 2x2 Algs 表格更新' "$RUNNER_TEMP/best2x2-drift-report.md"
