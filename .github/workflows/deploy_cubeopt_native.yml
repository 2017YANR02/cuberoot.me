name: Deploy CubeOpt Native

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Promote the built binary; disable for a performance candidate'
        required: false
        type: boolean
        default: true
      candidate:
        description: 'Isolated performance candidate; requires deploy=false'
        required: false
        type: choice
        default: none
        options:
          - none
          - avx2
          - interleaved
          - interleaved32
      expected_binary_sha256:
        description: 'SHA-256 of the performance-accepted binary; reject a different build before upload'
        required: false
        type: string

permissions:
  contents: read

# Serialize with API releases: both temporarily disable CubeOpt admission.
concurrency:
  group: deploy-core-production
  cancel-in-progress: false
  queue: max

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Reject unmeasured candidate promotion
        if: inputs.deploy && inputs.candidate != 'none'
        run: exit 1
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .node-version
            solver/experiments/cube48opt-rust
            solver/.cargo
          filter: blob:none

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'

      - name: Install static Rust target
        run: |
          rustup toolchain install 1.98.1 --profile minimal --target x86_64-unknown-linux-musl
          sudo apt-get update -qq
          sudo apt-get install -y musl-tools

      - name: Build native Opt8 service
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CUBEOPT_EXPECTED_BINARY_SHA256: ${{ inputs.expected_binary_sha256 }}
          CUBEOPT_CANDIDATE: ${{ inputs.candidate }}
        run: node solver/experiments/cube48opt-rust/native-service/build.mjs "$RUNNER_TEMP/cubeopt-native"

      - uses: actions/upload-artifact@v4
        with:
          name: cubeopt-native-${{ github.sha }}
          path: ${{ runner.temp }}/cubeopt-native/
          retention-days: 30

      - name: Setup SSH
        if: inputs.deploy
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Upload immutable candidate
        if: inputs.deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          RELEASE_ID: ${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
        run: |
          upload="/root/core-api/artifacts/cubeopt/native-uploads/$RELEASE_ID"
          ssh -i ~/.ssh/deploy_key "root@$DEPLOY_HOST" "mkdir -p '$upload'"
          scp -i ~/.ssh/deploy_key "$RUNNER_TEMP/cubeopt-native/cube48opt-native" "$RUNNER_TEMP/cubeopt-native/build.json" solver/experiments/cube48opt-rust/native-service/deploy.sh "root@$DEPLOY_HOST:$upload/"

      - name: Verify, smoke and promote native Opt8
        if: inputs.deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          RELEASE_ID: ${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          upload="/root/core-api/artifacts/cubeopt/native-uploads/$RELEASE_ID"
          ssh -i ~/.ssh/deploy_key "root@$DEPLOY_HOST" "bash '$upload/deploy.sh' '$upload' '$SOURCE_SHA' '$RELEASE_ID'"
