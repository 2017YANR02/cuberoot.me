# 部署 nginx vhost conf 与主机日志保留策略。
# 改 ops/nginx/*.conf / ops/logrotate/nginx / ops/journald/* → push → 自动校验并应用。
# 失败自动回滚到 .bak。
name: Deploy Web Ops Config

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ops/nginx/**'
      - 'ops/vercel-ban-relay/**'
      - 'ops/geoip/update-cn-ranges*'
      - 'ops/systemd/cuberoot-cn-ranges.*'
      - 'ops/logrotate/nginx'
      - 'ops/journald/**'
      - '.github/workflows/deploy_nginx.yml'

# Keep activation and rollback ordered even though each run has its own staging directory.
concurrency:
  group: deploy-web-ops-config
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DEPLOY_STAGE: /tmp/cuberoot-web-ops-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate and generate China IP ranges
        run: |
          node --experimental-strip-types --test ops/geoip/update-cn-ranges.test.mjs
          node --experimental-strip-types --test ops/vercel-ban-relay/relay.test.mjs
          node --experimental-strip-types ops/geoip/update-cn-ranges.ts --output /tmp/cuberoot-cn-ranges.generated

      - name: Setup SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id
          chmod 600 ~/.ssh/id
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: scp confs to staging
        id: staging
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          [[ "$DEPLOY_STAGE" =~ ^/tmp/cuberoot-web-ops-[0-9]+-[0-9]+$ ]] || exit 1
          ssh -i ~/.ssh/id "$DEPLOY_USER@$DEPLOY_HOST" bash -s -- "$DEPLOY_STAGE" <<'REMOTE'
          set -euo pipefail
          DEPLOY_STAGE=$1
          [[ "$DEPLOY_STAGE" =~ ^/tmp/cuberoot-web-ops-[0-9]+-[0-9]+$ ]] || exit 1
          [[ ! -L /tmp && "$(realpath -e -- /tmp)" = /tmp ]] || exit 1
          umask 077
          mkdir -- "$DEPLOY_STAGE"
          REMOTE
          echo 'created=true' >> "$GITHUB_OUTPUT"
          scp -i ~/.ssh/id /tmp/cuberoot-cn-ranges.generated \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_STAGE/cuberoot-cn-ranges.conf.new"
          scp -i ~/.ssh/id ops/nginx/competition-access.inc \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_STAGE/cuberoot-competition-access.inc.conf.new"
          scp -i ~/.ssh/id ops/nginx/site-access.integration.ts \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_STAGE/site-access.integration.ts"
          scp -i ~/.ssh/id ops/nginx/scanner-ban.integration.ts \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_STAGE/scanner-ban.integration.ts"
          scp -i ~/.ssh/id ops/nginx/traffic-defense.integration.ts \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_STAGE/traffic-defense.integration.ts"
          scp -i ~/.ssh/id ops/vercel-ban-relay/relay.ts ops/vercel-ban-relay/traffic-defense.ts ops/vercel-ban-relay/cuberoot-vercel-bans.service ops/vercel-ban-relay/cuberoot-vercel-bans.timer \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_STAGE/"
          scp -i ~/.ssh/id ops/geoip/update-cn-ranges.ts ops/systemd/cuberoot-cn-ranges.service ops/systemd/cuberoot-cn-ranges.timer \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_STAGE/"
          for f in ops/nginx/*.conf; do
            name=$(basename "$f")
            scp -i ~/.ssh/id "$f" \
              "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_STAGE/${name}.new"
          done
          scp -i ~/.ssh/id ops/logrotate/nginx \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_STAGE/nginx.logrotate.new"
          scp -i ~/.ssh/id ops/journald/10-cuberoot-disk-cap.conf \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_STAGE/cuberoot-journald.new"

      - name: Verify scanner bans in isolated nginx
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/id "$DEPLOY_USER@$DEPLOY_HOST" bash -s -- "$DEPLOY_STAGE" <<'REMOTE'
          set -euo pipefail
          DEPLOY_STAGE=$1
          [[ "$DEPLOY_STAGE" =~ ^/tmp/cuberoot-web-ops-[0-9]+-[0-9]+$ ]] || exit 1
          [[ -d "$DEPLOY_STAGE" && ! -L "$DEPLOY_STAGE" && -O "$DEPLOY_STAGE" ]] || exit 1
          [[ "$(realpath -e -- "$DEPLOY_STAGE")" = "$DEPLOY_STAGE" ]] || exit 1
          NODE=/root/.nvm/versions/node/v24.14.0/bin/node
          "$NODE" --experimental-strip-types "$DEPLOY_STAGE/scanner-ban.integration.ts" "$DEPLOY_STAGE/02-scanner-ban.conf.new"
          "$NODE" --experimental-strip-types "$DEPLOY_STAGE/site-access.integration.ts" "$DEPLOY_STAGE/01-traffic-limits.conf.new" "$DEPLOY_STAGE/cuberoot-competition-access.inc.conf.new"
          "$NODE" --experimental-strip-types "$DEPLOY_STAGE/traffic-defense.integration.ts" "$DEPLOY_STAGE/01-traffic-limits.conf.new" "$DEPLOY_STAGE/00-maintenance.conf.new"
          REMOTE

      - name: Install Vercel ban relay (activate only when credentials are configured)
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/id "$DEPLOY_USER@$DEPLOY_HOST" bash -s -- "$DEPLOY_STAGE" <<'REMOTE'
          set -euo pipefail
          DEPLOY_STAGE=$1
          [[ "$DEPLOY_STAGE" =~ ^/tmp/cuberoot-web-ops-[0-9]+-[0-9]+$ ]] || exit 1
          [[ -d "$DEPLOY_STAGE" && ! -L "$DEPLOY_STAGE" && -O "$DEPLOY_STAGE" ]] || exit 1
          [[ "$(realpath -e -- "$DEPLOY_STAGE")" = "$DEPLOY_STAGE" ]] || exit 1
          install -d -m 0700 /opt/cuberoot-vercel-bans /var/lib/cuberoot-vercel-bans
          replace_file() {
            local source=$1 target=$2 mode=$3 next
            next=$(mktemp "$(dirname "$target")/.cuberoot-deploy.XXXXXXXX")
            if ! install -m "$mode" -- "$source" "$next" || ! mv -f -- "$next" "$target"; then
              rm -f -- "$next"
              return 1
            fi
          }
          replace_file "$DEPLOY_STAGE/relay.ts" /opt/cuberoot-vercel-bans/relay.ts 0600
          replace_file "$DEPLOY_STAGE/traffic-defense.ts" /opt/cuberoot-vercel-bans/traffic-defense.ts 0600
          replace_file "$DEPLOY_STAGE/cuberoot-vercel-bans.service" /etc/systemd/system/cuberoot-vercel-bans.service 0644
          replace_file "$DEPLOY_STAGE/cuberoot-vercel-bans.timer" /etc/systemd/system/cuberoot-vercel-bans.timer 0644
          systemctl daemon-reload
          if [ -s /etc/cuberoot-vercel-bans.json ]; then
            systemctl enable --now cuberoot-vercel-bans.timer
            # A separate provider's sync failure must not block local nginx protection.
            # Keep the timer enabled and report failure; the relay also sends its alert.
            if ! systemctl start cuberoot-vercel-bans.service; then
              echo '::warning::Vercel ban relay sync failed; existing rules retained, timer will retry. Check its journal and alert.'
              journalctl -u cuberoot-vercel-bans.service --no-pager -n 8
            fi
            systemctl is-active --quiet cuberoot-vercel-bans.timer
          else
            echo 'NOT ACTIVE: Vercel 30-day relay awaits a dedicated access token'
          fi
          REMOTE

      - name: Apply + validate + reload (with rollback on failure)
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/id "$DEPLOY_USER@$DEPLOY_HOST" bash -s -- "$DEPLOY_STAGE" <<'REMOTE'
          set -euo pipefail
          DEPLOY_STAGE=$1
          [[ "$DEPLOY_STAGE" =~ ^/tmp/cuberoot-web-ops-[0-9]+-[0-9]+$ ]] || exit 1
          [[ -d "$DEPLOY_STAGE" && ! -L "$DEPLOY_STAGE" && -O "$DEPLOY_STAGE" ]] || exit 1
          [[ "$(realpath -e -- "$DEPLOY_STAGE")" = "$DEPLOY_STAGE" ]] || exit 1
          VHOST_DIR=/etc/nginx/vhost.d
          TS=${DEPLOY_STAGE##*/}
          replace_conf() {
            local source=$1 target=$2 next
            next=$(mktemp "$(dirname "$target")/.cuberoot-deploy.XXXXXXXX")
            if ! install -m 0644 -- "$source" "$next" || ! mv -f -- "$next" "$target"; then
              rm -f -- "$next"
              return 1
            fi
          }
          # Preserve the 30-day journal across deploys and full nginx restarts.
          install -d -o www -g www -m 0700 /var/lib/cuberoot-scanner
          touch /var/lib/cuberoot-scanner/bans.tsv
          chown www:www /var/lib/cuberoot-scanner/bans.tsv
          chmod 0600 /var/lib/cuberoot-scanner/bans.tsv
          # Runtime incident state is independent of repository config and must
          # survive every subsequent nginx deployment.
          if [ ! -f /etc/nginx/cuberoot-maintenance-state.conf ]; then
            printf 'default 0;\n' > /etc/nginx/cuberoot-maintenance-state.conf
            chmod 0600 /etc/nginx/cuberoot-maintenance-state.conf
          fi
          # Enable only after the API verifier and browser support are deployed.
          if [ ! -f /etc/nginx/cuberoot-comp-verification-state.conf ]; then
            printf 'default 0;\n' > /etc/nginx/cuberoot-comp-verification-state.conf
            chmod 0600 /etc/nginx/cuberoot-comp-verification-state.conf
          fi
          # Snapshot every confs that will be (re)written, so a single failure
          # rolls back the whole batch — atomic apply across all conf files.
          declare -a CHANGED=()
          declare -a BACKUPS=()

          for staging in "$DEPLOY_STAGE"/*.conf.new; do
            [ -f "$staging" ] || continue
            name=$(basename "$staging" .new)
            live="${VHOST_DIR}/${name}"
            [ "$name" != cuberoot-cn-ranges.conf ] || live="/etc/nginx/$name"
            [ "$name" != cuberoot-competition-access.inc.conf ] || live=/etc/nginx/cuberoot-competition-access.inc
            if [ -f "$live" ] && cmp -s "$live" "$staging"; then
              rm -f "$staging"
              continue
            fi
            backup="${live}.bak-${TS}"
            if [ -f "$live" ]; then
              cp "$live" "$backup"
              BACKUPS+=("$backup:$live")
            else
              BACKUPS+=(":$live")   # new file — rollback = delete
            fi
            replace_conf "$staging" "$live"
            CHANGED+=("$name")
            rm -f "$staging"
          done

          if [ ${#CHANGED[@]} -eq 0 ]; then
            echo "no-op: all confs already match"
            exit 0
          fi

          echo "applied: ${CHANGED[*]}"

          if ! nginx -t 2>&1; then
            echo "ERROR: nginx -t failed, rolling back batch"
            for entry in "${BACKUPS[@]}"; do
              backup="${entry%%:*}"
              live="${entry##*:}"
              if [ -z "$backup" ]; then
                rm -f "$live"
              else
                replace_conf "$backup" "$live"
              fi
            done
            nginx -t 2>&1 || echo "WARN: rollback validation also failed!"
            exit 1
          fi

          # nginx -s reload can exit 0 after signaling the master even when the
          # master rejects the new shared-memory zone configuration. Confirm a
          # new child process starts before declaring the deployment successful.
          MASTER_PID=$(cat /www/server/nginx/logs/nginx.pid)
          OLD_CHILDREN=" $(pgrep -P "$MASTER_PID" | tr '\n' ' ' || true) "
          nginx -s reload
          RELOADED=0
          for attempt in {1..10}; do
            sleep 1
            for pid in $(pgrep -P "$MASTER_PID" || true); do
              case "$OLD_CHILDREN" in
                *" $pid "*) ;;
                *) RELOADED=1; break ;;
              esac
            done
            [ "$RELOADED" -eq 1 ] && break
          done
          if [ "$RELOADED" -ne 1 ]; then
            echo "ERROR: nginx master did not start new workers; rolling back"
            for entry in "${BACKUPS[@]}"; do
              backup="${entry%%:*}"
              live="${entry##*:}"
              if [ -z "$backup" ]; then
                rm -f "$live"
              else
                replace_conf "$backup" "$live"
              fi
            done
            nginx -t 2>&1 || echo "WARN: rollback validation also failed!"
            nginx -s reload || true
            exit 1
          fi
          echo "OK: nginx reloaded with new workers; backups at ${VHOST_DIR}/*.bak-${TS}"
          REMOTE

      - name: Apply logrotate policy (with validation and rollback)
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/id "$DEPLOY_USER@$DEPLOY_HOST" bash -s -- "$DEPLOY_STAGE" <<'REMOTE'
          set -euo pipefail
          DEPLOY_STAGE=$1
          [[ "$DEPLOY_STAGE" =~ ^/tmp/cuberoot-web-ops-[0-9]+-[0-9]+$ ]] || exit 1
          [[ -d "$DEPLOY_STAGE" && ! -L "$DEPLOY_STAGE" && -O "$DEPLOY_STAGE" ]] || exit 1
          [[ "$(realpath -e -- "$DEPLOY_STAGE")" = "$DEPLOY_STAGE" ]] || exit 1
          STAGING="$DEPLOY_STAGE/nginx.logrotate.new"
          LIVE=/etc/logrotate.d/nginx
          replace_policy() {
            local source=$1 next
            next=$(mktemp /etc/logrotate.d/.cuberoot-deploy.XXXXXXXX)
            if ! install -m 0644 -- "$source" "$next" || ! mv -f -- "$next" "$LIVE"; then
              rm -f -- "$next"
              return 1
            fi
          }
          # /etc/logrotate.d includes arbitrary filenames, including .bak-*.
          BACKUP_DIR=/var/backups/cuberoot-logrotate
          install -d -m 0700 "$BACKUP_DIR"
          BACKUP=''
          trap 'rm -f -- "$STAGING"' EXIT

          test -s "$STAGING"
          logrotate --debug "$STAGING"
          # Retire backups created by the old deployer from the include tree.
          for legacy in /etc/logrotate.d/nginx.bak-*; do
            [ -f "$legacy" ] || continue
            target=$(mktemp "$BACKUP_DIR/legacy.XXXXXXXX")
            mv -- "$legacy" "$target"
          done
          if [ -f "$LIVE" ] && cmp -s "$LIVE" "$STAGING"; then
            logrotate --debug /etc/logrotate.conf
            echo "no-op: logrotate policy already matches"
            exit 0
          fi

          HAD_LIVE=0
          if [ -f "$LIVE" ]; then
            BACKUP=$(mktemp "$BACKUP_DIR/nginx.XXXXXXXX")
            cp "$LIVE" "$BACKUP"
            HAD_LIVE=1
          fi
          replace_policy "$STAGING"
          if ! logrotate --debug /etc/logrotate.conf; then
            if [ "$HAD_LIVE" -eq 1 ]; then replace_policy "$BACKUP"; else rm -f "$LIVE"; fi
            echo "ERROR: logrotate validation failed; restored $BACKUP" >&2
            exit 1
          fi
          echo "OK: logrotate policy applied; backup at $BACKUP"
          REMOTE

      - name: Apply journald disk cap (with validation and rollback)
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/id "$DEPLOY_USER@$DEPLOY_HOST" bash -s -- "$DEPLOY_STAGE" <<'REMOTE'
          set -euo pipefail
          DEPLOY_STAGE=$1
          [[ "$DEPLOY_STAGE" =~ ^/tmp/cuberoot-web-ops-[0-9]+-[0-9]+$ ]] || exit 1
          [[ -d "$DEPLOY_STAGE" && ! -L "$DEPLOY_STAGE" && -O "$DEPLOY_STAGE" ]] || exit 1
          [[ "$(realpath -e -- "$DEPLOY_STAGE")" = "$DEPLOY_STAGE" ]] || exit 1
          STAGING="$DEPLOY_STAGE/cuberoot-journald.new"
          LIVE=/etc/systemd/journald.conf.d/10-cuberoot-disk-cap.conf
          BACKUP="${LIVE}.bak-${DEPLOY_STAGE##*/}"
          replace_policy() {
            local source=$1 next
            next=$(mktemp /etc/systemd/journald.conf.d/.cuberoot-deploy.XXXXXXXX)
            if ! install -m 0644 -- "$source" "$next" || ! mv -f -- "$next" "$LIVE"; then
              rm -f -- "$next"
              return 1
            fi
          }
          trap 'rm -f -- "$STAGING"' EXIT

          test -s "$STAGING"
          install -d -m 0755 /etc/systemd/journald.conf.d
          if [ -f "$LIVE" ] && cmp -s "$LIVE" "$STAGING"; then
            echo "no-op: journald disk cap already matches"
            exit 0
          fi

          HAD_LIVE=0
          if [ -f "$LIVE" ]; then
            cp "$LIVE" "$BACKUP"
            HAD_LIVE=1
          fi
          replace_policy "$STAGING"
          if ! systemd-analyze cat-config systemd/journald.conf >/dev/null; then
            if [ "$HAD_LIVE" -eq 1 ]; then replace_policy "$BACKUP"; else rm -f "$LIVE"; fi
            echo "ERROR: journald config validation failed; rolled back" >&2
            exit 1
          fi
          systemctl restart systemd-journald
          journalctl --vacuum-size=512M >/dev/null
          echo "OK: journald disk cap applied"
          REMOTE

      - name: Install monthly country database refresh
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/id "$DEPLOY_USER@$DEPLOY_HOST" bash -s -- "$DEPLOY_STAGE" <<'REMOTE'
          set -euo pipefail
          DEPLOY_STAGE=$1
          [[ "$DEPLOY_STAGE" =~ ^/tmp/cuberoot-web-ops-[0-9]+-[0-9]+$ ]] || exit 1
          [[ -d "$DEPLOY_STAGE" && ! -L "$DEPLOY_STAGE" && -O "$DEPLOY_STAGE" ]] || exit 1
          [[ "$(realpath -e -- "$DEPLOY_STAGE")" = "$DEPLOY_STAGE" ]] || exit 1
          install -d -m 0755 /usr/local/lib/cuberoot
          replace_file() {
            local source=$1 target=$2 next
            next=$(mktemp "$(dirname "$target")/.cuberoot-deploy.XXXXXXXX")
            if ! install -m 0644 -- "$source" "$next" || ! mv -f -- "$next" "$target"; then
              rm -f -- "$next"
              return 1
            fi
          }
          replace_file "$DEPLOY_STAGE/update-cn-ranges.ts" /usr/local/lib/cuberoot/update-cn-ranges.ts
          replace_file "$DEPLOY_STAGE/cuberoot-cn-ranges.service" /etc/systemd/system/cuberoot-cn-ranges.service
          replace_file "$DEPLOY_STAGE/cuberoot-cn-ranges.timer" /etc/systemd/system/cuberoot-cn-ranges.timer
          systemd-analyze verify /etc/systemd/system/cuberoot-cn-ranges.service /etc/systemd/system/cuberoot-cn-ranges.timer
          systemctl daemon-reload
          systemctl enable --now cuberoot-cn-ranges.timer
          REMOTE

      - name: Remove this run's staging files
        if: ${{ always() && steps.staging.outputs.created == 'true' }}
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/id "$DEPLOY_USER@$DEPLOY_HOST" bash -s -- "$DEPLOY_STAGE" <<'REMOTE'
          set -euo pipefail
          DEPLOY_STAGE=$1
          [[ "$DEPLOY_STAGE" =~ ^/tmp/cuberoot-web-ops-[0-9]+-[0-9]+$ ]] || exit 1
          [[ ! -L "$DEPLOY_STAGE" ]] || exit 1
          [ -e "$DEPLOY_STAGE" ] || exit 0
          [[ -d "$DEPLOY_STAGE" && -O "$DEPLOY_STAGE" ]] || exit 1
          [[ "$(realpath -e -- "$DEPLOY_STAGE")" = "$DEPLOY_STAGE" ]] || exit 1
          find "$DEPLOY_STAGE" -xdev -mindepth 1 -maxdepth 1 -type f -delete
          rmdir -- "$DEPLOY_STAGE"
          REMOTE
