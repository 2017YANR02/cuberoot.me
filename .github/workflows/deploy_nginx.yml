# 部署 nginx vhost conf 与主机日志保留策略。
# 改 ops/nginx/*.conf / ops/logrotate/nginx / ops/journald/* → push → 自动校验并应用。
# 失败自动回滚到 .bak。
name: Deploy Web Ops Config

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ops/nginx/**'
      - 'ops/vercel-ban-relay/**'
      - 'ops/geoip/update-cn-ranges*'
      - 'ops/systemd/cuberoot-cn-ranges.*'
      - 'ops/logrotate/nginx'
      - 'ops/journald/**'
      - '.github/workflows/deploy_nginx.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate and generate China IP ranges
        run: |
          node --experimental-strip-types --test ops/geoip/update-cn-ranges.test.mjs
          node --experimental-strip-types --test ops/vercel-ban-relay/relay.test.mjs
          node --experimental-strip-types ops/geoip/update-cn-ranges.ts --output /tmp/cuberoot-cn-ranges.generated

      - name: Setup SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id
          chmod 600 ~/.ssh/id
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: scp confs to staging
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          scp -i ~/.ssh/id /tmp/cuberoot-cn-ranges.generated \
            "$DEPLOY_USER@$DEPLOY_HOST:/tmp/cuberoot-cn-ranges.conf.new"
          scp -i ~/.ssh/id ops/nginx/competition-access.inc \
            "$DEPLOY_USER@$DEPLOY_HOST:/tmp/cuberoot-competition-access.inc.conf.new"
          scp -i ~/.ssh/id ops/nginx/site-access.integration.ts \
            "$DEPLOY_USER@$DEPLOY_HOST:/tmp/site-access.integration.ts"
          scp -i ~/.ssh/id ops/nginx/scanner-ban.integration.ts \
            "$DEPLOY_USER@$DEPLOY_HOST:/tmp/scanner-ban.integration.ts"
          scp -i ~/.ssh/id ops/vercel-ban-relay/relay.ts ops/vercel-ban-relay/cuberoot-vercel-bans.service ops/vercel-ban-relay/cuberoot-vercel-bans.timer \
            "$DEPLOY_USER@$DEPLOY_HOST:/tmp/"
          scp -i ~/.ssh/id ops/geoip/update-cn-ranges.ts ops/systemd/cuberoot-cn-ranges.service ops/systemd/cuberoot-cn-ranges.timer \
            "$DEPLOY_USER@$DEPLOY_HOST:/tmp/"
          for f in ops/nginx/*.conf; do
            name=$(basename "$f")
            scp -i ~/.ssh/id "$f" \
              "$DEPLOY_USER@$DEPLOY_HOST:/tmp/${name}.new"
          done
          scp -i ~/.ssh/id ops/logrotate/nginx \
            "$DEPLOY_USER@$DEPLOY_HOST:/tmp/nginx.logrotate.new"
          scp -i ~/.ssh/id ops/journald/10-cuberoot-disk-cap.conf \
            "$DEPLOY_USER@$DEPLOY_HOST:/tmp/cuberoot-journald.new"

      - name: Verify scanner bans in isolated nginx
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/id "$DEPLOY_USER@$DEPLOY_HOST" \
            '/root/.nvm/versions/node/v24.14.0/bin/node --experimental-strip-types /tmp/scanner-ban.integration.ts /tmp/02-scanner-ban.conf.new'
          ssh -i ~/.ssh/id "$DEPLOY_USER@$DEPLOY_HOST" \
            '/root/.nvm/versions/node/v24.14.0/bin/node --experimental-strip-types /tmp/site-access.integration.ts /tmp/01-traffic-limits.conf.new /tmp/cuberoot-competition-access.inc.conf.new'

      - name: Install Vercel ban relay (activate only when credentials are configured)
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/id "$DEPLOY_USER@$DEPLOY_HOST" bash -s <<'REMOTE'
          set -e
          install -d -m 0700 /opt/cuberoot-vercel-bans /var/lib/cuberoot-vercel-bans
          install -m 0600 /tmp/relay.ts /opt/cuberoot-vercel-bans/relay.ts
          install -m 0644 /tmp/cuberoot-vercel-bans.service /tmp/cuberoot-vercel-bans.timer /etc/systemd/system/
          systemctl daemon-reload
          if [ -s /etc/cuberoot-vercel-bans.json ]; then
            systemctl start cuberoot-vercel-bans.service
            systemctl enable --now cuberoot-vercel-bans.timer
          else
            echo 'NOT ACTIVE: Vercel 30-day relay awaits a dedicated access token'
          fi
          REMOTE

      - name: Apply + validate + reload (with rollback on failure)
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/id "$DEPLOY_USER@$DEPLOY_HOST" bash -s <<'REMOTE'
          set -e
          VHOST_DIR=/etc/nginx/vhost.d
          TS=$(date +%s)
          # Preserve the 30-day journal across deploys and full nginx restarts.
          install -d -o www -g www -m 0700 /var/lib/cuberoot-scanner
          touch /var/lib/cuberoot-scanner/bans.tsv
          chown www:www /var/lib/cuberoot-scanner/bans.tsv
          chmod 0600 /var/lib/cuberoot-scanner/bans.tsv
          # Runtime incident state is independent of repository config and must
          # survive every subsequent nginx deployment.
          if [ ! -f /etc/nginx/cuberoot-maintenance-state.conf ]; then
            printf 'default 0;\n' > /etc/nginx/cuberoot-maintenance-state.conf
            chmod 0600 /etc/nginx/cuberoot-maintenance-state.conf
          fi
          # Enable only after the API verifier and browser support are deployed.
          if [ ! -f /etc/nginx/cuberoot-comp-verification-state.conf ]; then
            printf 'default 0;\n' > /etc/nginx/cuberoot-comp-verification-state.conf
            chmod 0600 /etc/nginx/cuberoot-comp-verification-state.conf
          fi
          # Snapshot every confs that will be (re)written, so a single failure
          # rolls back the whole batch — atomic apply across all conf files.
          declare -a CHANGED=()
          declare -a BACKUPS=()

          for staging in /tmp/*.conf.new; do
            name=$(basename "$staging" .new)
            live="${VHOST_DIR}/${name}"
            [ "$name" != cuberoot-cn-ranges.conf ] || live="/etc/nginx/$name"
            [ "$name" != cuberoot-competition-access.inc.conf ] || live=/etc/nginx/cuberoot-competition-access.inc
            if [ -f "$live" ] && cmp -s "$live" "$staging"; then
              rm -f "$staging"
              continue
            fi
            backup="${live}.bak-${TS}"
            if [ -f "$live" ]; then
              cp "$live" "$backup"
              BACKUPS+=("$backup:$live")
            else
              BACKUPS+=(":$live")   # new file — rollback = delete
            fi
            cp "$staging" "$live"
            CHANGED+=("$name")
            rm -f "$staging"
          done

          if [ ${#CHANGED[@]} -eq 0 ]; then
            echo "no-op: all confs already match"
            exit 0
          fi

          echo "applied: ${CHANGED[*]}"

          if ! nginx -t 2>&1; then
            echo "ERROR: nginx -t failed, rolling back batch"
            for entry in "${BACKUPS[@]}"; do
              backup="${entry%%:*}"
              live="${entry##*:}"
              if [ -z "$backup" ]; then
                rm -f "$live"
              else
                cp "$backup" "$live"
              fi
            done
            nginx -t 2>&1 || echo "WARN: rollback validation also failed!"
            exit 1
          fi

          # nginx -s reload can exit 0 after signaling the master even when the
          # master rejects the new shared-memory zone configuration. Confirm a
          # new child process starts before declaring the deployment successful.
          MASTER_PID=$(cat /www/server/nginx/logs/nginx.pid)
          OLD_CHILDREN=" $(pgrep -P "$MASTER_PID" | tr '\n' ' ' || true) "
          nginx -s reload
          RELOADED=0
          for attempt in {1..10}; do
            sleep 1
            for pid in $(pgrep -P "$MASTER_PID" || true); do
              case "$OLD_CHILDREN" in
                *" $pid "*) ;;
                *) RELOADED=1; break ;;
              esac
            done
            [ "$RELOADED" -eq 1 ] && break
          done
          if [ "$RELOADED" -ne 1 ]; then
            echo "ERROR: nginx master did not start new workers; rolling back"
            for entry in "${BACKUPS[@]}"; do
              backup="${entry%%:*}"
              live="${entry##*:}"
              if [ -z "$backup" ]; then
                rm -f "$live"
              else
                cp "$backup" "$live"
              fi
            done
            nginx -t 2>&1 || echo "WARN: rollback validation also failed!"
            nginx -s reload || true
            exit 1
          fi
          echo "OK: nginx reloaded with new workers; backups at ${VHOST_DIR}/*.bak-${TS}"
          REMOTE

      - name: Apply logrotate policy (with validation and rollback)
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/id "$DEPLOY_USER@$DEPLOY_HOST" bash -s <<'REMOTE'
          set -euo pipefail
          STAGING=/tmp/nginx.logrotate.new
          LIVE=/etc/logrotate.d/nginx
          # /etc/logrotate.d includes arbitrary filenames, including .bak-*.
          BACKUP_DIR=/var/backups/cuberoot-logrotate
          install -d -m 0700 "$BACKUP_DIR"
          BACKUP=''
          trap 'rm -f -- "$STAGING"' EXIT

          test -s "$STAGING"
          logrotate --debug "$STAGING"
          # Retire backups created by the old deployer from the include tree.
          for legacy in /etc/logrotate.d/nginx.bak-*; do
            [ -f "$legacy" ] || continue
            target=$(mktemp "$BACKUP_DIR/legacy.XXXXXXXX")
            mv -- "$legacy" "$target"
          done
          if [ -f "$LIVE" ] && cmp -s "$LIVE" "$STAGING"; then
            logrotate --debug /etc/logrotate.conf
            echo "no-op: logrotate policy already matches"
            exit 0
          fi

          HAD_LIVE=0
          if [ -f "$LIVE" ]; then
            BACKUP=$(mktemp "$BACKUP_DIR/nginx.XXXXXXXX")
            cp "$LIVE" "$BACKUP"
            HAD_LIVE=1
          fi
          install -m 0644 "$STAGING" "$LIVE"
          if ! logrotate --debug /etc/logrotate.conf; then
            if [ "$HAD_LIVE" -eq 1 ]; then cp "$BACKUP" "$LIVE"; else rm -f "$LIVE"; fi
            echo "ERROR: logrotate validation failed; restored $BACKUP" >&2
            exit 1
          fi
          echo "OK: logrotate policy applied; backup at $BACKUP"
          REMOTE

      - name: Apply journald disk cap (with validation and rollback)
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/id "$DEPLOY_USER@$DEPLOY_HOST" bash -s <<'REMOTE'
          set -euo pipefail
          STAGING=/tmp/cuberoot-journald.new
          LIVE=/etc/systemd/journald.conf.d/10-cuberoot-disk-cap.conf
          BACKUP="${LIVE}.bak-$(date +%s)"
          trap 'rm -f -- "$STAGING"' EXIT

          test -s "$STAGING"
          install -d -m 0755 /etc/systemd/journald.conf.d
          if [ -f "$LIVE" ] && cmp -s "$LIVE" "$STAGING"; then
            echo "no-op: journald disk cap already matches"
            exit 0
          fi

          HAD_LIVE=0
          if [ -f "$LIVE" ]; then
            cp "$LIVE" "$BACKUP"
            HAD_LIVE=1
          fi
          install -m 0644 "$STAGING" "$LIVE"
          if ! systemd-analyze cat-config systemd/journald.conf >/dev/null; then
            if [ "$HAD_LIVE" -eq 1 ]; then cp "$BACKUP" "$LIVE"; else rm -f "$LIVE"; fi
            echo "ERROR: journald config validation failed; rolled back" >&2
            exit 1
          fi
          systemctl restart systemd-journald
          journalctl --vacuum-size=512M >/dev/null
          echo "OK: journald disk cap applied"
          REMOTE

      - name: Install monthly country database refresh
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/id "$DEPLOY_USER@$DEPLOY_HOST" bash -s <<'REMOTE'
          set -euo pipefail
          install -d -m 0755 /usr/local/lib/cuberoot
          install -m 0644 /tmp/update-cn-ranges.ts /usr/local/lib/cuberoot/update-cn-ranges.ts
          install -m 0644 /tmp/cuberoot-cn-ranges.service /tmp/cuberoot-cn-ranges.timer /etc/systemd/system/
          systemd-analyze verify /etc/systemd/system/cuberoot-cn-ranges.service /etc/systemd/system/cuberoot-cn-ranges.timer
          systemctl daemon-reload
          systemctl enable --now cuberoot-cn-ranges.timer
          REMOTE
