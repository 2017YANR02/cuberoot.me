# 每周检测上游 cubing/icons(src/svg)是否新增/变更了 SVG。
# 站内 packages/event-icon/svg/ 是它的 verbatim vendored 副本(驱动 CubingIcon /
# /sim 选择器 / /icon 画廊);上游动了就开/更新带清单+处理步骤的 issue 提醒
# (assignee 触发 GitHub 通知),把 issue 丢给 AI 即可完成 vendoring。
# 检测只打一次 GitHub trees API(node 内置 fetch,无需 install)。
name: cubing/icons Drift

on:
  schedule:
    # 每周一 08:00 UTC
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: icons-drift
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            core
            .node-version
          filter: blob:none

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'

      - name: Verify issue deduplication
        run: node --test core/scripts/drift-issue.test.mts

      - name: Resolve workspace layout
        id: workspace
        working-directory: core
        run: |
          icons="$(node scripts/resolve-workspace-path.mjs @cuberoot/event-icon)"
          echo "icons=$icons" >> "$GITHUB_OUTPUT"

      # 只用 node 内置 + fetch,无需 pnpm install。带 token 走 5000/h 配额防限流。
      - name: Check icons drift
        id: check
        working-directory: core/${{ steps.workspace.outputs.icons }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          node icons-check.mjs --report "$RUNNER_TEMP/icons-drift-report.md"
          echo "code=$?" >> "$GITHUB_OUTPUT"

      - name: Fail on detector error
        if: steps.check.outputs.code == '1'
        run: |
          echo "::error::icons-check failed (exit 1) — 上游 API 或本地 svg 目录异常"
          exit 1

      # 漂移(exit 3):开/更新 issue。同一来源版本保持静默，新版本复用原工单。
      - name: Open / update drift issue
        if: steps.check.outputs.code == '3'
        working-directory: core
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create icons-drift --color 1D76DB --description "上游 cubing/icons 出现新增/变更 SVG" --force || true
          node scripts/drift-issue.mts icons-drift 'cubing/icons 上游图标更新' "$RUNNER_TEMP/icons-drift-report.md"
