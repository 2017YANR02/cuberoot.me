[package]
name = "cube48opt-rust-shared-wasm"
version = "0.1.0"
edition = "2021"
publish = false
license = "GPL-3.0-or-later"

[workspace]
[lib]
crate-type = ["cdylib"]
[features]
small-check = []
production-four = []
quarter-fixed = ["cube48opt-research/wasm-quarter-fixed"]
opt9-quarter-fixed = ["quarter-fixed"]
wasm-padded-state = ["opt9-quarter-fixed", "cube48opt-research/wasm-padded-state"]
wasm-opt9-batch = ["opt9-quarter-fixed"]
wasm-opt9-batch-padded = ["wasm-opt9-batch", "wasm-padded-state"]
wasm-opt9-select = ["wasm-opt9-batch"]
wasm-coset-batch = ["opt9-quarter-fixed", "cube48opt-research/wasm-coset-prune"]
wasm-root-bound = ["opt9-quarter-fixed", "cube48opt-research/wasm-root-bound"]
wasm-lazy-normal = ["wasm-root-bound", "cube48opt-research/wasm-lazy-normal"]
[dependencies]
cube48opt-research = { path = "../..", default-features = false, features = ["wasm-batch-probes"] }
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
