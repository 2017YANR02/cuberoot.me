# rtc.<域名> —— LiveKit 信令的 TLS 入口。**放在境内节点的 nginx 上**。
#
# 注意:这个文件故意不放 ops/nginx/ —— 那个目录会被 deploy_nginx.yml 整个 scp 到主站
# 服务器,而 LiveKit 跑在另一台机器上。放过去只会在主站上多一个 502 的 vhost。
#
# 只反代**信令**(HTTP + WebSocket → 127.0.0.1:7880)。媒体走 UDP 7882-7892 和
# TCP 7881,直连,不经过 nginx —— nginx 不转发 UDP,把媒体往这儿引是常见的错误配置。

server {
    listen 80;
    listen [::]:80;
    server_name rtc.example.com;   # ← 换成实际的 RTC 子域名

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name rtc.example.com;   # ← 换成实际的 RTC 子域名

    ssl_certificate     /etc/letsencrypt/live/rtc.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rtc.example.com/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:7880;
        proxy_http_version 1.1;

        # WebSocket 升级。漏掉这两行 = 客户端一直重连,报 "signal connection failed"。
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 信令是整场通话都开着的长连接,默认 60s 读超时会把人踢下线。
        proxy_read_timeout 7d;
        proxy_send_timeout 7d;
    }
}
