# Append to /etc/ssh/sshd_config on OpenSSH 8.0 hosts, validate with sshd -t,
# then reload (not restart) sshd. Existing connections keep their old policy.
# Scope to root so the macmini-tunnel service account retains its own policy.
Match User root
    ClientAliveInterval 60
    ClientAliveCountMax 3
Match all
