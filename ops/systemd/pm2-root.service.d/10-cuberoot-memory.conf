[Service]
# This host uses cgroup v1: vm.swappiness=0 does not update existing child
# cgroups. Keep the API's resident CubeOpt table out of routine swap reclaim.
# Run before PM2 restores its children; no-op on cgroup v2. This is a reclaim
# preference, not mlock or a substitute for the daemon's OOM safeguards.
ExecStartPre=/bin/sh -ec 'control=/sys/fs/cgroup/memory/system.slice/pm2-root.service/memory.swappiness; if [ -e "$control" ]; then echo 0 > "$control"; fi'
