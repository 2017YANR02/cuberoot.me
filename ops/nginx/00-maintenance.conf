# Runtime switch lives in /etc/nginx/cuberoot-maintenance-state.conf (root-owned).
# Traffic guard may set its default to 1; deployments must never reset it.
# Keep ACME validation reachable while maintenance is enabled.
map $uri $cuberoot_maintenance_enabled {
    include /etc/nginx/cuberoot-maintenance-state.conf;
    ~^/\.well-known/acme-challenge/ 0;
}

# Preserve combined-log fields; append a server-owned marker so monitors can
# distinguish our maintenance response from an application returning 503.
log_format cuberoot_traffic '$remote_addr - $remote_user [$time_local] '
    '"$request" $status $body_bytes_sent '
    '"$http_referer" "$http_user_agent" maintenance=$cuberoot_maintenance_enabled';

# Self-contained HTML: no scripts, fonts, images, analytics, or upstream calls.
# Token snapshot from client/app/globals.css for this independent emergency page.
map $host $cuberoot_maintenance_html {
    default '<!doctype html>
<html lang="zh-Hans">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>CubeRoot · 暂时维护 / Temporarily unavailable</title>
<style>
:root{color-scheme:light dark;--background:#fafafa;--foreground:#171717;--muted-foreground:#737373;--accent:#C15F3C;--border-default:#e5e5e5}
@media(prefers-color-scheme:dark){:root{--background:#171717;--foreground:#ededed;--muted-foreground:#a3a3a3;--accent:#d97757;--border-default:color-mix(in srgb,var(--foreground) 10%,transparent)}}
*{box-sizing:border-box}body{margin:0;background:var(--background);color:var(--foreground);font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;line-height:1.8;min-height:100svh;display:grid;place-items:center;padding:40px 24px}main{width:100%;max-width:620px}.brand{font-size:18px;font-weight:650;letter-spacing:.02em}.status{display:inline-block;margin:40px 0 12px;color:var(--accent);font-size:13px;letter-spacing:.08em}h1{font-size:clamp(30px,6vw,42px);line-height:1.3;letter-spacing:-.035em;margin:0 0 22px}p{margin:0 0 16px;color:var(--muted-foreground);font-size:16px}.english{border-top:1px solid var(--border-default);padding-top:24px;margin-top:30px}h2{font-size:21px;line-height:1.4;margin:0 0 12px}.english p{font-size:15px}footer{margin-top:36px;color:var(--muted-foreground);font-size:12px}
</style>
<main>
<div class="brand">CubeRoot</div>
<div class="status">临时维护 · TEMPORARY MAINTENANCE</div>
<h1>稍作休息，很快再见。</h1>
<p>网站目前正遭遇大量异常自动化访问。为保护服务稳定性，我们已暂时关闭网站访问，正在加强防护。</p>
<p>给你带来不便，十分抱歉。请稍后再来。</p>
<section class="english" lang="en">
<h2>We will be back.</h2>
<p>CubeRoot is experiencing unusually heavy automated traffic. We have temporarily paused website access while we strengthen our protections.</p>
<p>Sorry for the interruption. Please check back later.</p>
</section>
<footer>CubeRoot · 2026-09-24</footer>
</main>
</html>';
}
