# Immediate source-IP bans for high-confidence sensitive-file probes.
# Uses the Lua module already compiled into the production nginx binary.
# Keep this pattern aligned with the Vercel rule documented in traffic-defense.md.
lua_shared_dict cuberoot_scanner_bans 16m;
lua_shared_dict cuberoot_unverified_requests 4m;

# Replay absolute expiry times after a full restart. A reload keeps the shared
# dictionary; safe_add preserves its original expiry. Never reset to 30 days.
init_by_lua_block {
    local file = assert(io.open("/var/lib/cuberoot-scanner/bans.tsv", "r"))
    assert(file:seek("end") <= 67108864, "scanner ban journal exceeds 64 MiB")
    file:seek("set", 0)
    local now = ngx.now()
    for line in file:lines() do
        local ip, expiry = line:match("^([%x:.]+)\t(%d+)$")
        expiry = tonumber(expiry)
        if ip and expiry and expiry > now then
            local ok, err = ngx.shared.cuberoot_scanner_bans:safe_add(ip, expiry, expiry - now)
            assert(ok or err == "exists", "scanner ban replay failed: " .. tostring(err))
        end
    end
    file:close()
    package.loaded.cuberoot_ban_add = function(ip, ttl, reason)
        local bans = ngx.shared.cuberoot_scanner_bans
        -- safe_add never evicts an active ban when the bounded store fills up.
        local expiry = math.floor(ngx.now()) + ttl
        local ok, store_err = bans:safe_add(ip, expiry, ttl)
        if ok then
            -- Append once per newly banned IP, never on ordinary requests. A small
            -- line is flushed on close; the journal is private to the nginx user.
            local file, journal_err = io.open("/var/lib/cuberoot-scanner/bans.tsv", "a")
            if file then
                if file:seek("end") < 67108864 then
                    local written
                    written, journal_err = file:write(ip .. "\t" .. tostring(expiry) .. "\n")
                    if written then
                        local closed
                        closed, journal_err = file:close()
                        if closed then journal_err = nil end
                    else
                        file:close()
                    end
                else
                    journal_err = "journal full; compact expired entries"
                    file:close()
                end
            end
            if journal_err then
                ngx.log(ngx.ERR, "cuberoot_scanner_ban persistence error: ", journal_err)
            end
            ngx.log(ngx.WARN, "cuberoot_scanner_ban ip=", ip, " reason=", reason, " ttl=", ttl)
        elseif store_err ~= "exists" then
            ngx.log(ngx.ERR, "cuberoot_scanner_ban storage error: ", store_err)
        end
    end
}

server_rewrite_by_lua_block {
    local host = ngx.var.host
    if host ~= "cuberoot.me" and host ~= "www.cuberoot.me"
        and host ~= "next.cuberoot.me" and host ~= "api.cuberoot.me"
        and host ~= "static.cuberoot.me" then
        return
    end
    if ngx.is_subrequest then return end
    local ip = ngx.var.remote_addr
    -- Never accept exemption or identity from incoming forwarding headers.
    if ngx.var.cuberoot_cn_exempt == "1" or ip == "127.0.0.1" or ip == "::1" then
        return
    end

    local bans = ngx.shared.cuberoot_scanner_bans
    local until_at = bans:get(ip)
    if until_at then
        ngx.header["Cache-Control"] = "no-store"
        ngx.header["Retry-After"] = tostring(math.max(1, math.ceil(until_at - ngx.now())))
        ngx.header["X-CubeRoot-Scanner-Ban"] = "active"
        return ngx.exit(ngx.HTTP_FORBIDDEN)
    end

    -- Paths only: a forum post, search query or referrer mentioning .env must
    -- never ban its author. Decode twice to catch common encoded probe paths.
    local path = (ngx.var.request_uri or ""):match("^[^?]*") or ""
    path = ngx.unescape_uri(ngx.unescape_uri(path))
    local pattern = [[(?:^|/)(?:\.env(?:[./]|$)|\.(?:git|svn|hg|ssh|aws|kube|terraform)(?:/|$)|(?:wp-config|phpinfo)\.php(?:[./]|$)|(?:etc/(?:passwd|shadow)|proc/(?:self|1)/environ)(?:/|$))]]
    local matched, _, err = ngx.re.find(path, pattern, "ijo")
    if err then
        ngx.log(ngx.ERR, "cuberoot_scanner_ban regex error: ", err)
        return ngx.exit(ngx.HTTP_SERVICE_UNAVAILABLE)
    end
    if not matched then return end

    local ttl = 2592000 -- 30 days, requested by the owner.
    package.loaded.cuberoot_ban_add(ip, ttl, "sensitive_path")
    ngx.header["Cache-Control"] = "no-store"
    ngx.header["Retry-After"] = tostring(ttl)
    ngx.header["X-CubeRoot-Scanner-Ban"] = "sensitive-path"
    return ngx.exit(ngx.HTTP_FORBIDDEN)
}

# Count only server-confirmed verification refusals, after the response. Merely
# opening/closing the CAPTCHA, wrong answers, assets and verified visits do not count.
log_by_lua_block {
    if ngx.is_subrequest then return end
    local host = ngx.var.host
    if host ~= "cuberoot.me" and host ~= "www.cuberoot.me" and host ~= "next.cuberoot.me" and host ~= "api.cuberoot.me" and host ~= "static.cuberoot.me" then return end
    local ip = ngx.var.remote_addr
    if ngx.var.cuberoot_cn_exempt == "1" or ip == "127.0.0.1" or ip == "::1" then return end
    if ngx.shared.cuberoot_scanner_bans:get(ip) then return end
    local refused = ngx.var.sent_http_x_cuberoot_verification_required == "1"
        or (ngx.status == 403 and ngx.var.cuberoot_comp_check == "1")
    if not refused then return end
    local count, err = ngx.shared.cuberoot_unverified_requests:incr(ip, 1, 0, 60)
    if not count then ngx.log(ngx.ERR, "cuberoot_unverified counter: ", err); return end
    if count > 10 then package.loaded.cuberoot_ban_add(ip, 3600, "repeated_unverified_site") end
}
