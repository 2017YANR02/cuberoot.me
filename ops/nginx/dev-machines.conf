# Each computer has its own hostname and frp remote port. Keep HTTP-01
# reachable so certbot can issue and renew the three certificates.
server {
    listen 80;
    server_name dev-mac-mini.cuberoot.me dev-alienware.cuberoot.me dev-macbook-pro.cuberoot.me;

    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/cuberoot-spa;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Mac Mini reuses the existing dev.cuberoot.me tunnel on remote port 7100.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name dev-mac-mini.cuberoot.me;

    ssl_certificate /etc/letsencrypt/live/dev-machines/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev-machines/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /www/wwwlogs/dev-mac-mini.cuberoot.me.log;
    error_log /www/wwwlogs/dev-mac-mini.cuberoot.me.error.log;

    location / {
        proxy_pass http://127.0.0.1:7100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_cache off;
        proxy_buffering off;
        proxy_read_timeout 1d;
        proxy_send_timeout 1d;
    }
}

