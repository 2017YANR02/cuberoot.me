# Owner-authorized CN exemption. Use the connection address, never a visitor header.
map $host $cuberoot_comp_verification_enabled {
    include /etc/nginx/cuberoot-comp-verification-state.conf;
}
map "$cuberoot_comp_verification_enabled:$request_method:$cuberoot_cn_exempt:$request_uri" $cuberoot_comp_check {
    default 0;
    ~^1:(?:GET|HEAD):0:/v1/cubing-live(?:-stream)?(?:/|\?|$) 1;
    ~^1:(?:GET|HEAD):0:/api/comp/(?!access(?:/|\?|$)) 1;
}
map $http_origin $cuberoot_comp_cors_origin {
    default "";
    ~^https://(?:[a-z0-9-]+\.)?cuberoot\.me$ $http_origin;
    ~^https://[a-z0-9-]+\.vercel\.app$ $http_origin;
    ~^http://(?:localhost|127\.0\.0\.1):3000$ $http_origin;
}

# Generated monthly by ops/geoip/update-cn-ranges.ts (IPv4 and IPv6).
geo $remote_addr $cuberoot_cn_exempt {
    default 0;
    include /etc/nginx/cuberoot-cn-ranges.conf;
}
map $cuberoot_cn_exempt $cuberoot_limited_ip {
    default $binary_remote_addr;
    1 "";
}
map $cuberoot_cn_exempt $cuberoot_page_budget_key {
    default pages;
    1 "";
}
map $cuberoot_cn_exempt $cuberoot_api_total_key {
    default api;
    1 "";
}
map "$uri:$cuberoot_cn_exempt" $cuberoot_calc_denied {
    default 0;
    "/zh/calc:0" 1;
}

# Shared traffic zones for cuberoot.me, next.cuberoot.me and api.cuberoot.me.
# Empty keys are not counted; all workers and both web hostnames use the same
# budgets for the same costly route family.
# One fixed key across IPs, workers and both web hostnames. Count page/RSC
# requests, including prefetches; exclude known assets and independent APIs.
# This is a sustained 600/minute budget with burst headroom, not a fixed window.
map $uri $cuberoot_page_total_key {
    default $cuberoot_page_budget_key;
    ~^/(?:zh/|en/)?(?:_next|_vercel|api|v1|tools|stats|blog|blog-test)(?:/|$) "";
    ~*\.(?:js|mjs|css|map|json|xml|txt|ico|png|jpe?g|gif|webp|avif|svg|woff2?|ttf|otf|wasm|mp4|webm|mp3|pdf)$ "";
}
limit_req_zone $cuberoot_page_total_key zone=cuberoot_page_total:1m rate=600r/m;
map $uri $cuberoot_detail_ip_key {
    default "";
    /wca/comp/stats "";
    /wca/comp/stats/ "";
    /zh/wca/comp/stats "";
    /zh/wca/comp/stats/ "";
    /wca/comp/sources "";
    /wca/comp/sources/ "";
    /zh/wca/comp/sources "";
    /zh/wca/comp/sources/ "";
    # Competition result/schedule subpages load the same competition API as
    # the detail page. Count all descendants in the same per-IP bucket.
    ~^/(?:zh/)?wca/comp/[A-Za-z0-9_-]+(?:/.*)?$ $cuberoot_limited_ip;
    ~^/(?:zh/)?wca/persons/[A-Za-z0-9_-]+/?$ $cuberoot_limited_ip;
}
map $cuberoot_detail_ip_key $cuberoot_detail_total_key {
    default detail;
    "" "";
}
map $uri $cuberoot_calc_ip_key {
    default "";
    /calc $cuberoot_limited_ip;
    /zh/calc $cuberoot_limited_ip;
}
map $cuberoot_calc_ip_key $cuberoot_calc_total_key {
    default calc;
    "" "";
}
map $uri $cuberoot_comp_proxy_ip_key {
    default "";
    ~^/api/comp/[A-Za-z0-9_-]+/?$ $cuberoot_limited_ip;
}
map $cuberoot_comp_proxy_ip_key $cuberoot_comp_proxy_total_key {
    default comp;
    "" "";
}
map $uri $cuberoot_live_ip_key {
    default "";
    ~^/v1/cubing-live/[A-Za-z0-9_-]+/?$ $cuberoot_limited_ip;
}
map $cuberoot_live_ip_key $cuberoot_live_total_key {
    default live;
    "" "";
}
limit_req_zone $cuberoot_detail_ip_key zone=cuberoot_detail_ip:10m rate=30r/m;
limit_req_zone $cuberoot_detail_total_key zone=cuberoot_detail_total:1m rate=5r/s;
limit_req_zone $cuberoot_calc_ip_key zone=cuberoot_calc_ip:10m rate=10r/m;
limit_req_zone $cuberoot_calc_total_key zone=cuberoot_calc_total:1m rate=2r/s;
limit_req_zone $cuberoot_comp_proxy_ip_key zone=cuberoot_comp_proxy_ip_v2:10m rate=20r/m;
limit_req_zone $cuberoot_comp_proxy_total_key zone=cuberoot_comp_proxy_total_v2:1m rate=2r/s;
limit_req_zone $cuberoot_live_ip_key zone=cuberoot_live_ip:10m rate=30r/m;
limit_req_zone $cuberoot_live_total_key zone=cuberoot_live_total:1m rate=2r/s;
limit_conn_zone $cuberoot_live_total_key zone=cuberoot_live_concurrency:1m;
limit_req_zone $cuberoot_api_total_key zone=cuberoot_api_total_v2:1m rate=30r/s;
