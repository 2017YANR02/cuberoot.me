# 旧 Cube Platform 已退役。保留 vhost 只为明确返回 410,不跳转也不接应用。

server {
    listen 80;
    listen [::]:80;
    server_name platform.cuberoot.me;

    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/cuberoot-spa;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-store" always;
        return 410;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name platform.cuberoot.me;

    ssl_certificate /etc/letsencrypt/live/platform.cuberoot.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/platform.cuberoot.me/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_timeout 10m;
    ssl_session_cache shared:SSL:10m;

    access_log /www/wwwlogs/platform.cuberoot.me.log;
    error_log /www/wwwlogs/platform.cuberoot.me.error.log;

    # acme-challenge for renewals
    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/cuberoot-spa;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-store" always;
        return 410;
    }
}
