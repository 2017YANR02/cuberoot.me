# rtc.cuberoot.me —— LiveKit 信令的 TLS 入口(/timer 联机对战房间的视频通话)。
#
# 只反代**信令**(HTTP + WebSocket → 127.0.0.1:7880)。媒体走 UDP 7882-7892 和 TCP 7881
# 直连,**不经过 nginx** —— nginx 不转发 UDP,把媒体往这儿引是最常见的错误配置。
#
# 端口通不通由云控制台的安全组决定(主机 firewalld 是关的)。漏开 UDP 那段的表现是
# 「能进房、看得到人、但没画面没声音」;排障表见 ops/livekit/README.md。

server {
    listen 80;
    listen [::]:80;
    server_name rtc.cuberoot.me;

    # 证书续期走 certbot webroot,与 api/next/static 等兄弟子域共用同一个 webroot
    # (apex+www 因 DNS 分线路必须走 acme.sh DNS-01,子域不受影响,别混)。
    location /.well-known/acme-challenge/ {
        root /www/wwwroot/cuberoot-spa;
    }

    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name rtc.cuberoot.me;

    ssl_certificate     /etc/letsencrypt/live/rtc.cuberoot.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rtc.cuberoot.me/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:7880;
        proxy_http_version 1.1;

        # WebSocket 升级。漏掉这两行 = 客户端一直重连,报 "signal connection failed"。
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 信令是整场通话都开着的长连接,默认 60s 读超时会把人踢下线。
        proxy_read_timeout 7d;
        proxy_send_timeout 7d;
    }
}
