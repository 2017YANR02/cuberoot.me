<div id="xcross-ranking-demo">
  <div class="viz-controls">
    <label class="form-label">现有测试打乱

    </label>

  <p class="text-small text-muted">D 底 · 最短步数 + 2 步搜索范围</p>

  <div class="text-small text-muted" data-count></div>
</div>

<script>
(() => {
  const root = document.getElementById('xcross-ranking-demo');
  const data = JSON.parse(document.getElementById('xcross-ranking-data').textContent);
  const get = name => root.querySelector('[data-' + name + ']');
  const slider = root.querySelector('#xcross-step');
  let sample = 0, stage = 1, version = 'current', step = 1, timer = null;
  const row = () => data.results.find(r => r.index === sample && r.stage === stage);
  const solution = () => row()[version];
  get('front').innerHTML = data.front;
  get('back').innerHTML = data.back;
  const frontFills = get('front').querySelectorAll('[fill]');
  const backFills = get('back').querySelectorAll('[fill]');
  const phase = n => n === 0 ? '初始' : '第 ' + n + ' 步';
  const stateText = r => {
    if (r.corner && r.edge) return r.slot + ' 已归位';
    const facts = [];
    if (r.pair) facts.push('棱角成对');
    if (r.bonds.length) facts.push('连接十字棱');
    if (r.edge) facts.push('中层棱已归位');
    if (r.corner) facts.push('角已归位');
    return r.slot + '：' + (facts.join('、') || '暂无可用结构');
  };
  function stop() { if (timer) clearInterval(timer); timer = null; get('play').textContent = '播放'; }
  function save() {
    if (window.openai && window.openai.setWidgetState) window.openai.setWidgetState({
      modelContent: { scramble: row().scramble, stage: stage === 1 ? 'XCross' : 'XXCross', version, solution: solution().m, step },
      privateContent: { sample, stage, version, step }
    }).catch(() => {});
  }
  function drawStep(announce = true) {
    const sol = solution();
    step = Math.max(0, Math.min(step, sol.frames.length - 1));
    const frame = sol.frames[step];
    frontFills.forEach((el, i) => el.setAttribute('fill', frame.front[i]));
    backFills.forEach((el, i) => el.setAttribute('fill', frame.back[i]));
    slider.max = sol.frames.length - 1; slider.value = step;
    get('previous').disabled = step === 0;
    get('next').disabled = step === sol.frames.length - 1;
    get('step-label').textContent = (step ? '第 ' + step + ' / ' + sol.effort.moves + ' 步 · ' + frame.move : '打乱后 · 0 / ' + sol.effort.moves);
    get('status').setAttribute('aria-live', announce ? 'polite' : 'off');
    get('status').textContent = frame.rows.map(stateText).join('；') + ' · 十字 ' + frame.cross + '/4';
  }
  function render() {
    get('sample').value = sample; get('stage').value = stage;
    get('scramble').textContent = row().scramble;
    ['old', 'current'].forEach(v => {
      const sol = row()[v], alg = get(v + '-alg'), structure = get(v + '-structure');
      alg.replaceChildren();
      const formula = document.createElement('div'); formula.className = 'alg'; formula.textContent = sol.m; alg.append(formula);
      const info = document.createElement('div'); info.className = 'sub text-small text-muted'; info.textContent = sol.effort.moves + ' 步 · ' + sol.c; alg.append(info);
      structure.replaceChildren();
      const first = document.createElement('div'); first.className = 'text-small';
      first.textContent = sol.c.split(' ').map((slot, i) => slot + ' 起手 ' + phase(sol.anchors[i])).join('；'); structure.append(first);
      const loss = document.createElement('div'); loss.className = 'sub text-small'; loss.textContent = '目标对拆开 ' + sol.pairBreaks + ' 次'; structure.append(loss);
      root.querySelector('[data-version="' + v + '"]').setAttribute('aria-pressed', String(v === version));
    });
    get('count').textContent = '最短 ' + row().min + ' 步 · 新排序比较 ' + row().candidates + ' 条候选 · 所示解法已验解';
    drawStep();
  }
  get('sample').addEventListener('change', e => { stop(); sample = Number(e.target.value); step = 0; render(); save(); });
  get('stage').addEventListener('change', e => { stop(); stage = Number(e.target.value); step = 0; render(); save(); });
  root.querySelectorAll('[data-version]').forEach(button => button.addEventListener('click', () => { stop(); version = button.dataset.version; step = 0; render(); save(); }));
  slider.addEventListener('input', () => { stop(); step = Number(slider.value); drawStep(); save(); });
  get('previous').addEventListener('click', () => { stop(); step--; drawStep(); save(); });
  get('next').addEventListener('click', () => { stop(); step++; drawStep(); save(); });
  get('play').addEventListener('click', () => {
    if (timer) { stop(); save(); return; }
    if (step === solution().frames.length - 1) step = 0;
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) { step++; drawStep(); save(); return; }
    get('play').textContent = '暂停'; drawStep();
    timer = setInterval(() => { step++; drawStep(false); if (step === solution().frames.length - 1) { stop(); save(); } }, 1100);
  });
  function restore(saved) {
    const p = saved && saved.privateContent;
    if (!p) return;
    if ([0, 1, 2].includes(p.sample)) sample = p.sample;
    if ([1, 2].includes(p.stage)) stage = p.stage;
    if (['old', 'current'].includes(p.version)) version = p.version;
    if (Number.isInteger(p.step)) step = p.step;
  }
  restore(window.openai && window.openai.widgetState); render();
  window.addEventListener('openai:set_globals', event => { const saved = event.detail && event.detail.globals && event.detail.globals.widgetState; if (saved) { stop(); restore(saved); render(); } });
  window.addEventListener('pagehide', stop);
})();
</script>
