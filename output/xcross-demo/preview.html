(() =&gt; {

  const slider = root.querySelector(&#x27;#xcross-step&#x27;);
  let sample = 0, stage = 1, version = &#x27;current&#x27;, step = 1, timer = null;
  const row = () =&gt; data.results.find(r =&gt; r.index === sample &amp;&amp; r.stage === stage);
  const solution = () =&gt; row()[version];
  get(&#x27;front&#x27;).innerHTML = data.front;
  get(&#x27;back&#x27;).innerHTML = data.back;
  const frontFills = get(&#x27;front&#x27;).querySelectorAll(&#x27;[fill]&#x27;);
  const backFills = get(&#x27;back&#x27;).querySelectorAll(&#x27;[fill]&#x27;);
  const phase = n =&gt; n === 0 ? &#x27;初始&#x27; : &#x27;第 &#x27; + n + &#x27; 步&#x27;;
  const stateText = r =&gt; {
    if (r.corner &amp;&amp; r.edge) return r.slot + &#x27; 已归位&#x27;;
    const facts = [];
    if (r.pair) facts.push(&#x27;棱角成对&#x27;);
    if (r.bonds.length) facts.push(&#x27;连接十字棱&#x27;);
    if (r.edge) facts.push(&#x27;中层棱已归位&#x27;);
    if (r.corner) facts.push(&#x27;角已归位&#x27;);
    return r.slot + &#x27;：&#x27; + (facts.join(&#x27;、&#x27;) || &#x27;暂无可用结构&#x27;);

  function stop() { if (timer) clearInterval(timer); timer = null; get(&#x27;play&#x27;).textContent = &#x27;播放&#x27;; }
  function save() {
    if (window.openai &amp;&amp; window.openai.setWidgetState) window.openai.setWidgetState({
      modelContent: { scramble: row().scramble, stage: stage === 1 ? &#x27;XCross&#x27; : &#x27;XXCross&#x27;, version, solution: solution().m, step },
      privateContent: { sample, stage, version, step }

  }

    get(&#x27;sample&#x27;).value = sample; get(&#x27;stage&#x27;).value = stage;
    get(&#x27;scramble&#x27;).textContent = row().scramble;

      structure.replaceChildren();
      const first = document.createElement(&#x27;div&#x27;); first.className = &#x27;text-small&#x27;;
      first.textContent = sol.c.split(&#x27; &#x27;).map((slot, i) =&gt; slot + &#x27; 起手 &#x27; + phase(sol.anchors[i])).join(&#x27;；&#x27;); structure.append(first);
      const loss = document.createElement(&#x27;div&#x27;); loss.className = &#x27;sub text-small&#x27;; loss.textContent = &#x27;目标对拆开 &#x27; + sol.pairBreaks + &#x27; 次&#x27;; structure.append(loss);

    drawStep();

  get(&#x27;stage&#x27;).addEventListener(&#x27;change&#x27;, e =&gt; { stop(); stage = Number(e.target.value); step = 0; render(); save(); });
  root.querySelectorAll(&#x27;[data-version]&#x27;).forEach(button =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; { stop(); version = button.dataset.version; step = 0; render(); save(); }));

  get(&#x27;next&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; { stop(); step++; drawStep(); save(); });

})();
