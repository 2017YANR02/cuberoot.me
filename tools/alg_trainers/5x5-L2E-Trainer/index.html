		// body.outerHTML 替换会移除之前注入的语言切换按钮，需要重新注入
		var _i18nPoll = setInterval(function() {
			if (document.getElementById('timer') && window.I18n && I18n._ready) {
				clearInterval(_i18nPoll);
				I18n.apply();
				I18n._injectToggle();
				I18n._updateToggle();
			}
		}, 200);
