import groovy.json.JsonSlurper

apply plugin: 'com.android.application'

def mobilePackage = new JsonSlurper().parse(file('../../package.json'))
def versionParts = mobilePackage.version.toString().tokenize('.')
if (versionParts.size() != 3 || !versionParts.every { part -> part ==~ /\d+/ }) {
    throw new GradleException("packages/mobile/package.json must use numeric major.minor.patch versioning")
}
def versionNumbers = versionParts.collect { it.toLong() }
if (versionNumbers[1] > 999 || versionNumbers[2] > 999) {
    throw new GradleException('Minor and patch versions must stay between 0 and 999')
}
def mobileVersionCodeLong = (System.getenv('MOBILE_VERSION_CODE')
        ?: (versionNumbers[0] * 1_000_000
        + versionNumbers[1] * 1_000
        + versionNumbers[2]).toString()).toLong()
if (mobileVersionCodeLong < 1 || mobileVersionCodeLong > 2_100_000_000) {
    throw new GradleException('MOBILE_VERSION_CODE must be between 1 and 2100000000')
}
def mobileVersionCode = mobileVersionCodeLong.toInteger()

def uploadSigning = [
    storeFile: System.getenv('MOBILE_UPLOAD_KEYSTORE_FILE'),
    storePassword: System.getenv('MOBILE_UPLOAD_STORE_PASSWORD'),
    keyAlias: System.getenv('MOBILE_UPLOAD_KEY_ALIAS'),
    keyPassword: System.getenv('MOBILE_UPLOAD_KEY_PASSWORD'),
]
def suppliedSigningValues = uploadSigning.values().findAll { it }
if (!suppliedSigningValues.isEmpty() && suppliedSigningValues.size() != uploadSigning.size()) {
    throw new GradleException('All MOBILE_UPLOAD_* signing variables must be set together')
}
def hasUploadSigning = suppliedSigningValues.size() == uploadSigning.size()
if (System.getenv('MOBILE_REQUIRE_RELEASE_SIGNING') == 'true' && !hasUploadSigning) {
    throw new GradleException('Release signing is required but MOBILE_UPLOAD_* variables are missing')
}

android {
    namespace = "me.cuberoot.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "me.cuberoot.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode mobileVersionCode
        versionName mobilePackage.version.toString()
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (hasUploadSigning) {
            upload {
                storeFile file(uploadSigning.storeFile)
                storePassword uploadSigning.storePassword
                keyAlias uploadSigning.keyAlias
                keyPassword uploadSigning.keyPassword
            }
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasUploadSigning) signingConfig signingConfigs.upload
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
