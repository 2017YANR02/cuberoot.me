services:
  next-app:
    build:
      context: ../..
      dockerfile: packages/platform/Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://127.0.0.1:3100}
    image: cube-platform:latest
    container_name: cube-platform
    restart: unless-stopped
    ports:
      - "3100:3000"
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://127.0.0.1:3100}
      DB_PATH: /data/data.db
      TEACHING_API_BASE_URL: ${TEACHING_API_BASE_URL:?Set TEACHING_API_BASE_URL in .env}
      TEACHING_PLATFORM_SECRET: ${TEACHING_PLATFORM_SECRET:?Set TEACHING_PLATFORM_SECRET in .env}
      SMS_PROVIDER: ${SMS_PROVIDER:?Set SMS_PROVIDER in .env}
      SMS_ALIYUN_ACCESS_KEY_ID: ${SMS_ALIYUN_ACCESS_KEY_ID:-}
      SMS_ALIYUN_ACCESS_KEY_SECRET: ${SMS_ALIYUN_ACCESS_KEY_SECRET:-}
      SMS_ALIYUN_SIGN_NAME: ${SMS_ALIYUN_SIGN_NAME:-}
      SMS_ALIYUN_TEMPLATE_CODE: ${SMS_ALIYUN_TEMPLATE_CODE:-}
      SMS_TENCENT_SECRET_ID: ${SMS_TENCENT_SECRET_ID:-}
      SMS_TENCENT_SECRET_KEY: ${SMS_TENCENT_SECRET_KEY:-}
      SMS_TENCENT_SDK_APP_ID: ${SMS_TENCENT_SDK_APP_ID:-}
      SMS_TENCENT_SIGN_NAME: ${SMS_TENCENT_SIGN_NAME:-}
      SMS_TENCENT_TEMPLATE_ID: ${SMS_TENCENT_TEMPLATE_ID:-}
      SMS_TENCENT_REGION: ${SMS_TENCENT_REGION:-}
    volumes:
      - cube-data:/data

volumes:
  cube-data:
