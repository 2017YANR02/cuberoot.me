<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Web Bluetooth 裸测</title>
<!--
  A deliberately bare Web Bluetooth page. No framework, no bundler, no imports,
  no service worker, nothing of the app at all — one script tag and four
  buttons, served from the same origin as /timer.

  It exists to settle one question that the in-app probe could not: whether
  `requestDevice` fails here because of anything *we* do, or because of the page
  it is called from. On iOS Bluefy, cstimer.net connects on the first try while
  cuberoot.me refuses even `{acceptAllDevices: true}` with a bare `2` — and the
  same failure appears on next.cuberoot.me, so it is not the origin either.

  If a button here opens the chooser, the fault is in the app. If none of them
  do, the app is innocent and the difference is somewhere between the two sites
  that no option can reach.
-->
<style>
  :root { color-scheme: light dark; }
  body { font: 15px/1.6 system-ui, sans-serif; margin: 0; padding: 16px; max-width: 640px; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  p.sub { margin: 0 0 16px; opacity: .7; font-size: 13px; }
  button { display: block; width: 100%; margin: 0 0 8px; padding: 12px; font: inherit;
           text-align: left; border-radius: 8px; cursor: pointer; }
  button small { display: block; opacity: .7; font-size: 12px; }
  pre { font: 12px/1.6 ui-monospace, monospace; white-space: pre-wrap; word-break: break-all;
        border-radius: 8px; padding: 10px; margin: 12px 0 0; user-select: text; }
  .env { opacity: .75; }
</style>

<h1>Web Bluetooth 裸测</h1>
<p class="sub">纯静态页面，没有任何框架代码。每个按钮发一次 <code>requestDevice</code>，把浏览器原样抛回来的东西打出来。选择框弹出来后点「取消」即可 —— 弹出来本身就是结果。</p>

<button id="b0">0. 等蓝牙就绪，再发最小调用<small>先轮询 getAvailability() 直到 true（最多 8 秒），然后才调用</small></button>
<button id="b1">1. 最小调用<small>{ acceptAllDevices: true }</small></button>
<button id="b2">2. 单条名字前缀<small>{ filters: [{ namePrefix: 'GAN' }] }</small></button>
<button id="b3">3. cstimer 的那套服务 UUID<small>它在同一台手机上能连</small></button>
<button id="b4">4. 我们 /timer 实际发的那套<small>13 条过滤 + 服务列表 + 厂商编号</small></button>

<pre id="out"></pre>
<pre id="env" class="env"></pre>

<script>
(function () {
  var out = document.getElementById('out');

  // Same shape as the app's describeError: never collapse a thrown value into
  // one character. A bare 2 and the string "2" are different bridge behaviours.
  function describe(e) {
    if (e === null) return 'null';
    if (e === undefined) return 'undefined';
    if (typeof e !== 'object') return String(e) + ' (' + typeof e + ')';
    var name = '', msg = '', code = '';
    try { name = typeof e.name === 'string' ? e.name : ''; } catch (x) {}
    try { msg = typeof e.message === 'string' ? e.message : ''; } catch (x) {}
    try { code = (typeof e.code === 'number' || typeof e.code === 'string') ? String(e.code) : ''; } catch (x) {}
    var head = [name, msg].filter(Boolean).join(': ');
    if (head) return code && head.indexOf(code) < 0 ? head + ' (code ' + code + ')' : head;
    if (code) return 'code ' + code;
    try { var j = JSON.stringify(e); if (j && j !== '{}') return Object.prototype.toString.call(e) + ' ' + j; } catch (x) {}
    return Object.prototype.toString.call(e);
  }

  function log(s) { out.textContent += s + '\n'; }

  // A dismissed chooser is a success: it means the picker opened.
  var DISMISSED = { NotFoundError: 1, NotAllowedError: 1, AbortError: 1 };

  // Resolves true when the chooser opened (picked or dismissed), false when the
  // browser refused to show it at all.
  function run(label, opts) {
    log('▶ ' + label + ' …');
    if (!navigator.bluetooth) { log('  ✗ navigator.bluetooth 不存在'); return Promise.resolve(false); }
    try {
      return navigator.bluetooth.requestDevice(opts).then(
        function (d) { log('  ✓ 弹出了，选中：' + (d && d.name ? d.name : '(无名)')); return true; },
        function (e) {
          var n = null;
          try { n = e && typeof e.name === 'string' ? e.name : null; } catch (x) {}
          if (n && DISMISSED[n]) { log('  ✓ 弹出了（已取消）'); return true; }
          log('  ✗ 被拒：' + describe(e));
          return false;
        }
      );
    } catch (e) {
      log('  ✗ 同步抛出：' + describe(e));
      return Promise.resolve(false);
    }
  }

  var CSTIMER_SERVICES = [
    '0000aadb-0000-1000-8000-00805f9b34fb',
    '0000aaaa-0000-1000-8000-00805f9b34fb',
    '6e400001-b5a3-f393-e0a9-e50e24dcca9e',
    '0000fff0-0000-1000-8000-00805f9b34fb',
    '0000180a-0000-1000-8000-00805f9b34fb',
    '6e400001-b5a3-f393-e0a9-e50e24dc4179',
    '8653000a-43e6-47b7-9cb0-5fc21d4ae340',
    '00000010-0000-fff7-fff6-fff5fff4fff0',
    '00001000-0000-1000-8000-00805f9b34fb',
    '0783b03e-7735-b5a0-1760-a305d2795cb0',
    '0000fd50-0000-1000-8000-00805f9b34fb'
  ];

  // iOS creates a CBCentralManager in state .unknown and moves it to
  // .poweredOn asynchronously. If Bluefy builds that manager lazily on the
  // first API touch, the very first call lands before it is ready — which
  // matches getAvailability() answering false on a freshly loaded page while
  // cstimer, whose own chkAvail() would reject on false, connects fine.
  // Bluefy has been seen returning a getAvailability() promise that never
  // settles — not resolved, not rejected. Everything that calls it must be
  // bounded, or the caller simply stops with nothing to show.
  function availability(ms) {
    if (!navigator.bluetooth || !navigator.bluetooth.getAvailability) return Promise.resolve('absent');
    return Promise.race([
      navigator.bluetooth.getAvailability().then(function (v) { return v ? 'true' : 'false'; },
                                                 function (e) { return 'threw: ' + describe(e); }),
      new Promise(function (r) { setTimeout(function () { r('HUNG (' + ms + 'ms 没有回应)'); }, ms); })
    ]);
  }

  function whenAvailable(timeoutMs) {
    var deadline = Date.now() + timeoutMs;
    return new Promise(function (resolve) {
      (function poll() {
        availability(1200).then(function (v) {
          if (v === 'true') return resolve('就绪（等了 ' + (timeoutMs - (deadline - Date.now())) + 'ms）');
          if (Date.now() >= deadline) return resolve('等了 ' + timeoutMs + 'ms 仍然是 ' + v);
          setTimeout(poll, 400);
        });
      })();
    });
  }

  // Two attempts in one tap. If the first call is itself what brings the native
  // stack up — plausible when getAvailability() answers false forever, since a
  // manager that is never created can never report poweredOn — then the second
  // attempt succeeds and that difference is the whole answer.
  document.getElementById('b0').onclick = function () {
    log('▶ 第一轮：等就绪 …');
    whenAvailable(4000).then(function (how) {
      log('  ' + how);
      return run('第一次调用', { acceptAllDevices: true });
    }).then(function (opened) {
      if (opened) return;
      log('▶ 第二轮：隔 1.5 秒再试一次 …');
      return new Promise(function (r) { setTimeout(r, 1500); }).then(function () {
        return availability(1200).then(function (v) { log('  此刻 getAvailability() → ' + v); });
      }).then(function () {
        return run('第二次调用', { acceptAllDevices: true });
      });
    });
  };
  document.getElementById('b1').onclick = function () {
    run('最小调用', { acceptAllDevices: true });
  };
  document.getElementById('b2').onclick = function () {
    run('单条名字前缀', { filters: [{ namePrefix: 'GAN' }] });
  };
  document.getElementById('b3').onclick = function () {
    // cstimer's own values: name prefixes plus a single service filter, and its
    // optionalServices union. No optionalManufacturerData.
    run('cstimer 的参数', {
      filters: [
        { namePrefix: 'GAN' }, { namePrefix: 'MG' }, { namePrefix: 'AiCube' },
        { namePrefix: 'Gi' }, { namePrefix: 'GoCube' }, { namePrefix: 'Rubiks' },
        { namePrefix: 'MHC' }, { namePrefix: 'QY-QYSC' }, { namePrefix: 'WCU_MY32' },
        { services: ['0000fff0-0000-1000-8000-00805f9b34fb'] }
      ],
      optionalServices: CSTIMER_SERVICES
    });
  };
  document.getElementById('b4').onclick = function () {
    run('我们的那套', {
      filters: [
        { services: ['8653000a-43e6-47b7-9cb0-5fc21d4ae340'] },
        { services: ['6e400001-b5a3-f393-e0a9-e50e24dcca9e'] },
        { services: ['00000010-0000-fff7-fff6-fff5fff4fff0'] },
        { services: ['0000fff0-0000-1000-8000-00805f9b34fb'] },
        { services: ['0783b03e-7735-b5a0-1760-a305d2795cb0'] },
        { services: ['00001000-0000-1000-8000-00805f9b34fb'] },
        { services: ['0000aadb-0000-1000-8000-00805f9b34fb'] },
        { services: ['6e400001-b5a3-f393-e0a9-e50e24dc4179'] },
        { namePrefix: 'GAN' }, { namePrefix: 'MG' }, { namePrefix: 'AiCube' },
        { namePrefix: 'Gi' }, { namePrefix: 'WCU' }
      ],
      optionalServices: CSTIMER_SERVICES.concat(['0000180f-0000-1000-8000-00805f9b34fb']),
      optionalManufacturerData: [1, 3, 5, 0x0100, 0xff01]
    });
  };

  // Environment, printed up front so a screenshot carries it.
  var env = ['origin: ' + location.origin,
             'secureContext: ' + window.isSecureContext,
             'navigator.bluetooth: ' + (navigator.bluetooth ? 'present' : 'MISSING'),
             'getAvailability: ' + (navigator.bluetooth && navigator.bluetooth.getAvailability ? 'present' : 'absent'),
             'getDevices: ' + (navigator.bluetooth && navigator.bluetooth.getDevices ? 'present' : 'absent'),
             'frames: ' + (window.top === window.self ? 'top-level' : 'IN A FRAME'),
             'UA: ' + navigator.userAgent];
  document.getElementById('env').textContent = env.join('\n');
  // getDevices() lists peripherals this origin was already granted. It needs no
  // user gesture, so it answers for free: a rejection here says whether the
  // bridge is refusing this page outright or merely has nothing to show.
  if (navigator.bluetooth && navigator.bluetooth.getDevices) {
    var gd = document.createElement('div');
    document.getElementById('env').appendChild(gd);
    navigator.bluetooth.getDevices().then(
      function (list) {
        gd.textContent = '\ngetDevices() → ' + (list && list.length ? list.length + ' 台: ' +
          list.map(function (d) { return d.name || '(无名)'; }).join(', ') : '空');
      },
      function (e) { gd.textContent = '\ngetDevices() 抛出：' + describe(e); }
    );
  }

  // Watch it rather than sampling once: if the answer flips from false to true
  // on its own, the native stack was simply still coming up, and every earlier
  // failure was a race we lost by asking too early.
  if (navigator.bluetooth && navigator.bluetooth.getAvailability) {
    var line = document.createElement('div');
    document.getElementById('env').appendChild(line);
    var t0 = Date.now(), seen = [], ticks = 0;
    line.textContent = '\ngetAvailability() 变化: 查询中…';
    (function watch() {
      availability(1200).then(function (v) {
        var last = seen.length ? seen[seen.length - 1].v : null;
        if (v !== last) seen.push({ t: Date.now() - t0, v: v });
        line.textContent = '\ngetAvailability() 变化: ' +
          seen.map(function (s) { return s.t + 'ms→' + s.v; }).join('  ');
        if (++ticks < 24) setTimeout(watch, 500);   // ~20s including the races
      });
    })();
  }
})();
</script>
