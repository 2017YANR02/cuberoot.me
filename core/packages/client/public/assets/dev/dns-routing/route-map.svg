    <path d="M40 222h290" stroke="#9eada7" stroke-width="2"/>
    <circle cx="62" cy="199" r="5" fill="#c67847"/>
    <circle cx="79" cy="199" r="5" fill="#d7b694"/>
    <circle cx="96" cy="199" r="5" fill="#9eada7"/>
    <rect x="68" y="251" width="232" height="48" rx="7" fill="#f3f4ef" stroke="#cbd4cf"/>
    <path d="M89 275v-8a6 6 0 0 1 12 0v8m-15 0h18v13H86z" fill="none" stroke="#52665f" stroke-width="2"/>
