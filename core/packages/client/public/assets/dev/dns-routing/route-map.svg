<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">CubeRoot DNS route illustration</title>
  <desc id="desc">One browser address is resolved by AliDNS into a China route to Alibaba Cloud and an overseas route to Vercel.</desc>
  <defs>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#d8ddd9" stroke-width="1"/>
    </pattern>
    <marker id="arrow-warm" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M1 1L7 4.5 1 8" fill="none" stroke="#c67847" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-cool" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M1 1L7 4.5 1 8" fill="none" stroke="#4c7a99" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1200" height="560" rx="22" fill="#f3f4ef"/>
  <rect width="1200" height="560" rx="22" fill="url(#grid)" opacity=".48"/>
  <path d="M35 42h160M35 50h74M1006 508h158M1085 516h79" fill="none" stroke="#aab6b3" stroke-width="2"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#667570" font-size="13" letter-spacing="2.4">
    <text x="42" y="91">01 / cuberoot.me</text>
    <text x="462" y="91">02 / DNS</text>
    <text x="880" y="91">03 / IP</text>
  </g>
  <g>
