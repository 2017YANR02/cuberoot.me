    <rect x="486" y="205" width="84" height="35" rx="5" fill="#526f61"/>
    <text x="503" y="229" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="16" letter-spacing="1" fill="#fffdfa">DNS</text>
    <text x="486" y="287" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="30" fill="#233a36">AliDNS</text>
    <text x="486" y="319" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#52665f">dns3 / dns4.hichina.com</text>
