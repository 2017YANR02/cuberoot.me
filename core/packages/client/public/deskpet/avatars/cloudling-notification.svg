<svg id="svg" xmlns="http://www.w3.org/2000/svg" width="880" height="720" viewBox="-32 -24 88 72" preserveAspectRatio="xMidYMid meet">
<style><![CDATA[
.statusbar {
  font-size: 10px;
  font-family: ui-monospace, monospace;
  color: #7A9DFF;
  background: #1f1f26;
  border-radius: 8px;
  padding: 6px 14px;
  min-width: 760px;
  text-align: center;
  letter-spacing: 0.05em;
}
.statusbar .phase-A { color: #7A9DFF; }
.statusbar .phase-B { color: #FFA56B; font-weight: 700; }
.statusbar .phase-C { color: #B1A7FF; }
.edge-rim-tight { stroke-opacity: .08; }
.edge-rim-soft { stroke-opacity: .06; }
.edge-contact { stroke-opacity: .08; }
@media (prefers-color-scheme: light) {
.statusbar { background: #fff; color: #3941FF; }
.edge-rim-tight { stroke-opacity: .15; }
.edge-rim-soft { stroke-opacity: .10; }
.edge-contact { stroke-opacity: .18; }
.cloud-drop-shadow { flood-opacity: .13; }
.food-cloud-shadow { flood-opacity: .28; flood-color: #5060FF; }
.food-cloud > path {
  stroke: #5870E8 !important;
  stroke-width: 1.2 !important;
  stroke-opacity: .9 !important;
  vector-effect: non-scaling-stroke !important;
}
}
]]></style>
