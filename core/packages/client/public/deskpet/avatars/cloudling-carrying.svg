<svg id="stage" xmlns="http://www.w3.org/2000/svg" width="880" height="720" viewBox="-32 -24 88 72" preserveAspectRatio="xMidYMid meet">
<style>
.edge-rim-tight { stroke-opacity: .08; }
.edge-rim-soft { stroke-opacity: .06; }
.edge-contact { stroke-opacity: .08; }
@media (prefers-color-scheme: light) {
.edge-rim-tight { stroke-opacity: .15; }
.edge-rim-soft { stroke-opacity: .10; }
.edge-contact { stroke-opacity: .18; }
.cloud-drop-shadow { flood-opacity: .13; }
}
</style>
<defs>
        
    <linearGradient id="crr-body" x1="12" y1="2" x2="12" y2="22" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" /><stop offset="0.5" stop-color="#f4f5f9" /><stop offset="1" stop-color="#dee2eb" />
    </linearGradient>
    <linearGradient id="crr-eye" x1="0" y1="3" x2="0" y2="21" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#B1A7FF" /><stop offset="0.5" stop-color="#7A9DFF" /><stop offset="1" stop-color="#3941FF" />
    </linearGradient>
    <radialGradient id="crr-hi" cx="0.45" cy="0.25" r="0.55">
      <stop offset="0" stop-color="#fff" stop-opacity="0.9" /><stop offset="1" stop-color="#fff" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="crr-food" x1="0" y1="-3" x2="0" y2="3" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" />
      <stop offset="0.56" stop-color="#F0F5FF" />
      <stop offset="1" stop-color="#DCE6FA" />
    </linearGradient>
    <radialGradient id="crr-food-hi" cx="0.4" cy="0.3" r="0.55">
      <stop offset="0" stop-color="#fff" stop-opacity="0.85" /><stop offset="1" stop-color="#fff" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="crr-food-rim" x1="-4" y1="-2" x2="4" y2="2" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#D6DFFF" />
      <stop offset="1" stop-color="#AAB9F6" />
    </linearGradient>
    <filter id="crr-shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow class="cloud-drop-shadow" dx="0" dy="0.6" stdDeviation="0.8" flood-color="#3941FF" flood-opacity="0.18" />
    </filter>
    <filter id="crr-food-shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow class="food-cloud-shadow" dx="0" dy="0.28" stdDeviation="0.36" flood-color="#7A9DFF" flood-opacity="0.08" />
    </filter>
    <filter id="crr-food-melt" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="0.10" result="soft" />
      <feDropShadow class="food-cloud-shadow" dx="0" dy="0.2" stdDeviation="0.35" flood-color="#3941FF" flood-opacity="0.08" />
    </filter>
    <filter id="crr-edge-blur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="0.16" />
    </filter>
    <clipPath id="crr-clip"><path d="M9.064 3.344a4.578 4.578 0 012.285-.312c1 .115 1.891.54 2.673 1.275.01.01.024.017.037.021a.09.09 0 00.043 0 4.55 4.55 0 013.046.275l.047.022.116.057a4.581 4.581 0 012.188 2.399c.209.51.313 1.041.315 1.595a4.24 4.24 0 01-.134 1.223.123.123 0 00.03.115c.594.607.988 1.33 1.183 2.17.289 1.425-.007 2.71-.887 3.854l-.136.166a4.548 4.548 0 01-2.201 1.388.123.123 0 00-.081.076c-.191.551-.383 1.023-.74 1.494-.9 1.187-2.222 1.846-3.711 1.838-1.187-.006-2.239-.44-3.157-1.302a.107.107 0 00-.105-.024c-.388.125-.78.143-1.204.138a4.441 4.441 0 01-1.945-.466 4.544 4.544 0 01-1.61-1.335c-.152-.202-.303-.392-.414-.617a5.81 5.81 0 01-.37-.961 4.582 4.582 0 01-.014-2.298.124.124 0 00.006-.056.085.085 0 00-.027-.048 4.467 4.467 0 01-1.034-1.651 3.896 3.896 0 01-.251-1.192 5.189 5.189 0 01.141-1.6c.337-1.112.982-1.985 1.933-2.618.212-.141.413-.251.601-.33.215-.089.43-.164.646-.227a.098.098 0 00.065-.066 4.51 4.51 0 01.829-1.615 4.535 4.535 0 011.837-1.388z" /></clipPath>
  
        <path id="crr-cloud-shape" d="M9.064 3.344a4.578 4.578 0 012.285-.312c1 .115 1.891.54 2.673 1.275.01.01.024.017.037.021a.09.09 0 00.043 0 4.55 4.55 0 013.046.275l.047.022.116.057a4.581 4.581 0 012.188 2.399c.209.51.313 1.041.315 1.595a4.24 4.24 0 01-.134 1.223.123.123 0 00.03.115c.594.607.988 1.33 1.183 2.17.289 1.425-.007 2.71-.887 3.854l-.136.166a4.548 4.548 0 01-2.201 1.388.123.123 0 00-.081.076c-.191.551-.383 1.023-.74 1.494-.9 1.187-2.222 1.846-3.711 1.838-1.187-.006-2.239-.44-3.157-1.302a.107.107 0 00-.105-.024c-.388.125-.78.143-1.204.138a4.441 4.441 0 01-1.945-.466 4.544 4.544 0 01-1.61-1.335c-.152-.202-.303-.392-.414-.617a5.81 5.81 0 01-.37-.961 4.582 4.582 0 01-.014-2.298.124.124 0 00.006-.056.085.085 0 00-.027-.048 4.467 4.467 0 01-1.034-1.651 3.896 3.896 0 01-.251-1.192 5.189 5.189 0 01.141-1.6c.337-1.112.982-1.985 1.933-2.618.212-.141.413-.251.601-.33.215-.089.43-.164.646-.227a.098.098 0 00.065-.066 4.51 4.51 0 01.829-1.615 4.535 4.535 0 011.837-1.388z" />
      </defs>
      <!-- 食物云 (背景层) -->
      
      <!-- cloudling: translate → spring → breath → (body roll) -->
      <g class="scene" transform="translate(3.659 -1.482)">
        <g class="spring" transform="translate(12 12) scale(1.0444) translate(-12 -12)">
          <g class="breath" transform="translate(12 12) scale(0.9825) translate(-12 -12)">
            <g class="body-roll" transform="rotate(-3.659 12 12)">
              
    <g class="cloudling-body">
      <g class="edge-system">
        <use class="edge-contact" href="#crr-cloud-shape" fill="none" stroke="#7d8aa7" stroke-width="1.05" stroke-linejoin="round" transform="translate(0 0.18)" filter="url(#crr-edge-blur)" />
        <use class="edge-rim-soft" href="#crr-cloud-shape" fill="none" stroke="#7A9DFF" stroke-width="0.90" stroke-linejoin="round" filter="url(#crr-edge-blur)" />
        <use class="edge-rim-tight" href="#crr-cloud-shape" fill="none" stroke="#aab3c6" stroke-width="0.42" stroke-linejoin="round" />
      </g>
      <g filter="url(#crr-shadow)">
        <use href="#crr-cloud-shape" fill="url(#crr-body)" />
        <rect x="1" y="2" width="22" height="11" fill="url(#crr-hi)" clip-path="url(#crr-clip)" />
      </g>
    </g>
  
              
              
              
            </g>
            <g class="eyes" transform="translate(0.51 0.00)"><rect x="7.7" y="9.50" width="2.6" height="5.00" rx="1.30" ry="1.30" fill="url(#crr-eye)" stroke="#fff" stroke-width="0.08" stroke-opacity="0.7" /><rect x="13.7" y="9.50" width="2.6" height="5.00" rx="1.30" ry="1.30" fill="url(#crr-eye)" stroke="#fff" stroke-width="0.08" stroke-opacity="0.7" /></g>
          </g>
        </g>
      </g>
  </svg>