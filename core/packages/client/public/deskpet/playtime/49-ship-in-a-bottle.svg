<title id="pt49-title">瓶中帆船 / Ship in a bottle</title><desc id="pt49-desc">轻轻拔开软木塞，瓶里的小帆船展开白帆。海浪在玻璃里起伏，扣好塞子，把一小片海收藏起来。 A gentle pull of the cork wakes a tiny sailing ship. White sails unfold over little waves before a pocket of sea is safely corked again.</desc>
