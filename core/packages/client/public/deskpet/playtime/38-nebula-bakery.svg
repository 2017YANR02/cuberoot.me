<title id="pt38-title">星云烘焙 / Nebula bakery</title><desc id="pt38-desc">小烤炉把星星烤得蓬松，稳稳托出一盘蓝莓星云，香气也变成了星屑。 A tiny oven puffs up a star, which is lifted out with blueberry icing and a fragrant trail of stardust.</desc>
