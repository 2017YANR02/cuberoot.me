<title id="pt45-title">篝火棉花糖 / Campfire treat</title><desc id="pt45-desc">守着小篝火，把棉花糖烤出金边。举起来吹凉，尝一口，再把下一颗移到火边。 Toast a marshmallow to a golden edge, lift it to cool, take a tiny bite, then slide the next one toward the fire.</desc>
