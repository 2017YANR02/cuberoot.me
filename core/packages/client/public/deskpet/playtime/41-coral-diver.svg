<title id="pt41-title">珊瑚潜水员 / Coral diver</title><desc id="pt41-desc">戴好铜边潜水头盔，俯身看看缓缓打开的贝壳。珍珠升起一圈柔光，气泡带着惊喜向上飘去。 A copper-rimmed diving helmet, a curious bow, and a shell opening slowly. A pearl rises in soft light as bubbles carry the surprise upward.</desc>
