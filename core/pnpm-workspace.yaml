packages:
  - 'apps/*'
  - 'packages/*'
  - 'jobs/*'
  - '!packages/platform'
# Corepack and pnpm/action-setup select the pinned version. Avoid pnpm 12's
# extra package-manager lockfile document, which breaks single-document readers.
pmOnFail: ignore
allowBuilds:
  better-sqlite3: true
  core-js: true
  esbuild: true
  sharp: false # next/image native build,POC 不用图片优化跳过
patchedDependencies:
  '@2017yanr02/continuous-corners@0.3.2': patches/@2017yanr02__continuous-corners@0.3.2.patch
  '@app-foundation/navigation-ui@0.2.9': patches/@app-foundation__navigation-ui@0.2.9.patch
  '@app-foundation/workspace-ui@0.1.0': patches/@app-foundation__workspace-ui@0.1.0.patch
  '@ffmpeg/ffmpeg@0.12.15': patches/@ffmpeg__ffmpeg@0.12.15.patch
  cubing@0.63.3: patches/cubing@0.63.3.patch
# These packages publish Three.js declarations without a types dependency.
# Pin their matching types so installs cannot resolve cubing's older hoisted types.
packageExtensions:
  'three-bvh-csg@0.0.18':
    dependencies:
      '@types/three': '0.183.1'
  'three-mesh-bvh@0.9.10':
    dependencies:
      '@types/three': '0.183.1'
minimumReleaseAgeExclude:
  - '@capacitor/android@8.5.3'
  - '@capacitor/cli@8.5.3'
  - '@capacitor/core@8.5.3'
  - '@capacitor/ios@8.5.3'

# Security floors for transitive dependencies; retain each undici major.
overrides:
  # navigation-ui's peer must resolve to the same bundled, patched package.
  '@2017yanr02/continuous-corners': 'file:vendor/continuous-corners-0.3.2.tgz'
  'body-parser@>=2.0.0 <2.4.0': '2.4.0'
  'fast-uri@>=3.0.0 <3.1.9': '3.1.9'
  'happy-dom@>=17.0.0 <21.0.4': '21.0.4'
  'ip-address@<10.7.4': '10.7.4'
  'qs@>=6.7.0 <6.16.1': '6.16.1'
  'undici@>=7.0.0 <7.30.1': '7.30.1'
  'undici@>=8.0.0 <8.12.2': '8.12.2'
  'zod@>=4.0.0 <4.6.6': '4.6.7'
