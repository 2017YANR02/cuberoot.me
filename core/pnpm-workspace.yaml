packages:
  - 'apps/*'
  - 'packages/*'
  - 'jobs/*'
  - '!packages/platform'
# Corepack and pnpm/action-setup select the pinned version. Avoid pnpm 12's
# extra package-manager lockfile document, which breaks single-document readers.
pmOnFail: ignore
allowBuilds:
  better-sqlite3: true
  core-js: true
  esbuild: true
  sharp: false # next/image native build,POC 不用图片优化跳过
patchedDependencies:
  cubing@0.63.3: patches/cubing@0.63.3.patch
