import groovy.json.JsonSlurper

apply plugin: 'com.android.application'

def mobilePackage = new JsonSlurper().parse(file('../../package.json'))
def versionParts = mobilePackage.version.toString().tokenize('.')
if (versionParts.size() != 3 || !versionParts.every { part -> part ==~ /\d+/ }) {
    throw new GradleException("apps/mobile/package.json must use numeric major.minor.patch versioning")
}
def versionNumbers = versionParts.collect { it.toLong() }
if (versionNumbers[1] > 999 || versionNumbers[2] > 999) {
    throw new GradleException('Minor and patch versions must stay between 0 and 999')
}
def mobileVersionCodeLong = (System.getenv('MOBILE_VERSION_CODE')
        ?: (versionNumbers[0] * 1_000_000
        + versionNumbers[1] * 1_000
        + versionNumbers[2]).toString()).toLong()
if (mobileVersionCodeLong < 1 || mobileVersionCodeLong > 2_100_000_000) {
    throw new GradleException('MOBILE_VERSION_CODE must be between 1 and 2100000000')
}
def mobileVersionCode = mobileVersionCodeLong.toInteger()

def uploadSigning = [
    storeFile: System.getenv('MOBILE_UPLOAD_KEYSTORE_FILE'),
    storePassword: System.getenv('MOBILE_UPLOAD_STORE_PASSWORD'),
    keyAlias: System.getenv('MOBILE_UPLOAD_KEY_ALIAS'),
    keyPassword: System.getenv('MOBILE_UPLOAD_KEY_PASSWORD'),
]
def suppliedSigningValues = uploadSigning.values().findAll { it }
if (!suppliedSigningValues.isEmpty() && suppliedSigningValues.size() != uploadSigning.size()) {
    throw new GradleException('All MOBILE_UPLOAD_* signing variables must be set together')
}
def hasUploadSigning = suppliedSigningValues.size() == uploadSigning.size()
if (System.getenv('MOBILE_REQUIRE_RELEASE_SIGNING') == 'true' && !hasUploadSigning) {
    throw new GradleException('Release signing is required but MOBILE_UPLOAD_* variables are missing')
}

android {
    buildFeatures { buildConfig true }
    namespace = "me.cuberoot.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        manifestPlaceholders.GETUI_APPID = ''
        buildConfigField 'String', 'GETUI_APP_ID', '""'
        applicationId "me.cuberoot.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode mobileVersionCode
        versionName mobilePackage.version.toString()
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (hasUploadSigning) {
            upload {
                storeFile file(uploadSigning.storeFile)
                storePassword uploadSigning.storePassword
                keyAlias uploadSigning.keyAlias
                keyPassword uploadSigning.keyPassword
            }
        }
    }
    buildTypes {
        debug {
            def pushAppId = System.getenv('GETUI_DEBUG_APP_ID') ?: ''
            manifestPlaceholders.GETUI_APPID = pushAppId
            buildConfigField 'String', 'GETUI_APP_ID', groovy.json.JsonOutput.toJson(pushAppId)
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            def pushAppId = System.getenv('GETUI_APP_ID') ?: ''
            manifestPlaceholders.GETUI_APPID = pushAppId
            buildConfigField 'String', 'GETUI_APP_ID', groovy.json.JsonOutput.toJson(pushAppId)
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasUploadSigning) signingConfig signingConfigs.upload
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation 'com.getui:gtsdk:3.3.15.0'
    implementation 'com.getui:gtc:3.3.3.0'
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.webkit:webkit:$androidxWebkitVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

// Vendor credentials belong to the matching Android package, never share debug/release IDs.
def pushVendors = [
    [artifact: 'com.assist-v3:oppo:3.6.0', keys: ['OPPO_APP_KEY', 'OPPO_APP_SECRET'], extra: ['com.google.code.gson:gson:2.13.2', 'commons-codec:commons-codec:1.18.0', 'androidx.annotation:annotation:1.9.1']],
    [artifact: 'com.assist-v3:vivo:3.2.0', keys: ['VIVO_APP_ID', 'VIVO_APP_KEY']],
    [artifact: 'com.getui.opt:xmp:3.3.7', keys: ['XIAOMI_APP_ID', 'XIAOMI_APP_KEY']],
    [artifact: 'com.getui.opt:mzp:3.3.2', keys: ['MEIZU_APP_ID', 'MEIZU_APP_KEY']],
    [artifact: 'com.getui.opt:honor:3.6.0', keys: ['HONOR_APP_ID'], extra: ['com.hihonor.mcs:push:7.0.61.303']],
]
['debug', 'release'].each { variant ->
    def prefix = variant == 'debug' ? 'GETUI_DEBUG_' : 'GETUI_'
    pushVendors.each { vendor ->
        def values = vendor.keys.collectEntries { key -> [(key): System.getenv(prefix + key) ?: ''] }
        if (values.values().any { it }) {
            if (!values.values().every { it } || !System.getenv(prefix + 'APP_ID')) {
                throw new GradleException("Incomplete ${prefix} vendor push configuration")
            }
            android.buildTypes[variant].manifestPlaceholders.putAll(values)
            dependencies.add(variant + 'Implementation', vendor.artifact)
            (vendor.extra ?: []).each { artifact -> dependencies.add(variant + 'Implementation', artifact) }
        }
    }
}

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found; optional Google services plugin not applied")
}
