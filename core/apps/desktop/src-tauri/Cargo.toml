[package]
name = "cuberoot-desktop"
version = "0.1.0"
description = "CubeRoot desktop host"
authors = ["CubeRoot"]
edition = "2021"

[features]
microsoft-store = []
mac-app-store = []
apple-iap-sandbox = ["mac-app-store"]

[lib]
name = "cuberoot_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
cc = "1"
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
arboard = { version = "3.6", default-features = false }
keyring = "4.2.0"
serde_json = "1"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-deep-link = "2.4.10"
tauri-plugin-blec = "0.12.0"
tauri-plugin-opener = "2.5.3"
tauri-plugin-single-instance = { version = "2.4.4", features = ["deep-link"] }
tauri-plugin-dialog = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging"] }
